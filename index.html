<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --mute:#66625b; --line:#e2ded5;
  --accent:#b3261e; --accent-ink:#ffffff; --ok:#1f7a4d; --warn:#9a5b00; --warn-bg:#fff3d6;
  --bad:#b3261e; --bad-bg:#fde4e1; --chip:#ece8df;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --card:#1f1e1c; --ink:#f1eee8; --mute:#a8a299; --line:#34322e;
    --accent:#ff6b5e; --accent-ink:#1a0806; --ok:#5fd39a; --warn:#ffc65c; --warn-bg:#3a2c0c;
    --bad:#ff8a80; --bad-bg:#3d1613; --chip:#2b2926;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Thonburi","Leelawadee UI",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.3;margin:8px 0 4px}
h2{font-size:19px;margin:24px 0 8px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{flex:1;max-width:160px;text-align:center;padding:10px 4px;text-decoration:none;color:var(--mute);font-size:14px;min-height:56px}
nav.tabs a b{display:block;font-size:20px;line-height:1.2;font-weight:400}
nav.tabs a.on{color:var(--accent);font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.haz{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:104px;padding:14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:19px}
.haz span{font-size:32px;line-height:1}
.haz:active{border-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}

.seg{display:flex;gap:6px;overflow-x:auto;margin:12px -16px;padding:0 16px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:16px;white-space:nowrap}
.seg a.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px 12px 54px;margin:8px 0;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
ol.steps.dont li::before{content:"✕";background:var(--bad)}
ol.steps .t{font-size:19px;font-weight:700;line-height:1.45}
ol.steps .d{color:var(--mute);font-size:15.5px;margin-top:4px}
.chip{display:inline-block;background:var(--chip);color:var(--mute);border-radius:6px;padding:0 7px;font-size:12.5px;margin:4px 4px 0 0;font-weight:400}
.back{display:inline-block;padding:8px 0;text-decoration:none;font-size:16px}
ul.plain{padding-left:20px;margin:6px 0}
ul.plain li{margin:4px 0}

details.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.cat summary{list-style:none;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary small{font-weight:400;color:var(--mute)}
.item{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.item input[type=checkbox]{flex:none;width:28px;height:28px;margin:2px 0 0;accent-color:var(--ok)}
.item .n{font-weight:600;line-height:1.45}
.item.done .n{color:var(--mute);text-decoration:line-through}
.item .q{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;font-size:14px;font-weight:700;margin-top:3px}
.item .d{color:var(--mute);font-size:14.5px}
.item .w{color:var(--bad);font-size:14.5px;font-weight:600}
.item .x{margin-top:6px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .x input{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.item .del{background:none;border:0;color:var(--mute);font-size:20px;padding:0 4px}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.card.aid{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.card.aid>span:first-child{font-size:32px;line-height:1}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
#qr svg{display:block;width:220px;max-width:70%;height:auto;margin:10px auto;background:#fff;border-radius:8px}
.tel{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel:first-child{border-top:0}
.tel b{font-size:22px;color:var(--accent);min-width:64px}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:15px}
.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.in{min-height:76px;resize:vertical}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
.step output{min-width:32px;text-align:center;font-weight:700;font-size:20px}
.src a{word-break:break-all;font-size:14px}

@media print{
  nav.tabs,.seg,.btns,.add,.del,.back{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  details.cat{break-inside:avoid;border-color:#999}
}
</style>
</head>

<script>
const DATA = {"guides":[{"id":"blackout","title":"ไฟดับวงกว้าง","summary":"ไฟดับเองไม่ค่อยฆ่าคน แต่คนตายจากก๊าซคาร์บอนมอนอกไซด์ของเครื่องปั่นไฟ ไฟไหม้จากเทียน เครื่องช่วยชีวิตหยุดทำงาน ความร้อน และอาหารเสีย หลักคือสำรองน้ำ แสงสว่าง เงินสด และไฟสำหรับอุปกรณ์แพทย์ไว้ก่อน","sources":[{"id":"ready-power","org":"Ready.gov (FEMA)","title":"Power Outages","url":"https://www.ready.gov/power-outages","country":"US"},{"id":"cdc-food","org":"CDC","title":"Keep Food Safe After a Disaster or Emergency","url":"https://www.cdc.gov/food-safety/foods/keep-food-safe-after-emergency.html","country":"US"},{"id":"fda-food","org":"FDA","title":"Food and Water Safety During Power Outages and Floods","url":"https://www.fda.gov/food/buy-store-serve-safe-food/food-and-water-safety-during-power-outages-and-floods","country":"US"},{"id":"cdc-co","org":"CDC","title":"Carbon Monoxide Poisoning Basics","url":"https://www.cdc.gov/carbon-monoxide/about/index.html","country":"US"},{"id":"wiki-iberia-2025","org":"Wikipedia","title":"2025 Iberian Peninsula blackout","url":"https://en.wikipedia.org/wiki/2025_Iberian_Peninsula_blackout","country":"INT"},{"id":"wiki-texas-2021","org":"Wikipedia","title":"2021 Texas power crisis","url":"https://en.wikipedia.org/wiki/2021_Texas_power_crisis","country":"INT"},{"id":"wiki-chile-2025","org":"Wikipedia","title":"2025 Chile blackout","url":"https://en.wikipedia.org/wiki/2025_Chile_blackout","country":"INT"},{"id":"pattayamail-south-2013","org":"Pattaya Mail","title":"14-province blackout not caused by human error: Probe panel","url":"https://www.pattayamail.com/business/14-province-blackout-not-caused-by-human-error-probe-panel-26754","country":"TH"},{"id":"krisinfo-home","org":"Krisinformation.se (หน่วยงานรัฐสวีเดน)","title":"Home preparedness","url":"https://www.krisinformation.se/en/hazards-and-risks/home-preparedness/","country":"SE"},{"id":"vumc-meds","org":"Vanderbilt University Medical Center Poison Control","title":"What is the Stability of Refrigerated Medications at Room Temperature?","url":"https://www.vumc.org/poison-control/toxicology-question-week/oct-3-2005-what-stability-refrigerated-medications-room-temperature","country":"US"},{"id":"sanook-lift","org":"Sanook","title":"วิธีเอาตัวรอดเมื่อ ลิฟต์ค้าง และสิ่งที่ไม่ควรทำเมื่อติดลิฟต์","url":"https://www.sanook.com/women/247013/","country":"TH"},{"id":"achi-cool","org":"Arkansas Center for Health Improvement","title":"How to keep cool in a power outage","url":"https://achi.net/newsroom/how-to-keep-cool-in-a-power-outage/","country":"US"}],"phases":{"before":[{"text":"สำรองน้ำดื่มอย่างน้อย 3 ลิตรต่อคนต่อวัน ให้พอ 7 วัน","detail":"ไฟดับวงกว้างมักทำให้น้ำประปาหยุดตามเพราะปั๊มไม่ทำงาน เก็บน้ำใช้แยกอีกส่วนสำหรับล้างและกดชักโครก หมุนเวียนน้ำดื่มตามวันหมดอายุ","ctx":"all","src":["krisinfo-home","wiki-texas-2021"]},{"text":"ใครใช้เครื่องช่วยหายใจ เครื่องผลิตออกซิเจน ให้วางแผนไฟสำรองกับแพทย์","detail":"ถามแพทย์ว่าเครื่องอยู่ได้นานเท่าไร มีแบตสำรองหรือถังออกซิเจนสำรองไหม และจะย้ายไปโรงพยาบาลไหนเมื่อไฟดับนาน เหตุปี 2568 มีผู้เสียชีวิตเพราะเครื่องหยุด","ctx":"all","src":["ready-power","wiki-iberia-2025","wiki-chile-2025"]},{"text":"ถามแพทย์หรือเภสัชกรว่ายาแช่เย็น เช่น อินซูลิน อยู่นอกตู้เย็นได้นานแค่ไหน","detail":"เตรียมกระติกและเจลเย็นไว้ในช่องแข็ง อินซูลินส่วนใหญ่ทนอุณหภูมิ 15-30°C ได้ราว 28 วัน แต่ห้องไทยที่ไม่มีแอร์ร้อนเกินนั้นได้","ctx":"all","src":["ready-power","vumc-meds"]},{"text":"มีไฟฉายให้ครบทุกคน พร้อมถ่านสำรอง วางในจุดที่คลำเจอในความมืด","detail":"ไฟฉายคาดหัวทำให้มือว่างเวลาเดินบันได ใช้ไฟฉายและโคม LED แทนเทียนเสมอ","ctx":"all","src":["ready-power"]},{"text":"เก็บเงินสดธนบัตรย่อยไว้ที่บ้าน พอซื้อของจำเป็นหลายวัน","detail":"ไฟดับสเปน-โปรตุเกส 2568 ตู้ ATM และการจ่ายด้วยบัตรใช้ไม่ได้ทันที พร้อมเพย์และ QR ต้องใช้ทั้งไฟและเน็ตเช่นกัน","ctx":"all","src":["wiki-iberia-2025","krisinfo-home"]},{"text":"มีวิทยุ AM/FM ใส่ถ่านหรือมือหมุน และรู้คลื่นข่าวของจังหวัด","detail":"เมื่อเสาสัญญาณมือถือแบตหมด วิทยุคือช่องทางเดียวที่ยังรับประกาศได้ ปี 2568 คนในสเปนแห่หาซื้อวิทยุใส่ถ่าน","ctx":"all","src":["wiki-iberia-2025","krisinfo-home"]},{"text":"ชาร์จพาวเวอร์แบงก์ให้เต็มเสมอ อย่างน้อย 20,000 mAh ต่อคน","detail":"20,000 mAh ชาร์จมือถือได้ราว 3-4 รอบ ถ้าต้องจ่ายพัดลม DC หรือเครื่อง CPAP ให้ดูเพาเวอร์สเตชัน 500-1,000 Wh และลองใช้จริงก่อน","ctx":"all","src":["ready-power"]},{"text":"เติมน้ำมันรถไม่ให้ต่ำกว่าครึ่งถัง ชาร์จรถไฟฟ้าไม่ให้ต่ำกว่าครึ่ง","detail":"หัวจ่ายน้ำมันและตู้ชาร์จใช้ไฟฟ้า ไฟดับแล้วเติมไม่ได้ รถยังเป็นที่ชาร์จมือถือและที่หลบร้อนชั่วคราวได้ ถ้าจอดกลางแจ้ง","ctx":"all","src":[]},{"text":"สำรองอาหารที่ไม่ต้องแช่เย็นและไม่ต้องหุงต้ม ให้พอ 3-7 วัน","detail":"ปลากระป๋อง ขนมปังกรอบ ถั่ว นม UHT อาหารเด็ก อาหารสัตว์เลี้ยง มีที่เปิดกระป๋องแบบมือ เท็กซัส 2564 ร้านค้าปิดและของหมดชั้นภายในไม่กี่วัน","ctx":"all","src":["ready-power","wiki-texas-2021"]},{"text":"ถามนิติฯ: เครื่องปั่นไฟตึกจ่ายอะไรบ้าง นานกี่ชั่วโมง น้ำมันสำรองเท่าไร","detail":"ถามเรื่องลิฟต์ ปั๊มน้ำ ปั๊มดับเพลิง ไฟบันไดหนีไฟ ประตูคีย์การ์ด ไม้กั้นที่จอดรถ ไฟฉุกเฉินแบบแบตเตอรี่มักอยู่ได้เพียงราว 1.5-2 ชั่วโมง","ctx":"condo","src":[]},{"text":"รู้วิธีเปิดประตูดิจิทัลล็อกเมื่อแบตหมด และพกกุญแจสำรองแบบโลหะ","detail":"ล็อกส่วนใหญ่ใช้ถ่านในตัวจึงยังทำงานตอนไฟดับ แต่ประตูส่วนกลางแบบคีย์การ์ดและแม่เหล็กอาจล็อกค้างหรือปลดเอง ถามนิติฯ ว่าเป็นแบบไหน","ctx":"condo","src":[]},{"text":"บ้านใช้น้ำบาดาลหรือปั๊มน้ำ ให้มีถังเก็บน้ำสูงหรือโอ่งสำรองไว้","detail":"ปั๊มไฟฟ้าหยุดทันทีที่ไฟดับ ถังสูงที่ปล่อยน้ำด้วยแรงโน้มถ่วงหรือคันโยกมือทำให้ยังมีน้ำใช้ เติมให้เต็มเป็นประจำ","ctx":["house","town"],"src":[]},{"text":"ติดเครื่องเตือนคาร์บอนมอนอกไซด์แบบใส่ถ่าน ถ้ามีเครื่องปั่นไฟ","detail":"ก๊าซนี้ไม่มีสี ไม่มีกลิ่น ติดใกล้ห้องนอน เปลี่ยนถ่านปีละ 2 ครั้ง และเตรียมสายพ่วงยาวพอให้วางเครื่องห่างบ้านเกิน 6 เมตร","ctx":["house","town"],"src":["cdc-co","ready-power"]},{"text":"บันทึกเบอร์ MEA 1130, PEA 1129, 1669, 199, 191, 1784 ลงกระดาษ","detail":"MEA ดูแลกรุงเทพฯ นนทบุรี สมุทรปราการ ที่เหลือเป็น PEA จดหมายเลขผู้ใช้ไฟจากบิลไว้ด้วยเพื่อแจ้งเหตุได้เร็ว","ctx":"all","src":[]},{"text":"ลองเปิดประตูม้วนไฟฟ้าและประตูรั้วรีโมทด้วยมือให้เป็นทุกคน","detail":"ส่วนใหญ่มีโซ่ดึงหรือกุญแจปลดมอเตอร์ ดูคู่มือหรือถามช่างที่ติดตั้ง แล้วลองจริงตอนไฟยังมี ถ้าเปิดไม่เป็น รถจะออกไม่ได้และประตูนั้นใช้เป็นทางหนีไม่ได้ เก็บกุญแจปลดล็อกไว้ใกล้ประตู","ctx":"town","src":[]},{"text":"รู้ว่าน้ำในบ้านมาจากถังบนที่สูงหรือจากปั๊ม และก๊อกไหนต่อตรงจากมิเตอร์","detail":"ถังบนหลังคาหรือดาดฟ้ายังจ่ายน้ำด้วยแรงโน้มถ่วงได้จนหมดถัง แต่ถ้าใช้ถังล่างกับปั๊ม น้ำจะหยุดเมื่อไฟดับ โดยเฉพาะห้องน้ำชั้นบน ก๊อกที่ต่อตรงจากท่อประปามักยังไหลถ้าประปายังมีแรงดัน","ctx":"town","src":[]}],"during":[{"text":"ห้ามเดินเครื่องปั่นไฟในบ้าน โรงรถ ระเบียง หรือใกล้หน้าต่างเด็ดขาด","detail":"ต้องอยู่กลางแจ้ง ห่างประตู หน้าต่าง ช่องลมเกิน 6 เมตร แม้เปิดประตูโรงรถก็ไม่ปลอดภัย สเปน 2568 ครอบครัว 3 คนเสียชีวิตจากเครื่องปั่นไฟในบ้าน","ctx":"all","src":["cdc-co","ready-power","wiki-iberia-2025"]},{"text":"ปวดหัว เวียนหัว คลื่นไส้ ขณะใช้เครื่องยนต์หรือเตาถ่าน ให้ออกไปที่โล่งทันที","detail":"เป็นอาการพิษคาร์บอนมอนอกไซด์ คล้ายไข้หวัด คนที่หลับอยู่ตายได้โดยไม่รู้ตัว พาทุกคนออกไปรับอากาศแล้วโทร 1669","ctx":"all","src":["cdc-co"]},{"text":"อุปกรณ์แพทย์ใกล้หมดไฟ ให้ย้ายไปโรงพยาบาลก่อนแบตหมด โทร 1669","detail":"อย่ารอจนเครื่องดับ โรงพยาบาลมีเครื่องปั่นไฟและส่วนใหญ่ยังทำงานได้ ปี 2568 มีผู้ป่วยใช้เครื่องช่วยหายใจที่บ้านเสียชีวิตเมื่อแบตหมด","ctx":"all","src":["wiki-iberia-2025","wiki-chile-2025","ready-power"]},{"text":"ใช้ไฟฉายหรือโคม LED อย่าใช้เทียน ถ้าจำเป็นห้ามทิ้งไว้ลับตา","detail":"เทียนล้มทำให้ไฟไหม้ และตอนไฟดับปั๊มน้ำดับเพลิงกับสัญญาณเตือนอาจไม่ทำงาน มาดริด 2568 มีผู้เสียชีวิตจากไฟไหม้ที่เกิดจากเทียน","ctx":"all","src":["wiki-iberia-2025"]},{"text":"ไฟดับหน้าร้อน: ย้ายผู้สูงอายุ เด็กเล็ก และผู้ป่วยลงมานอนชั้นล่าง","detail":"อากาศร้อนลอยขึ้น ชั้นล่างจึงมักเย็นกว่าชั้นบนที่อยู่ใต้หลังคา ปิดม่านด้านที่แดดส่อง เปิดหน้าต่างที่มีเหล็กดัดและมุ้งลวดให้ลมผ่าน และล็อกประตูหน้าตามปกติ","ctx":"town","src":["achi-cool"]},{"text":"วางไฟฉายหรือโคม LED ที่หัวบันไดและเชิงบันได ขึ้นลงทีละคนโดยจับราว","detail":"บันไดบ้านมักไม่มีหน้าต่างและมืดสนิทเมื่อไฟดับ การตกบันไดเป็นอุบัติเหตุที่เลี่ยงได้ อย่าถือเทียนขึ้นลงบันได และอย่าขนของจนมองไม่เห็นขั้นบันได","ctx":"town","src":[]},{"text":"ติดลิฟต์: กดปุ่มกระดิ่งหรืออินเตอร์คอม รอคนช่วย ห้ามงัดประตูหรือปีนออก","detail":"ในลิฟต์มีอากาศถ่ายเทพอ อันตรายจริงคือการตกช่องลิฟต์ตอนปีนออกเอง นั่งลง ประหยัดแบตมือถือ โทรนิติฯ หรือ 199","ctx":"condo","src":["sanook-lift"]},{"text":"ห้ามใช้ลิฟต์แม้ยังวิ่งด้วยไฟสำรอง ใช้บันไดพร้อมไฟฉาย","detail":"ไฟสำรองอาจหมดหรือสลับระบบกลางทางได้ทุกเมื่อ ลงบันไดโดยจับราว พักเป็นระยะ อย่าขนของหนักจนมองไม่เห็นขั้นบันได","ctx":"condo","src":[]},{"text":"รองน้ำใส่ถัง อ่าง และขวดทันทีที่ไฟดับ ก่อนน้ำในถังบนดาดฟ้าจะหมด","detail":"ตึกสูงใช้ปั๊มส่งน้ำขึ้น ไฟดับแล้วน้ำมักหยุดไหลภายในไม่กี่ชั่วโมง ชั้นบนสุดที่ใช้ปั๊มเพิ่มแรงดันอาจหยุดทันที ใช้น้ำอย่างประหยัด","ctx":"condo","src":["wiki-iberia-2025"]},{"text":"ปิดประตูตู้เย็นและช่องแข็งไว้ เปิดให้น้อยครั้งที่สุด","detail":"ตู้เย็นที่ไม่เปิดเก็บความเย็นได้ราว 4 ชั่วโมง ช่องแข็งเต็มตู้ราว 48 ชั่วโมง ครึ่งตู้ราว 24 ชั่วโมง จดเวลาที่ไฟดับไว้","ctx":"all","src":["cdc-food","ready-power","fda-food"]},{"text":"ย้ายยาแช่เย็นใส่กระติกพร้อมเจลเย็น ห่อผ้ากันยาสัมผัสน้ำแข็งโดยตรง","detail":"อินซูลินและวัคซีนห้ามแข็งตัว ถ้าแข็งแล้วต้องทิ้ง จดเวลาที่ยาออกจากตู้เย็น แล้วถามเภสัชกรก่อนใช้ต่อหากไฟดับเกิน 1 วัน","ctx":"all","src":["vumc-meds","ready-power"]},{"text":"ถอดปลั๊กแอร์ ตู้เย็น ทีวี คอมพิวเตอร์ เหลือหลอดไฟไว้ 1 ดวงเป็นสัญญาณ","detail":"ไฟที่กลับมาอาจกระชากหรือตกๆ ดับๆ ทำให้เครื่องใช้เสียหาย รอให้ไฟนิ่งสัก 5-10 นาทีแล้วค่อยเสียบทีละเครื่อง","ctx":"all","src":["ready-power"]},{"text":"กันร้อน: ดื่มน้ำบ่อย เช็ดตัวด้วยผ้าเปียก อยู่ชั้นล่างหรือฝั่งร่ม เปิดให้ลมผ่าน","detail":"เฝ้าดูผู้สูงอายุ เด็กเล็ก ผู้ป่วย ถ้าตัวร้อนจัด สับสน ผิวแห้งไม่มีเหงื่อ คือฮีตสโตรก รีบทำให้ตัวเย็นและโทร 1669 ไปที่ที่มีไฟถ้าร้อนเกินทน","ctx":"all","src":["ready-power"]},{"text":"ประหยัดแบตมือถือ: เปิดโหมดประหยัดพลังงาน ลดแสงจอ ใช้ข้อความแทนโทร","detail":"เสาสัญญาณมีแบตสำรองเพียงไม่กี่ชั่วโมง ปี 2568 การใช้งานเครือข่ายในสเปนเหลือราว 17% ของปกติ ส .bangkokbiznews.com/news/news-update/1185422","country":"TH"},{"id":"dsfrs-escape","org":"Devon and Somerset Fire and Rescue Service","title":"How to make an escape plan","url":"https://dsfire.gov.uk/node/541","country":"GB"},{"id":"lfb-houses","org":"London Fire Brigade","title":"Escape plan – houses and converted flats","url":"https://www.london-fire.gov.uk/safety/the-home/escape-plan/escape-plan-houses-and-converted-flats/","country":"GB"},{"id":"mgr-dindaeng","org":"MGR Online","title":"ไฟไหม้ทาวน์เฮาส์ 2 ชั้น ย่านดินแดง ลาม 4 คูหา เด็กเสียชีวิต 2 ราย","url":"https://mgronline.com/crime/detail/9540000158096","country":"TH"},{"id":"nfpa-escape","org":"National Fire Protection Association (NFPA)","title":"How to make a home fire escape plan","url":"https://www.nfpa.org/education-and-research/home-fire-safety/escape-planning","country":"US"},{"id":"thairath-bars-expert","org":"ไทยรัฐ (สัมภาษณ์นายกสมาคมธุรกิจรับสร้างบ้าน)","title":"เหล็กดัดดาบสองคม! กันขโมยเข้า ขังคนในออก ไขจุดทางหนีทีไล่เอาชีวิตรอด","url":"https://www.thairath.co.th/news/local/bangkok/1026681","country":"TH"},{"id":"thairath-ev-khonkaen","org":"ไทยรัฐ","title":"ชาร์จรถยนต์ไฟฟ้า ไฟไหม้บ้านวอด 4 ชีวิตหนีตายระทึก","url":"https://www.thairath.co.th/news/crime/2939881","country":"TH"}],"phases":{"before":[{"text":"วางแผนทางหนี 2 ทางจากทุกห้อง นัดจุดรวมพลนอกอาคาร ซ้อมปีละ 2 ครั้ง","detail":"ไฟเล็ก ๆ ลามเป็นไฟใหญ่ได้ในเวลาไม่ถึง 30 วินาที และบ้านลุกทั้งหลังได้ในราว 5 นาที จึงไม่มีเวลาคิดตอนเกิดเหตุ ต้องซ้อมจนทุกคนทำได้เอง","ctx":"all","src":["ready-home-fires"]},{"text":"ติดเครื่องตรวจจับควันในห้องนอนและทางเดิน ทดสอบสม่ำเสมอ","detail":"เครื่องที่ทำงานได้เพิ่มโอกาสรอดอย่างมาก โดยเฉพาะไฟไหม้ตอนหลับ เปลี่ยนถ่านตามกำหนด และเปลี่ยนทั้งตัวเมื่อครบ 10 ปี","ctx":"all","src":["ready-home-fires","ddpm-prevent"]},{"text":"เดินสำรวจบันไดหนีไฟทุกตัวในชั้นของคุณ นับจำนวนประตูจากห้องถึงบันได","detail":"ในควันจะมองไม่เห็นป้าย ต้องคลำผนังนับประตูไปได้ ตรวจด้วยว่าประตูหนีไฟไม่ล็อก ไม่มีของวางขวาง และปิดสนิทเองได้ ถ้าพบปัญหาให้แจ้งนิติบุคคลเป็นลายลักษณ์อักษร","ctx":"condo","src":["nida-highrise","wiki-wangfuk"]},{"text":"เหล็กดัดต้องมีช่องเปิดฉุกเฉินอย่างน้อย 1 ช่อง และทุกคนรู้ที่เก็บกุญแจ","detail":"เก็บกุญแจใกล้ช่องเปิด หยิบได้ในความมืด แต่พ้นมือคนนอก ลองไขเป็นระยะกันสนิมติด ห้องนอนทุกห้องควรออกได้โดยไม่ต้องผ่านห้องที่ไฟไหม้","ctx":["house","town"],"src":["thairath-bars","ready-home-fires"]},{"text":"มีถังดับเพลิงในจุดหยิบง่ายใกล้ทางออก และฝึกใช้ให้เป็นทุกคน","detail":"บ้านทั่วไปใช้ชนิดอเนกประสงค์ A-B-C (เชื้อเพลิงทั่วไป ของเหลวไวไฟ ไฟฟ้า) ดูเข็มมาตรวัดให้อยู่ในช่องเขียว จำ ดึง-เล็ง-บีบ-ส่าย","ctx":"all","src":["usfa-extinguisher","ddpm-prevent"]},{"text":"ตรวจสายไฟ ปลั๊ก เครื่องใช้ไฟฟ้า ถ้าเก่าหรือชำรุดให้ซ่อมหรือเปลี่ยน","detail":"ไฟฟ้าลัดวงจรเป็นสาเหตุที่พบซ้ำในเหตุไฟไหม้ใหญ่ของไทย ถอดปลั๊กหลังใช้ ไม่เสียบปลั๊กพ่วงเกินกำลัง บ้านเก่าควรให้ช่างไฟตรวจระบบ","ctx":"all","src":["ddpm-prevent","thairath-pubs"]},{"text":"ห้ามชาร์จแบตฯ จักรยาน/สกูตเตอร์ไฟฟ้าขวางทางออก และห้ามชาร์จตอนหลับ","detail":"ไฟจากแบตลิเธียมลามเร็วและควันเป็นพิษ ใช้ที่ชาร์จตรงรุ่น หยุดใช้ทันทีถ้าแบตบวม ร้อนผิดปกติ มีกลิ่นหรือเสียงแปลก ไม่ชาร์จมือถือหรือพาวเวอร์แบงก์บนที่นอนหรือโซฟา","ctx":"all","src":["lfb-ebike","lfb-chargers","ddpm-prevent"]},{"text":"ถังแก๊สต้องมีตรารับรอง ไม่บุบไม่เป็นสนิม ใช้สายสำหรับแก๊สโดยเฉพาะ","detail":"ปิดวาล์วที่หัวถังทุกครั้งหลังใช้ ไม่ทิ้งเตาที่ติดไฟไว้ เปลี่ยนเข็มขัดรัดสายทุก 2 ปี ตรวจรอยรั่วด้วยน้ำสบู่ ถ้ามีฟองแสดงว่ารั่ว","ctx":["house","town"],"src":["ddpm-lpg"]},{"text":"ไม่เผาขยะหรือเศษวัชพืชในที่โล่ง โดยเฉพาะช่วงแล้งและลมแรง","detail":"เก็บกวาดใบไม้แห้งและของติดไฟง่ายรอบบ้าน ดับธูปเทียนก่อนนอน ดับก้นบุหรี่ให้สนิทก่อนทิ้ง","ctx":["house","town"],"src":["ddpm-prevent"]},{"text":"ดูว่าตึกมีสัญญาณเตือน สปริงเกลอร์ และสายฉีดน้ำที่ใช้งานได้จริง","detail":"ถามนิติบุคคลถึงรอบการตรวจและการซ้อมหนีไฟประจำปี ที่ฮ่องกงปี 2025 สัญญาณเตือนทั้ง 8 ตึกไม่ดัง คนรู้ตัวจากเพื่อนบ้านเคาะประตู","ctx":"condo","src":["wiki-wangfuk"]},{"text":"ปิดประตูห้องนอนตอนนอน และไม่วางของขวางทางเดินกับประตู","detail":"ประตูที่ปิดช่วยชะลอควันและความร้อน ทำให้มีเวลาหนีมากขึ้น ทางออกต้องโล่งพอให้เดินได้ในความมืด","ctx":"all","src":[]},{"text":"บันทึกเบอร์ 199 ดับเพลิง 1669 แพทย์ฉุกเฉิน 191 ตำรวจ 1784 ปภ.","detail":"สอนเด็กให้บอกที่อยู่ ชั้น และเลขห้องได้เอง ติดเบอร์และที่อยู่ไว้ข้างประตู","ctx":"all","src":["ddpm-1784"]},{"text":"ตกลงล่วงหน้าว่าใครพาเด็ก ผู้สูงอายุ และผู้ป่วยติดเตียงออก","detail":"คนที่ลงบันไดเองไม่ได้ต้องมีคนช่วยที่ระบุชื่อไว้ และควรแจ้งนิติบุคคลหรือเพื่อนบ้านให้รู้ว่าห้องนี้มีผู้ต้องการความช่วยเหลือ","ctx":"all","src":["nida-highrise"]},{"text":"ติดเครื่องตรวจจับควันทุกชั้น รวมชั้นล่าง ที่จอดรถในบ้าน และเพดานหัวบันได","detail":"ถ้าไฟเริ่มชั้นล่างขณะทุกคนหลับอยู่ชั้นบน ควันจะลอยขึ้นบันไดก่อนถึงห้องนอน ตัวที่ชั้นล่างและหัวบันไดจึงเตือนได้เร็วที่สุด รุ่นที่เชื่อมกันให้ดังพร้อมกันทุกชั้นดีที่สุด","ctx":"town","src":["ready-home-fires","nfpa-escape"]},{"text":"ชั้นบนต้องมีทางออกที่สองที่ไม่ใช่บันได: หน้าต่างหรือระเบียงที่เปิดเหล็กดัดได้","detail":"บ้านมีบันไดเดียว ถ้าควันเต็มบันไดจะลงไม่ได้ ให้มีช่องเปิดอย่างน้อย 1-2 ช่องที่ไม่มีของขวาง ควรอยู่ด้านที่รถดับเพลิงเข้าถึง ทุกคนรู้ที่เก็บกุญแจ และไขทดสอบเป็นระยะกันสนิม","ctx":"town","src":["thairath-bars-expert","lfb-houses"]},{"text":"อย่าวางของ สินค้า ชั้นรองเท้า หรือจักรยาน บนบันไดและทางจากบันไดถึงประตูหน้า","detail":"บันไดกับประตูหน้าคือทางหนีหลักทางเดียวของบ้าน ต้องเดินผ่านได้ในความมืด ตึกแถวที่ชั้นล่างเป็นร้านหรือที่เก็บของ ให้เว้นทางเดินโล่งตลอดแนว และไม่กองของติดไฟง่ายใต้หรือข้างบันได","ctx":"town","src":["dsfrs-escape","thairath-bars"]},{"text":"รถที่จอดหรือชาร์จในตัวบ้าน ต้องไม่ปิดทางจากบันไดถึงประตู","detail":"มีเหตุไฟไหม้บ้านสองชั้นจากรถไฟฟ้าที่กำลังชาร์จตอนเช้ามืด และทาวน์เฮาส์ที่ไฟเริ่มจากรถชั้นล่างแล้วลามคูหาข้างเคียง ถ้าทำได้ให้จอดและชาร์จนอกตัวบ้าน และติดเครื่องตรวจจับควันเหนือที่จอด","ctx":"town","src":["thairath-ev-khonkaen","bkkbiz-townhouse-car"]},{"text":"ทุกคนต้องเปิดประตูหน้า ประตูเหล็กยืด และประตูม้วนจากข้างในได้เองในความมืด","detail":"เก็บกุญแจไว้จุดเดิมใกล้ประตูแต่พ้นมือคนนอก ประตูม้วนไฟฟ้าต้องรู้วิธีเปิดด้วยมือเมื่อไฟดับ ซ้อมให้เด็กโตและผู้สูงอายุทำเอง เพราะตอนเกิดเหตุคนที่ถือกุญแจอาจอยู่คนละชั้น","ctx":"town","src":["lfb-houses","dsfrs-escape"]},{"text":"แลกเบอร์โทรกับบ้านติดกันทั้งสองข้าง ตกลงว่าจะปลุกกันเมื่อเกิดไฟไหม้","detail":"ทาวน์เฮาส์และตึกแถวใช้ผนังร่วมและมีแนวหลังคาต่อเนื่องกัน เคยมีเหตุที่ไฟลามจากคูหาเดียวไปอีก 4 คูหา ชวนเพื่อนบ้านติดเครื่องตรวจจับควัน และไม่กองของปิดทางเดินหลังบ้าน","ctx":"town","src":["mgr-dindaeng","bkkbiz-townhouse-car"]}],"during":[{"text":"ตะโกน \"ไฟไหม้\" ปลุกทุกคน แล้วออกทันที ไม่เก็บของ","detail":"เวลาที่เหลือมักมีไม่กี่นาที กดสัญญาณแจ้งเหตุถ้าอยู่ระหว่างทาง แต่อย่ารอให้สัญญาณดังก่อนจึงออก เพราะระบบอาจเสีย","ctx":"all","src":["ready-home-fires","wiki-wangfuk"]},{"text":"ก้มต่ำหรือคลานใต้ควันไปยังทางออก","detail":"ควันและความร้อนลอยขึ้นสูง อากาศใกล้พื้นหายใจได้มากกว่า ควันทำให้หมดสติได้ก่อนไฟจะมาถึง","ctx":"all","src":["ready-home-fires"]},{"text":"แตะประตูและลูกบิดก่อนเปิด ถ้าร้อน ห้ามเปิด ใช้ทางอื่น","detail":"ใช้หลังมือแตะ ถ้าไม่ร้อนให้แง้มช้า ๆ ดูควันก่อน ถ้ามีควันหรือความร้อนพุ่งเข้ามาให้ปิดทันที","ctx":"all","src":["ready-home-fires"]},{"text":"ปิดประตูทุกบานตามหลังขณะหนี","detail":"ประตูที่ปิดช่วยกั้นไฟและควันไม่ให้ลามเข้าทางเดินและบันได ซึ่งเป็นทางรอดของคนอื่นด้วย","ctx":"all","src":["lfb-tower"]},{"text":"ได้ยินสัญญาณหรือได้กลิ่นควันตอนอยู่ชั้นบน: ดูบันไดก่อน ถ้าโล่งให้ลงและออกทันที","detail":"ทางที่ดีที่สุดคือทางเข้าออกปกติของบ้าน ปิดประตูตามหลัง แต่ถ้าควันขึ้นบันไดมาแล้ว อย่าฝ่าลงไป ให้กลับเข้าห้องที่มีหน้าต่างเปิดได้ แล้วปิดประตูทันที","ctx":"town","src":["lfb-houses"]},{"text":"ลงบันไดไม่ได้: รวมทุกคนในห้องเดียวที่มีหน้าต่าง ปิดประตู อุดช่องใต้ประตู","detail":"เลือกห้องด้านที่ติดถนนถ้าไปถึงได้ เปิดหน้าต่างและช่องเหล็กดัด โทร 199 บอกบ้านเลขที่ ซอย และว่าติดอยู่ชั้นไหน ด้านหน้าหรือหลังบ้าน โบกผ้าสีอ่อนหรือส่องไฟฉายที่หน้าต่าง","ctx":"town","src":["lfb-houses","dsfrs-escape","ready-home-fires"]},{"text":"ทางสุดท้ายจากหน้าต่างชั้นสอง: อย่ากระโดด โยนที่นอนลงก่อน แล้วหย่อนตัวลงช้าๆ","detail":"ใช้เมื่อควันหรือความร้อนเข้าห้องแล้วและยังไม่มีคนมาช่วยเท่านั้น ทำได้เฉพาะชั้นสอง ชั้นที่สูงกว่านี้ให้ปิดห้อง ส่งสัญญาณ และรอ ระวังกันสาด สายไฟ และรั้วเหล็กแหลมข้างล่าง","ctx":"town","src":["lfb-houses","dsfrs-escape"]},{"text":"ใช้บันไดหนีไฟเท่านั้น ห้ามใช้ลิฟต์","detail":"ปล่องลิฟต์มีควันสะสมได้ และลิฟต์อาจค้างหรือเปิดประตูที่ชั้นไฟไหม้ ลงบันไดชิดด้านหนึ่งเพื่อเว้นทางให้นักดับเพลิง","ctx":"condo","src":["nida-highrise"]},{"text":"หนีลงล่าง ห้ามขึ้นดาดฟ้า และห้ามกระโดด","detail":"ไฟและควันลามขึ้นด้านบน ไม่มีหลักประกันว่าจะมีเฮลิคอปเตอร์มารับบนดาดฟ้า การกระโดดจากชั้นที่สูงกว่าชั้น 2 อันตรายถึงชีวิต","ctx":"condo","src":["nida-highrise"]},{"text":"ถ้าทางเดินหรือบันไดเต็มไปด้วยควัน ให้กลับเข้าห้องแล้วปิดประตู","detail":"อย่าฝ่าควันหนาลงบันได ลองบันไดหนีไฟอีกตัวก่อนถ้าไปถึงได้ ถ้าไม่ได้ ห้องที่ปิดประตูสนิทปลอดภัยกว่าทางเดินที่มีควัน","ctx":"condo","src":["lfb-tower","nida-highrise"]},{"text":"ติดอยู่ในห้อง: อุดช่องใต้ประตูและช่องลมด้วยผ้าเปียกหรือเทป","detail":"เลือกห้องที่มีหน้าต่างหรือระเบียงและอยู่ไกลไฟที่สุด ปิดประตูทุกบานระหว่างคุณกับไฟ อุดทุกช่องที่ควันเข้าได้","ctx":"all","src":["ready-home-fires","lfb-tower","nida-highrise"]},{"text":"โทร 199 บอกชื่อตึก ชั้น เลขห้อง และจำนวนคนที่ติดอยู่","detail":"โทรเมื่อพ้นอันตรายแล้ว หรือทันทีถ้าติดอยู่ข้างใน อย่าคิดว่ามีคนโทรแล้ว ถ้าโทรไม่ติดลอง 191 หรือ 1784","ctx":"all","src":["ddpm-1784","nida-highrise"]},{"text":"ส่งสัญญาณที่หน้าต่างหรือระเบียง: โบกผ้าสีสด ส่องไฟฉาย เป่านกหวีด","detail":"ให้เจ้าหน้าที่เห็นตำแหน่งของคุณ ไม่ทุบกระจกถ้าไม่จำเป็น เพราะเศษกระจกตกใส่คนข้างล่าง และจะปิดกั้นควันจากข้างนอกไม่ได้อีก","ctx":["condo","town"],"src":["nida-highrise","lfb-tower"]},{"text":"ไฟเล็กเท่านั้นจึงดับเอง: ดึงสลัก เล็งที่ฐานไฟ บีบ ส่ายซ้ายขวา","detail":"ดับเองเฉพาะเมื่อมีคนแจ้งดับเพลิงแล้ว ไฟยังอยู่ที่วัตถุชิ้นเดียว ไม่มีควันพิษ และทางออกอยู่ข้างหลังคุณ ถ้าไม่แน่ใจให้ออกทันที เด็กและผู้สูงอายุไม่ควรเป็นคนดับ","ctx":"all","src":["usfa-extinguisher"]},{"text":"แบตฯ ลิเธียมลุกไหม้: อย่าพยายามดับเอง ออกจากห้อง ปิดประตู โทร 199","detail":"ไฟจากแบตจั นหัวบันได","ctx":"town","why":"ไฟชั้นล่างตอนทุกคนหลับอยู่ชั้นบน ต้องรู้ตัวก่อนควันเต็มบันได"},{"name":"บันไดหนีไฟแบบแขวนขอบหน้าต่าง ยาวพอดีชั้นสอง","qty":"1 ชุด/ห้องนอนที่ไม่มีระเบียง","ctx":"town","why":"ทางออกที่สองเมื่อบันไดมีควัน ต้องลองแขวนกับหน้าต่างจริงและซ้อมจากที่ต่ำก่อน ไม่เหมาะกับเด็กเล็กและผู้สูงอายุ และใช้ไม่ได้ถ้าเหล็กดัดเปิดไม่ออก"}],"cases":[{"title":"ซานติก้าผับ กรุงเทพฯ 2552 (เสียชีวิต 67 ราย)","lesson":"สะเก็ดไฟติดโฟมซับเสียงบนเพดาน คนเบียดกันที่ทางเข้ากว้างราว 2 เมตร ทั้งที่มีทางออกอื่นแต่ป้ายไม่ชัด เข้าอาคารไหนให้มองหาทางออกอย่างน้อย 2 ทางทันที","src":["thairath-pubs"]},{"title":"เมาน์เทน บี ชลบุรี 2565 และโรงเบียร์ลาดพร้าว 2569","lesson":"ไฟฟ้าลัดวงจรลามโฟมซับเสียง ทางเข้าออกแคบทางเดียว ประตูหนีไฟถูกล็อก เหตุเดิมเกิดซ้ำ จึงอย่าคาดว่าอาคารจะปลอดภัย ถ้าเห็นทางออกเดียวหรือประตูถูกล็อก ให้ไปที่อื่น","src":["thairath-pubs"]},{"title":"รถบัสทัศนศึกษา วิภาวดีรังสิต 2567 (เสียชีวิต 23 ราย)","lesson":"ไฟลามเร็วจากถังก๊าซที่ติดตั้งเกินจากที่จดทะเบียน และประตูเปิดไม่ออก ขึ้นรถโดยสารให้ดูประตูฉุกเฉิน ค้อนทุบกระจก และนั่งใกล้ทางออกถ้าเลือกได้","src":["wiki-schoolbus"]},{"title":"เกรนเฟลล์ทาวเวอร์ ลอนดอน 2560 (เสียชีวิต 72 ราย)","lesson":"ไฟจากตู้เย็นลามผนังภายนอกที่ติดไฟได้ คำแนะนำให้อยู่ในห้องถูกยกเลิกช้าเกินไป และตึกมีบันไดเดียว การอยู่ในห้องปลอดภัยเฉพาะเมื่อตึกกันไฟได้จริง ถ้าทางยังโล่งให้ออก","src":["wiki-grenfell","lfb-tower"]},{"title":"หวังฟุกคอร์ต ฮ่องกง พ.ย. 2568 (เสียชีวิต 168 ราย)","lesson":"ไฟลามตาข่ายและโฟมปิดหน้าต่างระหว่างซ่อมตึก สัญญาณเตือนไม่ดังทั้ง 8 ตึก ช่วงตึกมีนั่งร้านหรือซ่อมผนังให้ระวังเป็นพิเศษ และเคาะประตูเตือนเพื่อนบ้าน","src":["wiki-wangfuk"]},{"title":"อาคารพาณิชย์ 3 ชั้น สุพรรณบุรี ม.ค. 2568 (เสียชีวิต 4 ราย)","lesson":"ทั้งครอบครัวติดอยู่หลังประตูและหน้าต่างเหล็กดัด หนีขึ้นหลังคาไม่ได้ เหล็กดัดทุกชั้นต้องมีช่องเปิดฉุกเฉินที่เปิดจากข้างในได้","src":["thairath-bars"]}]},{"id":"flood","title":"น้ำท่วม","summary":"คนตายจากน้ำท่วมส่วนใหญ่เพราะจมน้ำ รองลงมาคือไฟดูด และโรคที่ตามมาหลังน้ำลด หลักสำคัญคือ ออกก่อนน้ำมา ตัดไฟก่อนน้ำถึง และ ["house","town"],"src":["mea-flood-2564","ready-floods"]},{"text":"ย้ายรถไปที่สูงตั้งแต่มีประกาศเตือน อย่ารอให้น้ำถึงถนน","detail":"รถจมน้ำซ่อมแพงหรือซ่อมไม่คุ้ม และการฝ่าน้ำไปย้ายรถตอนน้ำมาแล้วคือความเสี่ยงถึงชีวิต","ctx":"all","src":["thaipbs-car"]},{"text":"คอนโด: ถามนิติฯ เรื่องแผนน้ำท่วม ชั้นใต้ดิน ปั๊มน้ำ และไฟสำรอง","detail":"ห้องไฟฟ้าและปั๊มน้ำมักอยู่ชั้นล่างหรือใต้ดิน ถ้าน้ำเข้า ทั้งตึกอาจไม่มีไฟ น้ำประปา และลิฟต์หลายวัน","ctx":"condo","src":["matichon-condo"]},{"text":"คอนโด: รองน้ำใช้ใส่ถังและอ่างให้เต็ม เตรียมถุงขยะดำไว้ใช้แทนส้วม","detail":"เมื่อปั๊มน้ำหยุด ชั้นสูงน้ำจะไม่ไหลและกดชักโครกไม่ได้ น้ำใช้ควรแยกจากน้ำดื่ม","ctx":"condo","src":[]},{"text":"บ้านชั้นเดียว: เตรียมบันไดและทางขึ้นหลังคาไว้เป็นทางหนีสุดท้าย","detail":"ใช้เมื่อออกไม่ทันจริงๆ เท่านั้น เตรียมเชือก นกหวีด ไฟฉาย ผ้าสีสด และเสื้อชูชีพไว้ใกล้ทางขึ้น","ctx":"house","src":["ready-floods"]},{"text":"ชาร์จมือถือและพาวเวอร์แบงก์ให้เต็ม เตรียมไฟฉายและวิทยุใช้ถ่าน","detail":"ไฟฟ้าอาจถูกตัดเป็นวงกว้างเพื่อความปลอดภัย และสัญญาณมือถืออาจล่ม วิทยุใช้ถ่านยังรับข่าวได้","ctx":"all","src":["prd-72h","pea-hatyai-2568"]},{"text":"นัดจุดพบและคนกลางติดต่อของครอบครัว จดเบอร์ฉุกเฉินลงกระดาษ","detail":"1784 ปภ. / 1669 แพทย์ฉุกเฉิน / 191 ตำรวจ / 1129 PEA / 1130 MEA เก็บกระดาษใส่ถุงกันน้ำเผื่อมือถือแบตหมด","ctx":"all","src":["ddpm-1784"]},{"text":"ลอกท่อ รางน้ำ และเก็บขยะหน้าบ้านไม่ให้อุดทางระบายน้ำ","detail":"ทางระบายที่ตันทำให้น้ำขังเร็วและสูงกว่าที่ควร","ctx":["house","town"],"src":["ready-floods"]},{"text":"ประเมินก่อนว่าชั้นบนพอไหม: ถ้าน้ำอาจสูงถึงชั้นสองหรือไหลเชี่ยว ให้วางแผนอพยพ","detail":"ชั้นบนเป็นที่หลบชั่วคราวเมื่อออกไม่ทัน ไม่ใช่ที่ปลอดภัยเสมอ บ้านที่มีเด็กเล็ก ผู้สูงอายุ ผู้ป่วยที่ต้องอุ้มลงเรือ หรือไม่มีทางขึ้นหลังคา ควรออกตั้งแต่มีคำเตือน เพราะน้ำเข้าชั้นล่างแล้วจะพาออกยากมาก","ctx":"town","src":["ready-floods"]},{"text":"มีประกาศเตือน: ขนน้ำดื่ม อาหาร ยา เอกสาร ไฟฉาย ขึ้นชั้นบนให้เสร็จก่อนน้ำมา","detail":"น้ำท่วมหาดใหญ่ปี 2568 เจ้าหน้าที่เตือนให้ยกของขึ้นชั้นสูงและย้ายรถไปที่สูง ขนของกินของใช้ให ่อเปิด หรือถนนขาดใต้น้ำ","ctx":"all","src":["ready-floods"]},{"text":"ขึ้นที่สูงที่สุดของอาคาร หลังคาใช้เมื่อจำเป็นเท่านั้น","detail":"อย่าหลบในช่องใต้หลังคาที่ปิดทึบ เพราะน้ำขึ้นแล้วไม่มีทางออก บนหลังคาให้โบกผ้าสีสด เป่านกหวีด ส่องไฟฉายตอนกลางคืน","ctx":["house","town"],"src":["ready-floods"]},{"text":"น้ำเข้าชั้นล่างแล้ว: ทุกคนอยู่ชั้นบน ไม่ลงไปเก็บของหรือย้ายรถ","detail":"น้ำในบ้านอาจมีไฟรั่ว สัตว์มีพิษ และพื้นลื่น ถ้าน้ำยังขึ้นจนใกล้พื้นชั้นบน ให้โทร 1784 แจ้งจำนวนคนทันที เปิดช่องเหล็กดัดเตรียมไว้ และใส่เสื้อชูชีพให้เด็กกับผู้สูงอายุ","ctx":"town","src":["ready-floods","thairath-flood-trapped"]},{"text":"ส่งสัญญาณจากหน้าต่างหรือระเบียงชั้นบน: แขวนผ้าสีสด ส่องไฟฉาย เป่านกหวีด","detail":"แขวนผ้าค้างไว้ให้เรือที่ผ่านมารู้ว่าบ้านนี้ยังมีคน เวลาโทรหรือส่งข้อความให้บอกบ้านเลขที่ ซอย จำนวนคน และผู้ป่วย ทาวน์เฮาส์หน้าตาเหมือนกันทั้งแถว กู้ภัยหาบ้านผิดได้ง่าย","ctx":"town","src":["ready-floods"]},{"text":"อยู่ห่างเสาไฟ สายไฟ ตู้ไฟ และรั้วโลหะที่แช่น้ำ","detail":"ไฟรั่วในน้ำมองไม่เห็น ปี 2554 มีไฟรั่วจากเสาไฟและตู้โทรศัพท์ ถ้ารู้สึกชาหรือจี๊ดที่ขา ให้ถอยกลับทางเดิมทันที","ctx":"all","src":["ddc-electrocution-2554","ddc-flood-2569"]},{"text":"ใส่เสื้อชูชีพให้เด็ก ผู้สูงอายุ และคนว่ายน้ำไม่เป็นก่อนใคร","detail":"การจมน้ำคือสาเหตุราว 75% ของการเสียชีวิตในภัยน้ำท่วม ไม่มีชูชีพให้ใช้ถังแกลลอนปิดฝาหรือขวดน้ำเปล่ามัดรวมกัน","ctx":"all","src":["who-floods","ddc-flood-2569"]},{"text":"คนตกน้ำ: ตะโกน โยน ยื่น อย่ากระโดดลงไปช่วย","detail":"ยื่นไม้หรือโยนเชือก ถังแกลลอน ห่วงยางให้เกาะ แล้วโทร 1669 คนลงไปช่วยมักถูกน้ำพัดจมไปด้วย","ctx":"all","src":["ddc-flood-2569"]},{"text":"ขอความช่วยเหลือ: โทร 1784 หรือ 1669 บอกพิกัด จำนวนคน ผู้ป่วย","detail":"ส่งโลเคชันทาง LINE @1784DDPM ได้ ส่งข้อความสั้นแทนการโทรนานเพื่อประหยัดแบต และปิดแอปที่ไม่จำเป็น","ctx":"all","src":["ddpm-1784"]},{"text":"จำเป็นต้องลุยน้ำนิ่ง: ใส่รองเท้าหุ้มส้น ใช้ไม้หยั่งพื้นนำทาง","detail":"ไม้ช่วยตรวจท่อเปิดและหลุม ไปเป็นกลุ่ม เลี่ยงตอนกลางคืน ปิดแผลด้วยพลาสเตอร์กันน้ำ และล้างตัวด้วยสบู่ทันทีที่ขึ้นจากน้ำ","ctx":"all","src":["cdc-floodwater","ddc-flood-2569"]},{"text":"ระวังงู ตะขาบ แมงป่อง ที่หนีน้ำขึ้นมาในบ้าน","detail":"ส่องไฟฉายก่อนหยิบของ เคาะรองเท้าก่อนใส่ ไม่ล้วงมือในที่มืด บางพื้นที่อาจมีจระเข้หลุด เห็นแล้วแจ้ง 1784 อย่าเข้าใกล้","ctx":["house","town"],"src":["ddc-flood-2569"]},{"text":"รถดับกลางน้ำที่กำลังขึ้น: ทิ้งรถแล้วขึ้นที่สูงทันที","detail":"ถ้าติดอยู่ในกระแสน้ำเชี่ยว ให้อยู่ในรถ หากน้ำเริ่มเข้าห้องโดยสารให้ปีนขึ้นหลังคารถและขอความช่วยเหลือ","ctx":"all","src":["ready-floods"]},{"text":"คอนโด: ห้ามลงชั้นใต้ดินหรือลานจอดรถตอนน้ำเข้า","detail":"น้ำไหลลงที่ต่ำเร็วมาก ประตูและทางลาดกลายเป็นกับดัก ทิ้งรถไว้ อย่าลงไปย้ายรถ","ctx":"condo","src":[]},{"text":"คอนโด: ห้ามใช้ลิฟต์เมื่อน้ำเข้าอาคารหรือไฟเริ่มกะพริบ","detail":"ลิฟต์อาจค้างหรือลงไปจอดชั้นที่น้ำท่วม ใช้บันไดหนีไฟ พกไฟฉายเพราะบันไดจะมืดเมื่อไฟดับ","ctx":"condo","src":[]},{"text":"ดื่มน้ำขวดหรือน้ำต้มเท่านั้น และแบ่งน้ำดื่มให้พอหลายวัน","detail":"น้ำประปาช่วงน้ำท่วมอาจปนเปื้อน ต้มให้เดือดพล่านอย่างน้อย 1 นาที ห้ามดื่มน้ำท่วมเด็ดขาด","ctx":"all","src":["cdc-water","ddc-flood-2569"]}],"after":[{"text":"กลับเข้าบ้านเมื่อเจ้าหน้าที่แจ้งว่าปลอดภัยแล้วเท่านั้น","detail":"น้ำอาจมาระลอกสอง ถนนและสะพานอาจทรุด ไปตอนกลางวัน ไปอย่างน้อยสองคน","ctx":"all","src":["ready-floods"]},{"text":"ห้ามเปิดเบรกเกอร์เองถ้าปลั๊กหรือตู้ไฟเคยจมน้ำ ให้ช่างตรวจก่อน","detail":"ผู้เสียชีวิตจากไฟดูดปี 2554 จำนวนมากเกิดตอนน้ำลดแล้วกลับเข้าบ้าน สายไฟ เบรกเกอร์ ปลั๊กที่แช่น้ำยังรั่วได้","ctx":"all","src":["ddc-electrocution-2554","ready-floods"]},{"text":"ห้ามใช้เครื่องใช้ไฟฟ้าที่เคยจมน้ำจนกว่าช่างจะตรวจ","detail":"แม้ภายนอกแห้งแล้ว ภายในยังชื้นและลัดวงจรได้ ห้ามแตะสวิตช์ขณะตัวเปียกหรือยืนบนพื้นเปียก","ctx":"all","src":["pea-hatyai-2568","ready-floods"]},{"text":"ล้างบ้าน: ใส่บูท ถุงมือยางหนา หน้ากาก ห้ามเดินเท้าเปล่า","detail":"โคลนและน้ำขังมีเชื้อฉี่หนู ของมีคม และสิ่งปฏิกูล เด็กไม่ควรร่วมทำความสะอาด ล้างตัวด้วยสบู่ทันทีหลังเลิก","ctx":"all","src":["ready-floods","cdc-floodwater"]},{"text":"ไข้สูง ปวดน่อง ตาแดง ภายใน 1-2 สัปดาห์หลังลุยน้ำ: ไปหาหมอทัน : จัดที่นอนสำรองไว้ชั้นล่างสำหรับคืนที่ร้อนจัด","detail":"ชั้นบนและห้องใต้ดาดฟ้าร้อนที่สุด ผู้สูงอายุและเด็กเล็กควรย้ายลงมานอนชั้นล่าง ตึกแถวที่มีช่องเปิดแค่หน้า-หลังควรเคลียร์ทางให้ลมผ่านตลอดแนวได้","ctx":"town","src":[]},{"text":"คนทำงานกลางแจ้ง: ตกลงกับนายจ้างเรื่องเวลาพัก น้ำดื่ม และที่ร่ม","detail":"กรมอนามัยแนะให้หน่วยงานลดชั่วโมงงานกลางแจ้ง จัดเวลาพัก น้ำดื่ม และร่มเงา และพิจารณาหยุดงานช่วงเสี่ยงสูง ผู้เสียชีวิตจากความร้อนในไทยปี 2567 ส่วนใหญ่เกี่ยวกับงานหรือกิจกรรมกลางแจ้ง","ctx":"all","src":["anamai-levels","ddc-2567"]},{"text":"เตรียมน้ำดื่ม ผงเกลือแร่ ORS พัดลมใช้แบต และผ้าขนหนูผืนเล็กไว้ในบ้าน","detail":"ไฟดับช่วงร้อนจัดเกิดได้เพราะคนใช้ไฟพร้อมกันมาก ต้องมีวิธีทำตัวเย็นที่ไม่พึ่งไฟบ้าน แช่ขวดน้ำและเจลเย็นไว้ในช่องแข็งล่วงหน้า","ctx":"all","src":["wiki-sea-2024"]},{"text":"ตั้งกฎรถรับส่ง: นับเด็กก่อนขึ้น-หลังลง และตรวจทั่วรถก่อนล็อกทุกครั้ง","detail":"กรมควบคุมโรคพบเหตุลืมเด็กในรถ 106 ครั้งใน 5 ปี (2557-2561) เสียชีวิต 5 ราย อายุ 3-6 ปี 4 รายเกิดในรถรับส่งนักเรียน อย่ามองข้ามเด็กที่หลับอยู่เบาะหลัง","ctx":"all","src":["ddc-car"]}],"during":[{"text":"สงสัยฮีทสโตรก: โทร 1669 ทันที แล้วพาเข้าที่ร่มหรือห้องเย็น","detail":"ตัวร้อนจัด สับสน พูดไม่รู้เรื่อง ชัก หรือหมดสติ คือเหตุฉุกเฉิน อย่ารอดูอาการ ถอดเสื้อผ้าชั้นนอกออก และอยู่กับผู้ป่วยจนกว่ารถพยาบาลจะมาถึง","ctx":"all","src":["niosh-illness","nhs-heat","moph-firstaid"]},{"text":"ระหว่างรอรถพยาบาล ทำให้ตัวเย็นเร็วที่สุดด้วยน้ำเย็นและลม","detail":"ราดหรือเช็ดตัวด้วยน้ำเย็น ใช้ผ้าเปียกหรือน้ำแข็งวางที่ศีรษะ คอ รักแร้ ขาหนีบ แล้วพัดหรือเปิดพัดลมเป่า ถ้าทำได้ให้แช่ตัวในน้ำเย็นโดยมีคนประคองตลอด","ctx":"all","src":["niosh-illness","moph-firstaid","nhs-heat"]},{"text":"ผู้ป่วยหมดสติหรือสับสน ห้ามกรอกน้ำ ให้จัดนอนตะแคง","detail":"เสี่ยงสำลักเข้าปอด จัดท่านอนตะแคงกึ่งคว่ำเพื่อเปิดทางหายใจ และลดความร้อนต่อไปเรื่อยๆ ถ้ารู้สึกตัวดีและกลืนได้จึงให้จิบน้ำ","ctx":"all","src":["moph-firstaid"]},{"text":"เพลียแดด: หยุดพักในที่เย็น จิบน้ำหรือเกลือแร่ เช็ดตัว ดูอาการ 30 นาที","detail":"อาการคือ เหงื่อออกมาก เวียนหัว ปวดหัว คลื่นไส้ ตะคริว ผิวซีดเย็นชื้น กระหายน้ำ ถ้าครบ 30 นาทีแล้วไม่ดีขึ้น หรือเริ่มสับสน ให้ถือเป็นฮีทสโตรกและโทร 1669","ctx":"all","src":["nhs-heat","niosh-illness"]},{"text":"เลี่ยงแดดและงานหนักกลางแจ้งช่วง 11.00-15.00 น.","detail":"ดัชนีความร้อนระดับเตือนภัยขึ้นไปให้ลดกิจกรรมกลางแจ้งช่วงนี้ ระดับอันตรายมากให้งดเด็ดขาด ย้ายงานหนักและการออกกำลังกายไปเช้าตรู่หรือเย็น","ctx":"all","src":["bma-heatindex","nhs-heat","moph-firstaid"]},{"text":"ดื่มน้ำสม่ำเสมอโดยไม่ต้องรอหิว ราวชั่วโมงละ 1 แก้ว วันละ 2-3 ลิตร","detail":"ดูสีปัสสาวะ ถ้าใสหรือเหลืองอ่อนแปลว่าน้ำพอ เลี่ยงสุรา และเครื่องดื่มหวานจัดหรือคาเฟอีนสูง ผู้ป่วยไตหรือหัวใจที่แพทย์จำกัดน้ำ ให้ถามแพทย์ว่าดื่มได้เท่าไร","ctx":"all","src":["who-heat","cdc-heat"]},{"text":"เหงื่อออกมากหลายชั่วโมงหรือเป็นตะคริว ให้ดื่มเกลือแร่เสริมกับน้ำ","detail":"ใช้ผง ORS ผสมน้ำสะอาดตามฉลาก หรือเครื่องดื่มเกลือแร่ จิบทุก 15-20 นาที คนทั่วไปที่อยู่ในร่มดื่มน้ำเปล่าก็พอ ผู้ป่วยไต หัวใจ ความดัน ให้ถามแพทย์ก่อน","ctx":"all","src":["niosh-illness","nhs-heat","moph-firstaid"]},{"text":"พัดลมอย่างเดียวไม่พอเมื่อร้อนจัด ห้องร้อนเกิน 40°C อย่าพึ่งพัดลม","detail":"WHO ให้ใช้พัดลมเมื่ออุณหภูมิต่ำกว่า 40°C ส่วน CDC เข้มกว่า คือเกินราว 32°C พัดลมอาจทำให้ตัวร้อนขึ้น ถ้าต้องใช้ ให้ทำผิวเปียกร่วมด้วย หรือย้ายไปที่มีแอร์","ctx":"all","src":["who-heat","cdc-heat","ready-heat"]},{"text":"ไม่มีแอร์: อาบน้ำหรือเช็ดตัวด้วยน้ำเย็นบ่อยๆ ใส่เสื้อบาง หลวม สีอ่อน","detail":"พรมน้ำที่ผิวแล้วพัด แช่เท้าในกะละมังน้ำ พาดผ้าเปียกที่คอ ถ้ามีแอร์ ตั้ง 27°C แล้วเปิดพัดลมร่วม จะรู้สึกเย็นลงราว 4°C และประหยัดไฟ","ctx":"all","src":["who-heat","ready-heat","nhs-heat"]},{"text":"กลางวันปิดหน้าต่างและม่านด้านแดดส่อง กลางคืนเปิดรับอากาศเย็น","detail":"ปิดหน้าต่างเมื่ออากาศข้างนอกร้อนกว่าในบ้าน เปิดหลังมืดเพื่อระบายความร้อนสะสม กางมุ้งหรือมุ้งลวดกันยุงถ้าต้องเปิดนอน","ctx":"all","src":["who-heat"]},{"text":"ห้ามทิ้งเด็ก ผู้สูงอายุ หรือสัตว์เลี้ยงไว้ในรถที่จอด แม้แง้มกระจก","detail":"ในรถร้อนขึ้นได้ราว 11°C (20°F) ภายใน 10 นาที ร่างกายเด็กร้อนเร็วกว่าผู้ใหญ่ 3-5 เท่า แง้มกระจกหรือจอดในร่ม ","cdc-resp-prevent","who-measles"]},{"text":"สำรองอาหาร น้ำดื่ม และของใช้จำเป็นให้อยู่บ้านได้อย่างน้อย 2 สัปดาห์","detail":"ซื้อเพิ่มทีละน้อยทุกครั้งที่ไปตลาด ไม่ต้องกว้านซื้อ เลือกของที่กินอยู่แล้วและเก็บได้นาน รวมนมผง อาหารเด็ก ผ้าอ้อม ผ้าอนามัย และอาหารสัตว์เลี้ยง","ctx":"all","src":["ready-pandemic"]},{"text":"ยาโรคประจำตัวต้องมีสำรองอย่างน้อย 1 เดือน อย่ารอให้หมดก่อนไปรับ","detail":"ช่วงระบาดโรงพยาบาลอาจเลื่อนนัดหรือรับเฉพาะผู้ป่วยฉุกเฉิน ถามแพทย์เรื่องรับยาล่วงหน้า รับยาที่ร้านยาใกล้บ้าน หรือส่งยาทางไปรษณีย์ จดชื่อยาและขนาดไว้บนกระดาษ","ctx":"all","src":["ready-pandemic"]},{"text":"เตรียมชุดดูแลผู้ป่วยที่บ้าน: ปรอทวัดไข้ เครื่องวัดออกซิเจนปลายนิ้ว พาราเซตามอล ผงเกลือแร่","detail":"ช่วงเดลตาปี 2564 ผู้ติดเชื้อจำนวนมากต้องรักษาตัวที่บ้านระหว่างรอเตียง ของพวกนี้ขาดตลาดเร็วเมื่อเกิดระบาด ซื้อไว้ก่อนและลองใช้ให้เป็น","ctx":"all","src":["thaipublica-beds","who-afro-home"]},{"text":"มีหน้ากาก สบู่ เจลแอลกอฮอล์ และน้ำยาฟอกขาวติดบ้านไว้เสมอ","detail":"มี.ค. 2563 แอลกอฮอล์ 70% และหน้ากากขาดตลาด ร้านยาต้องจำกัดคนละ 1 ขวดและหน้ากากคนละ 5 ชิ้น คนที่จำเป็นจริงอย่างผู้ป่วยเบาหวานและโรคไตหาซื้อไม่ได้","ctx":"all","src":["thaipbs-alcohol"]},{"text":"ลองใส่หน้ากาก N95 หรือ KF94 ให้แนบหน้า เลือกขนาดที่ไม่รั่วข้างแก้มและจมูก","detail":"เอามือป้องขอบหน้ากากแล้วหายใจออก ถ้ารู้สึกลมรั่วให้ปรับสายหรือเปลี่ยนรุ่น หน้ากากกรองอนุภาคป้องกันได้ดีกว่าหน้ากากอนามัย และหน้ากากผ้าป้องกันได้น้อยที่สุด","ctx":"all","src":["cdc-masks"]},{"text":"ตกลงกันไว้ก่อน: ถ้ามีคนป่วย ใครดูแล ใช้ห้องไหน และใครดูแลแทนถ้าผู้ดูแลป่วย","detail":"เลือกผู้ดูแลคนเดียวที่แข็งแรงและไม่ใช่กลุ่มเสี่ยง เลือกห้องที่เปิดหน้าต่างได้ ระบุญาติหรือเพื่อนบ้าน 2 คนเป็นตัวสำรอง จดตารางยาและอาหารของเด็ก ผู้สูงอายุ ผู้ป่วยติดเตียงไว้ให้คนอื่นทำแทนได้","ctx":"all","src":["who-afro-home","thaipublica-beds","ready-pandemic"]},{"text":"รู้ศัพท์: กักตัวคือคนที่สัมผัสเชื้อแต่ยังไม่ป่วย แยกตัวคือคนที่ป่วยหรือติดเชื้อแล้ว","detail":"ผู้สัมผัสใกล้ชิดคือคนในบ้าน ผู้ดูแล หรือคนที่อยู่ใกล้ผู้ป่วยโดยไม่ป้องกัน ตามนิยามที่ทางการประกาศของโรคนั้น ชุดตรวจ ATK ผลลบครั้งเดียวยังไม่ตัดโรค มีอาการให้ตรวจซ้ำและทำตามคำสั่งเจ้าพนักงานควบคุมโรค","ctx":"all","src":["moph-atk-timeout","ready-pandemic"]},{"text":"รู้สิทธิการรักษาของทุกคนในบ้าน และบันทึกสายด่วนลงกระดาษ","detail":"บัตรทอง สปสช. 1330, ประกันสังคม 1506, กรมควบคุมโรค 1422, เจ็บป่วยฉุกเฉิน 1669, สุขภาพจิต 1323 ติดไว้ที่ตู้เย็นพร้อมเลขบัตรประชาชนและโรงพยาบาลตามสิทธิ","ctx":"all","src":[]},{"text":"เตรียมทำงานและเรียนจากบ้าน ลองใช้แอปพบแพทย์ทางไกลให้เป็นก่อน","detail":"ถามที่ทำงานและโรงเรียนว่ามีแผนอย่างไร ตั้งค่าแอปธนาคารและการจ่ายเงินออนไลน์ให้ผู้สูงอายุ เก็บเงินสดไว้บ้างเผื่อระบบล่มหรือต้องจ่ายคนส่งของ","ctx":"all","src":["ready-pandemic"]},{"text":"ถามนิติฯ ถึงแผนโรคระบาด: ลิฟต์ จุดรับพัสดุ ระบบแอร์ส่วนกลาง และการกักตัวทั้งตึก","detail":"ถ้าตึกถูกสั่งปิดหรือมีผู้ติดเชื้อจำนวนมาก ใครส่งอาหารและยาขึ้นห้อง ขยะติดเชื้อทิ้งที่ไหน ระบบแอร์ส่วนกลางเติมอากาศจากภายนอกหรือหมุนเวียนในตึก","ctx":"condo","src":[]},{"text":"รู้จัก อสม. และ รพ.สต. ใกล้บ้าน จดเบอร์ไว้ และวางแผนรถไปโรงพยาบาล","detail":"บ้านไกลโรงพยาบาลต้องตัดสินใจเร็วกว่าคนเมือง รู้ว่าใครขับรถได้ตอนกลางคืน ใช้เวลาเดินทางเท่าไร อสม. คือคนแรกที่ช่วยประสานยา การตรวจ และการส่งต่อ","ctx":["house","town"],"src":[]},{"text":"เลี้ยงไก่ เป็ด หมู ให้มีคอกแยกจากตัวบ้าน และกันค้างคาวกับนกป่าเข้าถึงอาหารสัตว์","detail":"ไข้หวัดนกติดจากการสัมผัสสัตว์ปีกป่วยหรือตาย ไวรัสนิปาห์มาจากค้างคาวผลไม้ผ่านหมูหรือผลไม้ที่ปนเปื้อน อย่าปลูกไม้ผลคลุมคอกหมู ล้างมือด้วยสบู่ทุกครั้งหลังจับสัตว์","ctx":["house","town"],"src":["who-avian","who-nipah"]},{"text":"ปิดฝาโอ่งและภาชนะเก็บน้ำ คว่ำของที่ขังน้ำได้ทุกสัปดาห์ กันยุงลาย","detail":"ไข้เลือดออกระบาดในไทยทุกปี ยุงลายกัดตอนกลางวันและวางไข่ในน้ำใสนิ่งรอบบ้าน ติดมุ้งลวด เก็บบ้านให้โปร่ง เก็บขยะที่ขังน้ำได้","ctx":["house","town"],"src":["who-dengue"]},{"text":"วางแผนแยกผู้ป่วยไว้ชั้นเดียว: ห้องนอนกับห้องน้ำชั้นนั้นให้ผู้ป่วยใช้คนเดียว","detail":"CDC แนะให้ผู้ป่วยใช้ห้องนอนและห้องน้ำแยกถ้าทำได้ บ้านสองชั้นทำได้ง่ายกว่าบ้านชั้นเดียว คนอื่นย้ายไปนอนและใช้ห้องน้ำอีกชั้น เลือกชั้นที่ผู้ป่วยไม่ต้องเดินผ่านห้องนั่งเล่นหรือครัว","ctx":"town","src":["cdc-care-home"]}],"during":[{"text":"ถามก่อนว่าโรคนี้ติดทางไหน: หายใจ สัมผัส น้ำและอาหาร ยุง สัตว์ หรือเลือดและสารคัดหลั่ง","detail":"ฟังจากกรมควบคุมโรคแล้วตัดทางนั้นให้ขาด ถ้ายังไม่มีใครรู้ ให้ป้องกันแบบโรคทางเดินหายใจไว้ก่อน คือใส่หน้ากาก ระบายอากาศ ล้างมือ และเลี่ยงที่แออัด","ctx":"all","src":["ready-pandemic","who-blueprint"]},{"text":"โรคติดทางหายใจ: ใส่หน้ากากให้แนบหน้าในที่ปิด ที่แออัด และเมื่ออยู่ใกล้คนป่วย","detail":"ใช้ N95 หรือ KF94 เมื่อดูแลผู้ป่วย เข้าโรงพยาบาล หรืออยู่ในที่ปิดคนแน่น หน้ากากอนามัยใช้ได้ในงานทั่วไปและให้คนป่วยใส่ เปลี่ยนเมื่อชื้นหรือสกปรก","ctx":"all","src":["cdc-masks","who-afro-home"]},{"text":"เปิดหน้าต่างและประตูให้ลมผ่าน เปิดพัดลมดูดอากาศ ทำกิจกรรมนอกอาคารถ้าทำได้","detail":"เชื้อทางเดินหายใจสะสมในอากาศของห้องปิด ห้องแอร์ให้แง้มหน้าต่างเป็นระยะ เครื่องฟอกอากาศแบบ HEPA ช่วยลดเชื้อในอากาศได้ วางไว้ในห้องที่คนอยู่รวมกัน","ctx":"all","src":["cdc-air"]},{"text":"ล้างมือด้วยสบู่และน้ำอย่างน้อย 20 วินาที ไม่มีน้ำใช้เจลแอลกอฮอล์อย่างน้อย 60%","detail":"ล้างเมื่อกลับถึงบ้าน ก่อนกินอาหาร หลังเข้าห้องน้ำ หลังดูแลผู้ป่วย เจลที่ขายในไทยมักเป็น 70% มือเปื้อนหรือโรคท้องร่วงต้องใช้สบู่กับน้ำ เพราะเจลฆ่าเชื้อบางชนิดไม่ได้","ctx":"all","src":["ready-pandemic","cdc-handsan"]},{"text":"ส่งอาหารและยาโดยวางที่หัวบันไดหรือหน้าห้อง ผู้ดูแลคนเดียวเท่านั้นที่ขึ้นลง","detail":"ใส่หน้ากากทั้งคู่ ไม่สวนกันบนบันไดแคบ เปิดหน้าต่างห้องผู้ป่วยและปิดประตูห้องไว้ เช็ดราวบันได สวิตช์ไฟบันได และลูกบิด ด้วยน้ำยาฆ่าเชื้อเมื่อมีการใช้ร่วมกัน","ctx":"town","src":["cdc-care-home"]},{"text":"ผู้ป่วยอยู่คนละชั้น: ให้มีมือถือหรือกริ่ง และนัดเวลาถามอาการวันละหลายครั้ง","detail":"อยู่คนละชั้นแล้วจะไม่มีใครเห็นถ้าอาการทรุด จดค่าไข้และออกซิเจนตามที่คู่มือแนะนำ ถ้าเหนื่อยจนลงบันไดเองไม่ไหว ให้โทร 1669 และบอกว่าผู้ป่วยอยู่ชั้นบน บันไดแคบ","ctx":"town","src":[]},{"text":"มีคนป่วย: แยกห้องนอนและห้องน้ำถ้าทำได้ ให้ผู้ดูแลมีคนเดียว และใส่หน้ากากทั้งคู่","detail":"ถ้าแยกห้องไม่ได้ให้อยู่ห่างกันเกิน 1 เมตร เปิดหน้าต่าง แยกจานชามช้อนแก้ว ส่งอาหารโดยวางไว้หน้าห้อง คนอื่นในบ้านไม่เข้าห้องผู้ป่วย","ctx":"all","src":["who-afro-home","who-mpox"]},{"text":"วัดไข้และออกซิเจนปลายนิ้ววันละ 3 ครั้ง จดไว้ ต่ำกว่า 94% ต้องไปโรงพยาบาล","detail":"นั่งพัก มืออุ่น ไม่ทาเล็บ รอจนตัวเลขนิ่ง ต่ำกว่า 94% ให้ติดต่อโรงพยาบาลหรือ 1330 ทันที ต่ำกว่า 90% เป็นภาวะฉุกเฉิน โทร 1669 ผู้สูงอายุและผู้มีโรคประจำตัวต้องวัดสม่ำเสมอ","ctx":"all","src":["who-afro-home","moph-atk-timeout"]},{"text":"มีไข้ให้ดื่มน้ำมาก พักผ่อน กินพาราเซตามอลตามฉลาก ไม่เกิน 4,000 มก. ต่อวัน","detail":"ผู้ใหญ่ครั้งละ 500-1,000 มก. ห่างกันอย่างน้อย 4-6 ชั่วโมง นับรวมยาแก้หวัดสูตรผสมด้วย คนน้ำหนักไม่ถึง 50 กก. โรคตับ หรือเด็ก ให้ถามเภสัชกรเรื่องขนาดยาก่อน","ctx":"all","src":["nhs-paracetamol","who-afro-home"]},{"text":"ท้องร่วงหรืออาเจียน: จิบน้ำเกลือแร่ ORS ทีละน้อยแต่บ่อย ตั้งแต่ถ่ายครั้งแรก","detail":"อหิวาตกโรคทำให้เสียชีวิตได้ในไม่กี่ชั่วโมงจากการขาดน้ำ ผู้ป่วยส่วนใหญ่รักษาได้ด้วย ORS ถ้าถ่ายเป็นน้ำไม่หยุด ซึม ปัสสาวะน้อย หรือดื่มไม่ได้ ให้ไปโรงพยาบาลทันที","ctx":"all","src":["who-cholera"]},{"text":"เช็ดจุดที่มือจับบ่อยด้วยผงซักฟอกก่อน แล้วตามด้วยน้ำยาฟอกขาวเจือจาง","detail":"น้ำยาฟอกขาว 5% จำนวน 1 ส่วนต่อน้ำ 49 ส่วน หรือราว 20 มล. (4 ช้อนชา) ต่อน้ำ 1 ลิตร ทิ้งให้เปียกอย่างน้อย 1 นาที ผสมใหม่ทุกวัน สวมถุงมือและเปิดหน้าต่าง","ctx":"all","src":["who-disinfect","cdc-bleach"]},{"text":"ผ้า จานชาม และขยะของผู้ป่วย: แยกซัก แยกล้างด้วยน้ำยาล้างจาน มัดถุงขยะสองชั้น","detail":"ใส่ถุงมือและหน้ากากตอนเก็บ อย่าสะบัดผ้า ล้างมือทันทีหลังถอดถุงมือ ทิชชูและหน้ากากใช้แล้วทิ้งลงถุงในห้องผู้ป่วย มัดปากให้แน่นก่อนนำออก","ctx":"all","src":["who-afro-home"]},{"text":"กันผู้สูงอายุ หญิงตั้งครรภ์ ทารก และผู้ภูมิคุ้มกันต่ำ ออกจากผู้ป่วยให้ไกลที่สุด","detail":"กลุ่มนี้อาการหนักได้เร็ว ให้อยู่ห้องที่อากาศถ่ายเทดีที่สุด งดรับแขก คนที่ออกไปทำงานนอกบ้านใส่หน้ากากเมื่ออยู่ใกล้ และกินข้าวแยกวง","ctx":"all","src":["who-afro-home","cdc-resp-prevent"]},{"text":"ใส่หน้ากากในลิฟต์และทางเดิน รอลิฟต์รอบถัดไปถ้าคนแน่น ล้างมือหลังกดปุ่ม","detail":"ให้ส่งของแบบวางหน้าห้องหรือรับที่ล็อบบี้ การห้ามชุมนุมแล้วบางแห่งกลับมาระบาดซ้ำ ฟังประกาศกรมควบคุมโรคก่อนผ่อนมาตรการในบ้าน","ctx":"all","src":["wiki-1918"]},{"text":"ดูใจคนในบ้าน นอนไม่หลับ เศร้า กังวลนานเกิน 2 สัปดาห์ ให้ปรึกษา 1323","detail":"การสูญเสีย ตกงาน และการถูกกักตัวนานส่งผลต่อจิตใจ เด็กอาจแสดงออกเป็นงอแง ฝันร้าย หรือติดพ่อแม่ กลับมาทำกิจวัตรและพบปะคนอย่างค่อยเป็นค่อยไป","ctx":"all","src":[]},{"text":"เติมของที่ใช้ไป เช็กวันหมดอายุของยา หน้ากาก เจล และน้ำยาฟอกขาว","detail":"จดว่าครั้งนี้อะไรหมดก่อน อะไรซื้อไม่ได้ แล้วปรับรายการสำรอง ซื้อตอนของกลับมาเต็มชั้น ไม่ใช่ตอนมีข่าวระบาดรอบใหม่","ctx":"all","src":["ready-pandemic"]},{"text":"ทบทวนแผนของบ้าน: ห้องแยก ผู้ดูแลสำรอง การทำงาน การเรียน และเงินสำรอง","detail":"คุยกันว่าอะไรได้ผล อะไรติดขัด ปรับแผนและบอกทุกคนในบ้าน รวมถึงญาติที่ต้องพึ่งพากัน","ctx":"all","src":["ready-pandemic"]},{"text":"ไม่รังเกียจคนที่หายป่วยหรือครอบครัวผู้ป่วย เมื่อพ้นระยะแพร่เชื้อแล้วอยู่ร่วมกันได้ตามปกติ","detail":"การตีตราทำให้คนปิดบังอาการและไม่ยอมตรวจ ซึ่งทำให้โรคแพร่มากขึ้น ช่วยส่งอาหารและถามไถ่เพื่อนบ้านที่ยังแยกตัวอยู่","ctx":"all","src":[]},{"text":"ถามนิติฯ ว่าทำความสะอาดลิฟต์ ราวบันได และล้างระบบแอร์ส่วนกลางแล้วหรือยัง","detail":"ถ้าตึกเคยมีผู้ติดเชื้อจำนวนมาก ให้ตรวจการระบายอากาศของทางเดินและท่อระบายน้ำด้วย เสนอให้ตึกเขียนแผนโรคระบาดไว้ใช้ครั้งหน้า","ctx":"condo","src":[]},{"text":"ผู้สูงอายุและผู้ป่วยติดเตียงที่ขาดการติดตาม ให้แจ้ง อสม. หรือ รพ.สต. มาเยี่ยมบ้าน","detail":"ตรวจความดัน น้ำตาล แผลกดทับ และยาที่ขาดช่วง ล้างคอกสัตว์ เก็บภาชนะขังน้ำรอบบ้านที่ถูกปล่อยทิ้งช่วงกักตัว","ctx":["house","town"],"src":[]}]},"decide":{"question":"อยู่บ้านดูแลเอง หรือไปโรงพยาบาล?","go":["หายใจลำบาก หอบ พูดไม่จบประโยค หรือผู้ใหญ่หายใจเร็วเกิน 25 ครั้งต่อนาที","ออกซิเจนปลายนิ้วต่ำกว่า 94% (ต่ำกว่า 90% โทร 1669 ทันที)","เจ็บแน่นหน้าอก ริมฝีปากเขียวคล้ำ ซึม สับสน ปลุกไม่ตื่น หรือชัก","ไข้สูงเกิน 39 องศาเซลเซียสนานกว่า 24 ชั่วโมง หรืออาการแย่ลงหลังจากดีขึ้นแล้ว","กินดื่มไม่ได้ อาเจียนหรือถ่ายเป็นน้ำไม่หยุด ปัสสาวะน้อยมาก","มีเลือดออกผิดปกติ ปวดท้องรุนแรง ตัวเย็นกระสับกระส่าย โดยเฉพาะช ke"]},{"text":"จดเวลาที่เริ่มมีอาการ แล้วบอกทีมกู้ชีพ","src":["ddc-stroke"]},{"text":"ให้พักในท่าสบาย ปลอบให้สงบ เฝ้าดูการรู้สึกตัว","detail":"หมดสติแต่หายใจ: จัดท่านอนตะแคงพักฟื้น","src":["sja-stroke"]}],"dont":[{"text":"ห้ามให้กินหรือดื่มอะไรทั้งสิ้น","detail":"ผู้ป่วยอาจกลืนลำบาก","src":["sja-stroke"]},{"text":"อย่ารอดูอาการ","detail":"ยิ่งถึงโรงพยาบาลเร็ว โอกาสพิการและเสียชีวิตยิ่งลดลง","src":["ddc-stroke"]}],"src":["ddc-stroke","sja-stroke"]},{"id":"anaphylaxis","title":"แพ้รุนแรงเฉียบพลัน","group":"อาการป่วยเฉียบพลัน","signs":"หลังกินอาหาร ยา หรือถูกแมลงต่อย: ปากคอบวม หายใจมีเสียงหวีด ผื่นทั่วตัว หน้ามืด","call":"โทร 1669 ทันที บอกว่าสงสัยแพ้รุนแรง","steps":[{"text":"ถามว่ามีปากกาฉีดยาอะดรีนาลีนแก้แพ้ของตัวเองหรือไม่","src":["sja-anaphylaxis"]},{"text":"ถ้ามี ช่วยให้ผู้ป่วยฉีดทันทีตามวิธีที่เขียนบนปากกา","src":["sja-anaphylaxis"]},{"text":"โทร 1669 บอกว่าสงสัยแพ้รุนแรง","src":["sja-anaphylaxis"]},{"text":"ให้นอนราบ ยกขาสูง","detail":"ถ้าหายใจลำบาก ให้นั่งพิงแทน","src":["sja-anaphylaxis"]},{"text":"ถ้าไม่ดีขึ้นหรืออาการกลับมาใน 5 นาที และมีปากกาอีกแท่ง ฉีดซ้ำได้","src":["sja-anaphylaxis"]},{"text":"เฝ้าดูการหายใจ ถ้าหมดสติและไม่หายใจ: ปั๊มหัวใจ","src":["sja-anaphylaxis","erc-2025"]}],"dont":[{"text":"อย่ารอดูอาการ","detail":"อาการลุกลามได้ภายในไม่กี่วินาทีถึงนาที และถึงตายได้","src":["sja-anaphylaxis"]},{"text":"อย่าให้นอนราบถ้าหายใจลำบาก","detail":"ให้นั่งแทน","src":["sja-anaphylaxis"]}],"src":["sja-anaphylaxis","erc-2025"]},{"id":"asthma-attack","title":"หอบหืดกำเริบ","group":"อาการป่วยเฉียบพลัน","signs":"หายใจลำบาก มีเสียงหวีด ไอ แน่นหน้าอก พูดได้เป็นคำสั้น ๆ ริมฝีปากคล้ำ","call":"โทร 1669 ถ้าไม่มียาพ่น อาการไม่ดีขึ้น แย่ลง เหนื่อยจนหมดแรง หรือเป็นครั้งแรก","steps":[{"text":"ให้นั่งในท่าที่สบาย พูดปลอบ ให้หายใจช้า ๆ ลึก ๆ","src":["sja-asthma"]},{"text":"ให้ใช้ยาพ่นขยายหลอดลมชนิดบรรเทาอาการของผู้ป่วยเองตามขนาดปกติ","detail":"มักเป็นหลอดสีฟ้า ถ้ามีกระบอกพ่น (สเปเซอร์) ให้ใช้ด้วย","src":["sja-asthma"]},{"text":"ไม่ดีขึ้นในไม่กี่นาที: พ่น 1 ครั้งทุก 30-60 วินาที /* ---------- state ----------
   เก็บเป็น "บ้าน" หลายหลัง ข้อมูลของบ้านเป็น field แบบ key -> [ค่า, เวลาแก้] เพื่อรวมข้อมูลจากหลายเครื่อง
   แบบข้อไหนแก้ทีหลังชนะ ข้อมูลจาก localStorage ไฟล์นำเข้า และเซิร์ฟเวอร์ถือว่าไม่น่าเชื่อถือ ต้องผ่าน cleanFields() เสมอ */
const KEY = "survival.v2", OLD_KEY = "survival.v1";
const PLAN = ["meet1","meet2","hub","refuge","people","health","notes"];
const PDEF = {adults:2,children:0,elders:0,pets:0,days:7,home:"both"};
const IDK = /^[a-z]+:[A-Za-z0-9-]{1,60}$/, SECRET = /^[A-Za-z0-9_-]{43}$/;
const obj = v => v && typeof v==="object" && !Array.isArray(v) ? v : {};
const rid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);

// ตรวจค่าตามชนิดของ key คืน undefined ถ้าไม่ผ่าน (field ใหม่ต้องเพิ่มที่นี่ ไม่งั้นจะถูกทิ้ง)
function fieldValue(k, v){
  if(k==="name") return typeof v==="string" && v.trim() ? v.slice(0,40) : undefined;
  const m = /^([a-z])\.(.+)$/.exec(k); if(!m) return undefined;
  const t = m[1], r = m[2];
  if(t==="p"){ if(r==="home") return ["both","condo","house","town"].includes(v) ? v : undefined;
    if(!(r in PDEF) || !Number.isFinite(Number(v))) return undefined;
    return Math.max(r==="adults"||r==="days" ? 1 : 0, Math.min(r==="days" ? 365 : 20, Math.round(Number(v)))); }
  if(t==="c") return IDK.test(r) ? (v ? 1 : 0) : undefined;
  if(t==="e") return IDK.test(r) && (v==="" || /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : undefined;
  if(t==="u"){ if(!/^u[a-z0-9]{1,24}$/.test(r)) return undefined; if(v===null) return null; const c = obj(v);
    return /^[a-z]{1,10}$/.test(c.kit) && /^[a-z-]{1,30}$/.test(c.cat) && typeof c.n==="string" && c.n.trim() ? {kit:c.kit, cat:c.cat, n:c.n.slice(0,80)} : undefined; }
  if(t==="n") return PLAN.includes(r) && typeof v==="string" ? v.slice(0,4000) : undefined;
  return undefined;
}
function cleanFields(f){
  const out = {}, max = Date.now() + 3e5;   // ไม่ยอมรับเวลาในอนาคต กันเครื่องที่ตั้งนาฬิกาผิดชนะตลอด
  for(const k of Object.keys(obj(f)).slice(0,5000)){ const e = f[k]; if(!Array.isArray(e) || e.length!==2) continue;
    const v = fieldValue(k, e[0]), ts = Number(e[1]); if(v===undefined || !Number.isFinite(ts) || ts<0) continue;
    out[k] = [v, Math.min(Math.round(ts), max)]; }
  return out;
}
function mergeFields(a, b){
  let changed = false;
  for(const k in b){ const x = a[k], y = b[k];
    if(!x || y[1]>x[1] || (y[1]===x[1] && JSON.stringify(y[0])>JSON.stringify(x[0]))){ a[k] = y; changed = true; } }
  return changed;
}
function v1Fields(o, ts){
  const f = {}; o = obj(o);
  for(const k in PDEF) if(k in obj(o.profile)) f["p."+k] = [o.profile[k], ts];
  for(const k of Object.keys(obj(o.checks))) if(o.checks[k]) f["c."+k] = [1, ts];
  for(const k of Object.keys(obj(o.exp))) f["e."+k] = [o.exp[k], ts];
  for(const c of (Array.isArray(o.custom) ? o.custom : [])) f["u."+obj(c).id] = [c, ts];
  for(const k of PLAN) if(obj(o.plan)[k]) f["n."+k] = [o.plan[k], ts];
  return cleanFields(f);
}
function newHome(name, f){ return {id:rid("h"), f:Object.assign({name:[name, Date.now()]}, f||{}), sync:null}; }
function cleanDB(o){
  o = obj(o); const db = {cur:"", homes:{}, ui:{open:{}, showAll:obj(o.ui).showAll===true}};
  for(const id of Object.keys(obj(o.homes)).slice(0,30)){ const h = obj(o.homes[id]); if(!/^h[a-z0-9]{1,24}$/.test(id)) continue;
    const s = obj(h.sync), f = cleanFields(h.f); if(!f.name) f.name = ["บ้านของเรา", 0];
    db.homes[id] = {id, f, sync: SECRET.test(s.k) ? {k:s.k, ver:Math.max(0, Math.round(Number(s.ver))||0), dirty:!!s.dirty, at:Number(s.at)||0, gone:!!s.gone} : null}; }
  for(const k of Object.keys(obj(obj(o.ui).open)).slice(0,500)) if(IDK.test(k)) db.ui.open[k] = !!o.ui.open[k];
  db.cur = db.homes[o.cur] ? o.cur : Object.keys(db.homes)[0] || "";
  return db;
}
function loadDB(){
  let db = cleanDB(null);
  try{ db = cleanDB(JSON.parse(localStorage.getItem(KEY)||"null")); }catch(e){}
  if(!db.cur){ let f = {};
    try{ f = v1Fields(JSON.parse(localStorage.getItem(OLD_KEY)||"null"), Date.now()); }catch(e){}   // ย้ายข้อมูลจากเวอร์ชันบ้านเดียว
    const h = newHome("บ้านของเรา", f); db.homes[h.id] = h; db.cur = h.id; }
  return db;
}
let DB = loadDB();
const H = () => DB.homes[DB.cur];
function view(){
  const s = {profile:Object.assign({}, PDEF), checks:{}, exp:{}, custom:[], plan:{}, open:DB.ui.open, showAll:DB.ui.showAll, name:"บ้านของเรา"}, f = H().f;
  for(const k in f){ const v = f[k][0], t = k[0], r = k.slice(2);
    if(k==="name") s.name = v; else if(t==="p") s.profile[r] = v; else if(t==="c"){ if(v) s.checks[r] = true; }
    else if(t==="e"){ if(v) s.exp[r] = v; } else if(t==="u"){ if(v) s.custom.push({id:r, kit:v.kit, cat:v.cat, n:v.n}); } else if(t==="n") s.plan[r] = v; }
  s.custom.sort((a,b)=>a.id<b.id?-1:1);
  return s;
}
let S = view();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
// แก้ข้อมูลของบ้านปัจจุบัน: เวลาแก้ต้องมากกว่าค่าเดิมเสมอ เพื่อให้การแก้ล่าสุดในเครื่องนี้ชนะแม้นาฬิกาเครื่องช้า
function put(k, v){
  v = fieldValue(k, v); if(v===undefined) return;
  const h = H(), old = h.f[k];
  h.f[k] = [v, Math.max(Date.now(), old ? old[1]+1 : 0)];
  if(h.sync){ h.sync.dirty = true; h.sync.rev = (h.sync.rev||0)+1; queueSync(); }
  S = view(); save();
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const AID = (DATA.firstaid && DATA.firstaid.topics) || [];
const guides = () => DATA.guides.slice().sort((a,b)=>(ORDER.indexOf(a.id)+99)%99-(ORDER.indexOf(b.id)+99)%99);
const ctxOK = c => !ctxList(c).length || S.profile.home==="both" || S.showAll || ctxList(c).includes(S.profile.home);
const persons = () => S.profile.adults + S.profile.children + S.profile.elders;
const whenOK = w => !w || (w==="child"&&S.profile.children>0) || (w==="elder"&&S.profile.elders>0) || (w==="pet"&&S.profile.pets>0);

function kitDays(kit){ const k = DATA.checklist.kits.find(k=>k.id===kit); return k && k.days ? k.days : S.profile.days; }
function qty(item, kit){
  const c = item.c && item.c[kit];
  if(!c) return item.q || "";
  const n = {person:persons(), child:S.profile.children, elder:S.profile.elders, pet:S.profile.pets}[c.per] ?? 1;
  const v = c.a * n * (c.day ? kitDays(kit) : 1);
  const r = v < 10 ? Math.ceil(v*10)/10 : Math.ceil(v);
  return r.toLocaleString("th-TH") + " " + c.u;
}
function hazardItems(){
  const out = [];
  for(const g of guides()) (g.kit||[]).forEach((k,i)=>{ if(k && k.name) out.push({id:"hz-"+g.id+"-"+i, cat:"hz-"+g.id, n:k.name, d:k.why, q:k.qty, ctx:k.ctx, k:["home"]}); });
  return out;
}
function kitItems(kit){
  const base = DATA.checklist.items.filter(i => i.k.includes(kit) && ctxOK(i.ctx) && whenOK(i.when));
  const custom = S.custom.filter(i => i.kit===kit).map(i => ({id:i.id, cat:i.cat, n:i.n, custom:true, k:[kit]}));
  return base.concat(kit==="home" ? hazardItems().filter(i=>ctxOK(i.ctx)) : [], custom);
}
// ความพร้อมนับเฉพาะรายการหลักและที่เพิ่มเอง ของเสริมรายภัยมีตัวนับของแต่ละหมวดแยก
function progress(kit){ const it = kitItems(kit).filter(i=>!i.id.startsWith("hz-")); const done = it.filter(i=>S.checks[kit+":"+i.id]).length; return {done, total:it.length, pct: it.length?Math.round(done*100/it.length):0}; }
function expiring(){
  const out = [], now = Date.now();
  for(const k in S.exp){ const d = S.exp[k]; if(!d) continue;
    const days = Math.floor((new Date(d).getTime()-now)/864e5); if(days>60) continue;
    const [kit,id] = [k.slice(0,k.indexOf(":")), k.slice(k.indexOf(":")+1)];
    const item = kitItems(kit).find(i=>i.id===id); if(item) out.push({kit, item, days, date:d});
  }
  return out.sort((a,b)=>a.days-b.days);
}
const kitName = id => (DATA.checklist.kits.find(k=>k.id===id)||{}).name || id;

/* ---------- sync ----------
   บ้านที่แชร์มีรหัสลับ 32 ไบต์ (อยู่ในลิงก์เชิญและในเครื่องสมาชิกเท่านั้น) จากรหัสนี้แตกเป็น id ของบ้าน โทเคน และกุญแจเข้ารหัส
   เซิร์ฟเวอร์ได้รับแค่ id โทเคน และข้อมูลที่เข้ารหัสแล้ว จึงอ่านเนื้อหาไม่ได้ */
const SYNC = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://127.0.0.1:8787" : "https://survival-sync.thundererz.com";
const SYNC_ON = /*__SYNC_ON__*/true;   // build.py --no-sync ปิดการแชร์บ้านทั้งหมด
const canSync = SYNC_ON && !!(window.crypto && crypto.subtle) && /^https?:$/.test(location.protocol);
const enc = new TextEncoder();
function b64(u8){ let s = ""; for(let i=0; i<u8.length; i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64(s){ const b = atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u = new Uint8Array(b.length); for(let i=0; i<b.length; i++) u[i] = b.charCodeAt(i); return u; }
const KC = {};
async function keysOf(secret){
  if(KC[secret]) return KC[secret];
  const raw = await crypto.subtle.importKey("raw", unb64(secret), "HKDF", false, ["deriveBits","deriveKey"]);
  const hk = info => ({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(0), info:enc.encode("survival/"+info)});
  const bits = async (info, n) => b64(new Uint8Array(await crypto.subtle.deriveBits(hk(info), raw, n)));
  const aes = await crypto.subtle.deriveKey(hk("enc"), raw, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  return KC[secret] = {id:await bits("id",128), token:await bits("token",256), aes};
}
async function seal(aes, f){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, aes, enc.encode(JSON.stringify({f}))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64(out);
}
async function unseal(aes, data){
  const u = unb64(data);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u.subarray(0,12)}, aes, u.subarray(12));
  return cleanFields(JSON.parse(new TextDecoder().decode(pt)).f);
}
const api = (K, path, opt) => fetch(SYNC+"/v1/h/"+K.id+(path||""), Object.assign({}, opt, {headers:Object.assign({Authorization:"Bearer "+K.token}, opt && opt.body ? {"Content-Type":"application/json"} : {})}));
async function syncHome(h){
  const s = h.sync; if(!s || s.gone || s.busy || !canSync || !navigator.onLine) return;
  s.busy = true; let changed = false;
  try{
    const K = await keysOf(s.k);
    let r = await api(K, "?since="+s.ver);
    if(r.status===404){ if(s.ver>0){ s.gone = true; return; } }   // เคยมีแล้วหาย = ถูกลบหรือเปลี่ยนรหัสจากเครื่องอื่น
    else if(r.status===200){ const j = await r.json(); let remote = {};
      try{ remote = await unseal(K.aes, j.data); }catch(_){}   // ของบนเซิร์ฟเวอร์เสียหรือถอดรหัสไม่ได้: ใช้ข้อมูลในเครื่องเขียนทับ
      changed = mergeFields(h.f, remote); s.ver = j.ver; if(mergeFields(remote, h.f)) s.dirty = true; }
    else if(r.status!==304) throw new Error("เซิร์ฟเวอร์ตอบ "+r.status);
    for(let i=0; s.dirty && i<4; i++){
      const rev = s.rev||0;
      r = await api(K, "", {method:"PUT", body:JSON.stringify({base:s.ver, data:await seal(K.aes, h.f)})});
      if(r.status===200){ s.ver = (await r.json()).ver; s.dirty = (s.rev||0)!==rev; }
      else if(r.status===409){ const j = await r.json(); let remote = {}; try{ remote = await unseal(K.aes, j.data); }catch(_){}
        if(mergeFields(h.f, remote)) changed = true; s.ver = j.ver; }
      else if(r.status===429){ queueSync(); break; }
      else throw new Error("เซิร์ฟเวอร์ตอบ "+r.status);
    }
    s.at = Date.now(); s.err = "";
  }catch(e){ s.err = String(e && e.message || e).slice(0,80); }
  finally{
    s.busy = false; save();
    if(h.id===DB.cur){ S = view(); const a = document.activeElement;
      if((changed || location.hash==="#set") && !(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type!=="checkbox")) render(true); }
  }
}
const syncAll = () => Promise.all(Object.values(DB.homes).map(syncHome));
let syncTimer = 0;
function queueSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 2500); }
const inviteLink = h => location.origin + location.pathname + "#join=" + h.sync.k;
let JOIN = null, NOTE = "";   // JOIN = บ้านจากลิงก์เชิญที่รอผู้ใช้ยืนยัน, NOTE = ข้อความแจ้งผลครั้งเดียว
async function startJoin(text){
  const m = /([A-Za-z0-9_-]{43})\s*$/.exec(String(text).trim());

  if(!canSync){ NOTE = "เบราว์เซอร์นี้ใช้การแชร์บ้านไม่ได้ ต้องเปิดผ่าน https"; return; }
  try{

    if(r.status===404){ NOTE = "ไม่พบบ้านนี้ ลิงก์อาจถูกเปลี่ยนหรือลบแล้ว ขอลิงก์ใหม่จากคนในบ้าน"; return; }

}

/* ---------- QR ของลิงก์เชิญ ----------
   ตัวสร้าง QR แบบย่อ: โหมดไบต์ ระดับแก้ผิดพลาด L รุ่น 1-6 (ยาวสุด 134 ไบต์ พอสำหรับลิงก์เชิญ) คืน null ถ้ายาวเกิน */
function qrMatrix(text, forceMask){
  const data = [...enc.encode(text)], CAP = [0,19,34,55,80,108,136], ECL = [0,7,10,15,20,26,18], NB = [0,1,1,1,1,1,2];
  let ver = 1; while(ver<=6 && data.length+2 > CAP[ver]) ver++;
  if(ver>6) return null;
  const size = ver*4+17, cap = CAP[ver], ecl = ECL[ver], nb = NB[ver], bl = cap/nb, bits = [];
  const push = (v,n) => { for(let i=n-1; i>=0; i--) bits.push((v>>>i)&1); };
  push(4,4); push(data.length,8); data.forEach(b=>push(b,8)); push(0, Math.min(4, cap*8-bits.length)); while(bits.length%8) bits.push(0);
  const cw = []; for(let i=0; i<bits.length; i+=8) cw.push(parseInt(bits.slice(i,i+8).join(""),2));
  for(let p=0xEC; cw.length<cap; p^=0xFD) cw.push(p);
  // Reed-Solomon บน GF(256)
  const ex = [], lg = []; for(let i=0,x=1; i<255; i++){ ex[i] = x; lg[x] = i; x <<= 1; if(x&256) x ^= 0x11d; }
  const mul = (a,b) => a && b ? ex[(lg[a]+lg[b])%255] : 0;
  let gen = [1]; for(let i=0; i<ecl; i++){ const g = gen.concat(0); for(let j=0; j<gen.length; j++) g[j+1] ^= mul(gen[j], ex[i]); gen = g; }
  const rs = d => { const r = new Array(ecl).fill(0); for(const b of d){ const f = b ^ r.shift(); r.push(0); for(let j=0; j<ecl; j++) r[j] ^= mul(gen[j+1], f); } return r; };
  const blocks = [], ecs = [], all = [];
  for(let i=0; i<nb; i++){ const d = cw.slice(i*bl, (i+1)*bl); blocks.push(d); ecs.push(rs(d)); }
  for(let i=0; i<bl; i++) for(const b of blocks) all.push(b[i]);
  for(let i=0; i<ecl; i++) for(const e of ecs) all.push(e[i]);
  // ลวดลายคงที่
  const M = Array.from({length:size}, ()=>new Array(size).fill(0)), F = Array.from({length:size}, ()=>new Array(size).fill(false));
  const set = (x,y,v) => { M[y][x] = v ? 1 : 0; F[y][x] = true; };
  const finder = (cx,cy) => { for(let dy=-4; dy<=4; dy++) for(let dx=-4; dx<=4; dx++){ const x = cx+dx, y = cy+dy; if(x<0 || y<0 || x>=size || y>=size) continue;
    const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d!==2 && d!==4); } };
  finder(3,3); finder(size-4,3); finder(3,size-4);
  for(let i=0; i<size; i++){ if(!F[6][i]) set(i,6,i%2===0); if(!F[i][6]) set(6,i,i%2===0); }
  if(ver>1){ const c = size-7; for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++) set(c+dx, c+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1); }
  const fmt = mask => { const d = 8|mask; let r = d; for(let i=0; i<10; i++) r = (r<<1) ^ ((r>>>9)*0x537);
    const b = ((d<<10)|r) ^ 0x5412, g = i => (b>>>i)&1;
    for(let i=0; i<=5; i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9; i<15; i++) set(14-i,8,g(i));
    for(let i=0; i<8; i++) set(size-1-i,8,g(i)); for(let i=8; i<15; i++) set(8,size-15+i,g(i)); set(8,size-8,1); };
  fmt(0);   // จองพื้นที่ก่อนวางข้อมูล
  let n = 0;
  for(let right=size-1; right>=1; right-=2){ if(right===6) right = 5;
    for(let v=0; v<size; v++) for(let j=0; j<2; j++){ const x = right-j, y = ((right+1)&2)===0 ? size-1-v : v;
      if(!F[y][x] && n<all.length*8){ M[y][x] = (all[n>>>3]>>>(7-(n&7)))&1; n++; } } }
  const MASKS = [(x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0, (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0, (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply = m => { for(let y=0; y<size; y++) for(let x=0; x<size; x++) if(!F[y][x] && MASKS[m](x,y)) M[y][x] ^= 1; };
  const penalty = () => { let p = 0; for(let a=0; a<size; a++) for(const row of [true,false]){ let run = 1;
      for(let b=1; b<size; b++){ const cur = row ? M[a][b] : M[b][a], prev = row ? M[a][b-1] : M[b-1][a];
        if(cur===prev){ run++; if(run===5) p += 3; else if(run>5) p++; } else run = 1; } }
    for(let y=0; y<size-1; y++) for(let x=0; x<size-1; x++) if(M[y][x]===M[y][x+1] && M[y][x]===M[y+1][x] && M[y][x]===M[y+1][x+1]) p += 3;
    return p; };
  let best = forceMask;
  if(best===undefined){ let low = Infinity; for(let m=0; m<8; m++){ apply(m); fmt(m); const p = penalty(); if(p<low){ low = p; best = m; } apply(m); } }
  apply(best); fmt(best);
  return M;
}
function qrSvg(text){
  const M = qrMatrix(text); if(!M) return "";
  const q = 4, n = M.length + q*2; let d = "";
  for(let y=0; y<M.length; y++) for(let x=0; x<M.length; x++) if(M[y][x]) d += "M"+(x+q)+" "+(y+q)+"h1v1h-1z";
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR ลิงก์เชิญ" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

  <h2>เกี่ยวกับ</h2><div class="card mute">คู่มือนี้รวบรวมจากหน่วยงานด้านภัยพิบัติของไทยและต่างประเทศ แล้วปรับให้เข้ากับคอนโดสูงในกรุงเทพฯ และบ้านชั้นเดียวในต่างจังหวัด ดูแหล่งที่มาได้ในแต่ละคู่มือ
  ใช้เพื่อเตรียมตัวในครอบครัว ไม่แทนคำสั่งของเจ้าหน้าที่ในพื้นที่หรือคำแนะนำของแพทย์<br><a href="#terms">ข้อตกลงและความเป็นส่วนตัว</a><br>ข้อมูล ณ ${esc(DATA.built)} · <span id="off"></span></div>`;
}

function vTerms(){
  return `<a class="back" href="#set">‹ กลับ</a><h1>ข้อตกลงและความเป็นส่วนตัว</h1>
  <h2>ข้อจำกัดของเนื้อหา</h2><div class="card">คู่มือนี้เป็นข้อมูลทั่วไปเพื่อการเตรียมตัว รวบรวมจากแหล่งที่ระบุไว้ในแต่ละคู่มือ ไม่ใช่คำแนะนำทางการแพทย์ กฎหมาย หรือวิศวกรรมเฉพาะกรณี ในเหตุจริงให้ทำตามคำสั่งของเจ้าหน้าที่ในพื้นที่ก่อนเสมอ ขนาดยาให้ยึดฉลากและคำแนะนำของแพทย์หรือเภสัชกร ผู้จัดทำไม่รับผิดชอบต่อความเสียหายจากการนำไปใช้</div>
  <h2>ข้อมูลที่แอปเก็บ</h2><div class="card"><ul class="plain">
  <li><b>ถ้าไม่ได้แชร์บ้าน:</b> เช็กลิสต์ วันหมดอายุ และแผนครอบครัวอยู่ในเครื่องของคุณเท่านั้น ไม่มีอะไรถูกส่งออก</li>
  <li><b>ถ้าแชร์บ้าน:</b> ข้อมูลของบ้านนั้นถูกเข้ารหัสในเครื่องด้วยกุญแจที่อยู่ในลิงก์เชิญ แล้วฝากไว้ที่เซิร์ฟเวอร์ซิงก์ ผู้ดูแลระบบไม่มีกุญแจและอ่านเนื้อหาไม่ได้</li>
  <li><b>สิ่งที่เซิร์ฟเวอร์เห็น:</b> รหัสอ้างอิงของบ้านแบบสุ่ม ขนาดข้อมูล เวลาที่ซิงก์ และค่าแฮชของที่อยู่ IP ที่ใช้จำกัดการสร้างบ้านต่อวัน (ลบภายในไม่กี่วัน)</li>
  <li><b>ไม่มี:</b> บัญชีผู้ใช้ อีเมล เบอร์โทร คุกกี้ติดตาม หรือโฆษณา</li></ul></div>
  <h2>การลบข้อมูล</h2><div class="card"><ul class="plain">
  <li>ลบจากเซิร์ฟเวอร์ได้เองที่ ตั้งค่า → หยุดแชร์ หรือเปลี่ยนรหัสบ้าน → ลบจากเซิร์ฟเวอร์</li>
  <li>บ้านที่ไม่มีเครื่องไหนเปิดเกิน 12 เดือนจะถูกลบจากเซิร์ฟเวอร์อัตโนมัติ</li>
  <li>ผู้ดูแลกู้ข้อมูลหรือรหัสบ้านให้ไม่ได้ ถ้าลิงก์เชิญหายจากทุกเครื่อง ข้อมูลที่ฝากไว้จะเปิดไม่ได้อีก</li></ul></div>
  <h2>ความรับผิดชอบของสมาชิกบ้าน</h2><div class="card">ทุกคนที่มีลิงก์เชิญเห็นและแก้ข้อมูลของบ้านได้ทั้งหมด รวมถึงข้อมูลสุขภาพที่บันทึกไว้ ส่งลิงก์ให้เฉพาะคนที่ไว้ใจ และเปลี่ยนรหัสบ้านเมื่อมีคนที่ไม่ควรเข้าถึงได้ลิงก์ไป</div>`;
}
/* ---------- ปฐมพยาบาล ---------- */
function vAid(id){
  const fa = DATA.firstaid || {}, t = AID.find(x=>x.id===id), src = Object.fromEntries((fa.sources||[]).map(x=>[x.id,x]));
  const chips = ids => (ids||[]).filter(i=>src[i]).map(i=>`<span class="chip">${esc(src[i].org)}</span>`).join("");
  if(!t){
    const groups = []; for(const x of AID) if(!groups.includes(x.group)) groups.push(x.group);
    return `<a class="back" href="#sos">‹ กลับ</a><h1>⛑️ ปฐมพยาบาล</h1><p class="mute">${esc(fa.intro)}</p>
    <a class="btn pri" style="display:block;text-align:center;text-decoration:none" href="tel:1669">โทร 1669 เจ็บป่วยฉุกเฉิน</a>
    ${groups.map(g=>`<h2>${esc(g)}</h2><div class="card" style="padding:0">${AID.filter(x=>x.group===g).map(x=>`<a class="hrow" style="text-decoration:none;color:inherit" href="#aid/${esc(x.id)}"><span class="grow">${esc(x.title)}</span><span class="mute">›</span></a>`).join("")}</div>`).join("")}
    ${(fa.sources||[]).length?`<h2>แหล่งที่มา</h2><div class="card src"><ul class="plain">${fa.sources.map(x=>`<li>${esc(x.org)}: ${esc(x.title)}${/^https?:\/\//.test(x.url||"")?`<br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a>`:""}</li>`).join("")}</ul></div>`:""}`;
  }
  const list = (items, cls) => `<ol class="steps ${cls}">${(items||[]).map(i=>`<li><div class="t">${esc(i.text)}</div>${i.detail?`<div class="d">${esc(i.detail)}</div>`:""}${chips(i.src)}</li>`).join("")}</ol>`;
  return `<a class="back" href="#aid">‹ ปฐมพยาบาลทั้งหมด</a><h1>${esc(t.title)}</h1>
  ${t.signs?`<p class="mute">${esc(t.signs)}</p>`:""}
  ${t.call?`<div class="alert bad"><b>โทร 1669:</b> ${esc(t.call)} <a href="tel:1669">แตะเพื่อโทร</a></div>`:""}
  <h2>ทำตามลำดับ</h2>${list(t.steps, "")}
  ${(t.dont||[]).length?`<h2>ห้ามทำ</h2>${list(t.dont, "dont")}`:""}
  <p class="mute">ข้อมูลนี้ไม่แทนการอบรมปฐมพยาบาลและคำสั่งของเจ้าหน้าที่ 1669 ${chips(t.src)}</p>`;
}
function banner(){
  const note = NOTE ? `<div class="alert">${esc(NOTE)}</div>` : ""; NOTE = "";
  return note + (JOIN ? `<div class="card"><b>เข้าร่วมบ้าน "${esc(JOIN.name)}"?</b>
    <p class="mute">บ้านนี้มีคนแชร์ลิงก์มาให้ ทุกคนที่มีลิงก์เดียวกันจะเห็นและแก้ข้อมูลที่บันทึกในบ้านนี้ได้ รวมถึงแผนครอบครัวและข้อมูลสุขภาพ เข้าร่วมเฉพาะบ้านของคนที่คุณรู้จัก</p>
    <div class="btns"><button class="btn pri" data-act="joinok">เข้าร่วม</button><button class="btn" data-act="joinno">ยกเลิก</button></div></div>` : "");
}

/* ---------- router & events ---------- */
const TABS = [["home","🏠","หน้าแรก"],["list","☑️","เช็กลิสต์"],["sos","📞","ฉุกเฉิน"],["set","⚙️","ตั้งค่า"]];
function render(keepScroll){
  const [v,a,b] = (location.hash.slice(1)||"home").split("/");
  const y = window.scrollY;
  $("app").innerHTML = banner() + (v==="g" ? vGuide(a,b) : v==="list" ? vList(a||"go") : v==="sos" ? vSos() : v==="set" ? vSet() : v==="terms" ? vTerms() : v==="aid" ? vAid(a) : vHome());
  const cur = v==="g" ? "home" : v==="terms" ? "set" : v==="aid" ? "sos" : v;
  $("tabs").innerHTML = TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===cur?"on":""}"><b>${t[1]}</b>${t[2]}</a>`).join("");
  window.scrollTo(0, keepScroll ? y : 0);
  const off = $("off"); if(off) off.textContent = (navigator.serviceWorker && navigator.serviceWorker.controller) ? "พร้อมใช้ออฟไลน์" : "เปิดจากไฟล์หรือยังไม่ได้ติดตั้ง";
  const qr = $("qr"); if(qr && typeof qrSvg==="function" && H().sync) qr.innerHTML = qrSvg(inviteLink(H()));
}
// ลิงก์เชิญมาในรูป #join=<รหัสลับ>: เก็บรหัสแล้วลบออกจากแถบที่อยู่และประวัติทันที
async function checkJoinHash(){
  const m = /^#join=(.+)$/.exec(location.hash); if(!m) return false;
  history.replaceState(null, "", location.pathname + "#home");
  await startJoin(m[1]); render(false); return true;
}
addEventListener("hashchange", async ()=>{ if(!(await checkJoinHash())) render(false); });

const kitNow = () => location.hash.split("/")[1] || "go";
// ปุ่มที่ย้อนกลับไม่ได้ต้องแตะสองครั้ง
function sure(t){ if(t.dataset.sure) return true; t.dataset.sure = 1; t.textContent = "แตะอีกครั้งเพื่อยืนยัน"; return false; }

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.chk){ put("c."+t.dataset.chk, t.checked ? 1 : 0); render(true); }
  else if(t.dataset.exp){ put("e."+t.dataset.exp, t.value || ""); render(true); }
  else if(t.dataset.name){ put("name", t.value.trim() || S.name); render(true); }
  else if(t.id==="imp" && t.files[0]){ const r = new FileReader(); r.onload = ()=>{
    try{ const o = JSON.parse(r.result); const f = o && o.v===2 ? cleanFields(o.f) : o && typeof o.profile==="object" ? v1Fields(o, Date.now()) : null;
      if(!f) throw 0; delete f.name;
      const h = H(); if(mergeFields(h.f, f) && h.sync){ h.sync.dirty = true; h.sync.rev = (h.sync.rev||0)+1; queueSync(); }
      S = view(); save(); NOTE = "นำเข้าข้อมูลแล้ว"; }
    catch(_){ NOTE = "ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอป"; }
    render(false); }; r.readAsText(t.files[0]); }
});
document.addEventListener("input", e=>{ const k = e.target.dataset.plan; if(k) put("n."+k, e.target.value); });
let printing = false;
addEventListener("beforeprint", ()=>{ printing = true; document.querySelectorAll("details.cat").forEach(d=>d.open = true); });
addEventListener("afterprint", ()=>{ printing = false; render(true); });
document.addEventListener("toggle", e=>{ const d = e.target; if(!printing && d.dataset && d.dataset.cat){ DB.ui.open[(location.hash.startsWith("#list") ? kitNow() : "home")+":"+d.dataset.cat] = d.open; save(); } }, true);
document.addEventListener("submit", async e=>{
  const d = e.target.dataset; if(!d.add && !d.newhome && !d.join) return; e.preventDefault();
  const n = e.target.n.value.trim(); if(!n) return;
  if(d.add) put("u."+rid("u"), {kit:kitNow(), cat:d.add, n});
  else if(d.newhome){ const h = newHome(n.slice(0,40)); DB.homes[h.id] = h; DB.cur = h.id; S = view(); save(); }
  else if(d.join){ await startJoin(n); render(false); return; }
  render(true);
});
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-act],[data-step],[data-days],[data-home],[data-del],[data-use]"); if(!t) return;
  const d = t.dataset, h = H();
  if(d.step){ const [k,n] = d.step.split(":"); put("p."+k, S.profile[k]+Number(n)); }
  else if(d.days){ e.preventDefault(); put("p.days", Number(d.days)); }
  else if(d.home){ e.preventDefault(); put("p.home", d.home); DB.ui.showAll = false; }
  else if(d.del){ put("u."+d.del, null); }
  else if(d.use){ if(DB.homes[d.use]) DB.cur = d.use; }
  else if(d.act==="showall"){ e.preventDefault(); DB.ui.showAll = !DB.ui.showAll; }
  else if(d.act==="print"){ window.print(); return; }
  else if(d.act==="export"){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({app:"survival", v:2, name:S.name, f:h.f},null,1)],{type:"application/json"}));
    a.download = "survival-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); return; }
  else if(d.act==="reset"){ if(!sure(t)) return;
    for(const k of Object.keys(h.f)){ const c = k[0]; if(k==="name") continue; put(k, c==="c" ? 0 : c==="u" ? null : c==="p" ? PDEF[k.slice(2)] : ""); } }
  else if(d.act==="delhome"){ if(Object.keys(DB.homes).length<2 || !sure(t)) return; delete DB.homes[h.id]; DB.cur = Object.keys(DB.homes)[0]; }
  else if(d.act==="share"){ h.sync = {k:b64(crypto.getRandomValues(new Uint8Array(32))), ver:0, dirty:true, at:0, gone:false}; save(); render(true); await syncHome(h); }
  else if(d.act==="syncnow"){ t.textContent = "กำลังซิงก์"; await syncHome(h); }
  else if(d.act==="copy"){ try{ await navigator.clipboard.writeText(inviteLink(h)); t.textContent = "คัดลอกแล้ว"; }catch(_){ const i = $("inv"); i.focus(); i.select(); t.textContent = "เลือกลิงก์ไว้แล้ว กดคัดลอกเอง"; } return; }
  else if(d.act==="send"){ try{ await navigator.share({title:"คู่มือเอาตัวรอด: "+S.name, text:"ลิงก์เข้าร่วมบ้าน "+S.name, url:inviteLink(h)}); }catch(_){} return; }
  else if(d.act==="unsync"){ if(!sure(t)) return; h.sync = null; }
  else if(d.act==="wipe" || d.act==="rotate"){ if(!sure(t)) return;
    try{ const old = await keysOf(h.sync.k);
      if(d.act==="rotate"){ h.sync = {k:b64(crypto.getRandomValues(new Uint8Array(32))), ver:0, dirty:true, at:0, gone:false}; save(); await syncHome(h);
        if(h.sync.dirty) throw 0; }   // ลบของเก่าเมื่อของใหม่ขึ้นเซิร์ฟเวอร์แล้วเท่านั้น
      const r = await api(old, "", {method:"DELETE"}); if(r.status!==200 && r.status!==404) throw 0;
      if(d.act==="wipe") h.sync = null;
      NOTE = d.act==="wipe" ? "ลบข้อมูลของบ้านนี้จากเซิร์ฟเวอร์แล้ว" : "เปลี่ยนรหัสบ้านแล้ว ส่งลิงก์เชิญใหม่ให้คนในบ้าน";
    }catch(_){ NOTE = "ทำไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่"; } }
  else if(d.act==="joinok" && JOIN){ const nh = newHome(JOIN.name, JOIN.f); nh.sync = {k:JOIN.k, ver:JOIN.ver, dirty:false, at:Date.now(), gone:false};
    DB.homes[nh.id] = nh; DB.cur = nh.id; JOIN = null; NOTE = "เข้าร่วมบ้านแล้ว"; }
  else if(d.act==="joinno"){ JOIN = null; }
  S = view(); save(); render(true);
});

(async ()=>{ if(!(await checkJoinHash())) render(false); syncAll(); })();
addEventListener("online", syncAll);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncAll(); });
setInterval(()=>{ if(!document.hidden) syncAll(); }, 60000);
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  // เมื่อมีเวอร์ชันใหม่เข้ามาแทน ให้โหลดหน้าใหม่หนึ่งครั้งเพื่อไม่ค้างเนื้อหาเก่า
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(had && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{ const off = $("off"); if(off) off.textContent = "พร้อมใช้ออฟไลน์"; }).catch(()=>{});
}
</script>
