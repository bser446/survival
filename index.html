<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1c1b19; --mute:#66625b; --line:#e2ded5;
  --accent:#b3261e; --accent-ink:#ffffff; --ok:#1f7a4d; --warn:#9a5b00; --warn-bg:#fff3d6;
  --bad:#b3261e; --bad-bg:#fde4e1; --chip:#ece8df;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413; --card:#1f1e1c; --ink:#f1eee8; --mute:#a8a299; --line:#34322e;
    --accent:#ff6b5e; --accent-ink:#1a0806; --ok:#5fd39a; --warn:#ffc65c; --warn-bg:#3a2c0c;
    --bad:#ff8a80; --bad-bg:#3d1613; --chip:#2b2926;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Sarabun","Noto Sans Thai","Thonburi","Leelawadee UI",system-ui,sans-serif;
  font-size:17px;line-height:1.6;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.3;margin:8px 0 4px}
h2{font-size:19px;margin:24px 0 8px}
p{margin:6px 0}
.mute{color:var(--mute);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{flex:1;max-width:160px;text-align:center;padding:10px 4px;text-decoration:none;color:var(--mute);font-size:14px;min-height:56px}
nav.tabs a b{display:block;font-size:20px;line-height:1.2;font-weight:400}
nav.tabs a.on{color:var(--accent);font-weight:700}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.haz{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:104px;padding:14px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--ink);font-weight:700;font-size:19px}
.haz span{font-size:32px;line-height:1}
.haz:active{border-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.alert.bad{background:var(--bad-bg);color:var(--bad)}

.seg{display:flex;gap:6px;overflow-x:auto;margin:12px -16px;padding:0 16px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:16px;white-space:nowrap}
.seg a.on{background:var(--accent);color:var(--accent-ink);font-weight:700}

ol.steps{list-style:none;padding:0;margin:0;counter-reset:s}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px 12px 54px;margin:8px 0;position:relative}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:12px;width:30px;height:30px;border-radius:50%;
  background:var(--accent);color:var(--accent-ink);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
ol.steps.dont li::before{content:"✕";background:var(--bad)}
ol.steps .t{font-size:19px;font-weight:700;line-height:1.45}
ol.steps .d{color:var(--mute);font-size:15.5px;margin-top:4px}
.chip{display:inline-block;background:var(--chip);color:var(--mute);border-radius:6px;padding:0 7px;font-size:12.5px;margin:4px 4px 0 0;font-weight:400}
.back{display:inline-block;padding:8px 0;text-decoration:none;font-size:16px}
ul.plain{padding-left:20px;margin:6px 0}
ul.plain li{margin:4px 0}

details.cat{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
details.cat summary{list-style:none;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary small{font-weight:400;color:var(--mute)}
.item{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.item input[type=checkbox]{flex:none;width:28px;height:28px;margin:2px 0 0;accent-color:var(--ok)}
.item .n{font-weight:600;line-height:1.45}
.item.done .n{color:var(--mute);text-decoration:line-through}
.item .q{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;font-size:14px;font-weight:700;margin-top:3px}
.item .d{color:var(--mute);font-size:14.5px}
.item .w{color:var(--bad);font-size:14.5px;font-weight:600}
.item .x{margin-top:6px;font-size:14px;color:var(--mute);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .x input{padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14px}
.item .del{background:none;border:0;color:var(--mute);font-size:20px;padding:0 4px}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.add input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}

.hrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
#qr svg{display:block;width:220px;max-width:70%;height:auto;margin:10px auto;background:#fff;border-radius:8px}
.tel{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}
.tel:first-child{border-top:0}
.tel b{font-size:22px;color:var(--accent);min-width:64px}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:15px}
.in{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
textarea.in{min-height:76px;resize:vertical}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;line-height:1}
.step output{min-width:32px;text-align:center;font-weight:700;font-size:20px}
.src a{word-break:break-all;font-size:14px}

@media print{
  nav.tabs,.seg,.btns,.add,.del,.back{display:none!important}
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  details.cat{break-inside:avoid;border-color:#999}
}
</style>
</head>

<script>
const DATA = {"guides":[{"id":"blackout","title":"ไฟดับวงกว้าง","summary":"ไฟดับเองไม่ค่อยฆ่าคน แต่คนตายจากก๊าซคาร์บอนมอนอกไซด์ของเครื่องปั่นไฟ ไฟไหม้จากเทียน เครื่องช่วยชีวิตหยุดทำงาน ความร้อน และอาหารเสีย หลักคือสำรองน้ำ แสงสว่าง เงินสด และไฟสำหรับอุปกรณ์แพทย์ไว้ก่อน","sources":[{"id":"ready-power","org":"Ready.gov (FEMA)","title":"Power Outages","url":"https://www.ready.gov/power-outages","country":"US"},{"id":"cdc-food","org":"CDC","title":"Keep Food Safe After a Disaster or Emergency","url":"https://www.cdc.gov/food-safety/foods/keep-food-safe-after-emergency.html","country":"US"},{"id":"fda-food","org":"FDA","title":"Food and Water Safety During Power Outages and Floods","url":"https://www.fda.gov/food/buy-store-serve-safe-food/food-and-water-safety-during-power-outages-and-floods","country":"US"},{"id":"cdc-co","org":"CDC","title":"Carbon Monoxide Poisoning Basics","url":"https://www.cdc.gov/carbon-monoxide/about/index.html","country":"US"},{"id":"wiki-iberia-2025","org":"Wikipedia","title":"2025 Iberian Peninsula blackout","url":"https://en.wikipedia.org/wiki/2025_Iberian_Peninsula_blackout","country":"INT"},{"id":"wiki-texas-2021","org":"Wikipedia","title":"2021 Texas power crisis","url":"https://en.wikipedia.org/wiki/2021_Texas_power_crisis","country":"INT"},{"id":"wiki-chile-2025","org":"Wikipedia","title":"2025 Chile blackout","url":"https://en.wikipedia.org/wiki/2025_Chile_blackout","country":"INT"},{"id":"pattayamail-south-2013","org":"Pattaya Mail","title":"14-province blackout not caused by human error: Probe panel","url":"https://www.pattayamail.com/business/14-province-blackout-not-caused-by-human-error-probe-panel-26754","country":"TH"},{"id":"krisinfo-home","org":"Krisinformation.se (หน่วยงานรัฐสวีเดน)","title":"Home preparedness","url":"https://www.krisinformation.se/en/hazards-and-risks/home-preparedness/","country":"SE"},{"id":"vumc-meds","org":"Vanderbilt University Medical Center Poison Control","title":"What is the Stability of Refrigerated Medications at Room Temperature?","url":"https://www.vumc.org/poison-control/toxicology-question-week/oct-3-2005-what-stability-refrigerated-medications-room-temperature","country":"US"},{"id":"sanook-lift","org":"Sanook","title":"วิธีเอาตัวรอดเมื่อ ลิฟต์ค้าง และสิ่งที่ไม่ควรทำเมื่อติดลิฟต์","url":"https://www.sanook.com/women/247013/","country":"TH"}],"phases":{"before":[{"text":"สำรองน้ำดื่มอย่างน้อย 3 ลิตรต่อคนต่อวัน ให้พอ 7 วัน","detail":"ไฟดับวงกว้างมักทำให้น้ำประปาหยุดตามเพราะปั๊มไม่ทำงาน เก็บน้ำใช้แยกอีกส่วนสำหรับล้างและกดชักโครก หมุนเวียนน้ำดื่มตามวันหมดอายุ","ctx":"all","src":["krisinfo-home","wiki-texas-2021"]},{"text":"ใครใช้เครื่องช่วยหายใจ เครื่องผลิตออกซิเจน ให้วางแผนไฟสำรองกับแพทย์","detail":"ถามแพทย์ว่าเครื่องอยู่ได้นานเท่าไร มีแบตสำรองหรือถังออกซิเจนสำรองไหม และจะย้ายไปโรงพยาบาลไหนเมื่อไฟดับนาน เหตุปี 2568 มีผู้เสียชีวิตเพราะเครื่องหยุด","ctx":"all","src":["ready-power","wiki-iberia-2025","wiki-chile-2025"]},{"text":"ถามแพทย์หรือเภสัชกรว่ายาแช่เย็น เช่น อินซูลิน อยู่นอกตู้เย็นได้นานแค่ไหน","detail":"เตรียมกระติกและเจลเย็นไว้ในช่องแข็ง อินซูลินส่วนใหญ่ทนอุณหภูมิ 15-30°C ได้ราว 28 วัน แต่ห้องไทยที่ไม่มีแอร์ร้อนเกินนั้นได้","ctx":"all","src":["ready-power","vumc-meds"]},{"text":"มีไฟฉายให้ครบทุกคน พร้อมถ่านสำรอง วางในจุดที่คลำเจอในความมืด","detail":"ไฟฉายคาดหัวทำให้มือว่างเวลาเดินบันได ใช้ไฟฉายและโคม LED แทนเทียนเสมอ","ctx":"all","src":["ready-power"]},{"text":"เก็บเงินสดธนบัตรย่อยไว้ที่บ้าน พอซื้อของจำเป็นหลายวัน","detail":"ไฟดับสเปน-โปรตุเกส 2568 ตู้ ATM และการจ่ายด้วยบัตรใช้ไม่ได้ทันที พร้อมเพย์และ QR ต้องใช้ทั้งไฟและเน็ตเช่นกัน","ctx":"all","src":["wiki-iberia-2025","krisinfo-home"]},{"text":"มีวิทยุ AM/FM ใส่ถ่านหรือมือหมุน และรู้คลื่นข่าวของจังหวัด","detail":"เมื่อเสาสัญญาณมือถือแบตหมด วิทยุคือช่องทางเดียวที่ยังรับประกาศได้ ปี 2568 คนในสเปนแห่หาซื้อวิทยุใส่ถ่าน","ctx":"all","src":["wiki-iberia-2025","krisinfo-home"]},{"text":"ชาร์จพาวเวอร์แบงก์ให้เต็มเสมอ อย่างน้อย 20,000 mAh ต่อคน","detail":"20,000 mAh ชาร์จมือถือได้ราว 3-4 รอบ ถ้าต้องจ่ายพัดลม DC หรือเครื่อง CPAP ให้ดูเพาเวอร์สเตชัน 500-1,000 Wh และลองใช้จริงก่อน","ctx":"all","src":["ready-power"]},{"text":"เติมน้ำมันรถไม่ให้ต่ำกว่าครึ่งถัง ชาร์จรถไฟฟ้าไม่ให้ต่ำกว่าครึ่ง","detail":"หัวจ่ายน้ำมันและตู้ชาร์จใช้ไฟฟ้า ไฟดับแล้วเติมไม่ได้ รถยังเป็นที่ชาร์จมือถือและที่หลบร้อนชั่วคราวได้ ถ้าจอดกลางแจ้ง","ctx":"all","src":[]},{"text":"สำรองอาหารที่ไม่ต้องแช่เย็นและไม่ต้องหุงต้ม ให้พอ 3-7 วัน","detail":"ปลากระป๋อง ขนมปังกรอบ ถั่ว นม UHT อาหารเด็ก อาหารสัตว์เลี้ยง มีที่เปิดกระป๋องแบบมือ เท็กซัส 2564 ร้านค้าปิดและของหมดชั้นภายในไม่กี่วัน","ctx":"all","src":["ready-power","wiki-texas-2021"]},{"text":"ถามนิติฯ: เครื่องปั่นไฟตึกจ่ายอะไรบ้าง นานกี่ชั่วโมง น้ำมันสำรองเท่าไร","detail":"ถามเรื่องลิฟต์ ปั๊มน้ำ ปั๊มดับเพลิง ไฟบันไดหนีไฟ ประตูคีย์การ์ด ไม้กั้นที่จอดรถ ไฟฉุกเฉินแบบแบตเตอรี่มักอยู่ได้เพียงราว 1.5-2 ชั่วโมง","ctx":"condo","src":[]},{"text":"รู้วิธีเปิดประตูดิจิทัลล็อกเมื่อแบตหมด และพกกุญแจสำรองแบบโลหะ","detail":"ล็อกส่วนใหญ่ใช้ถ่านในตัวจึงยังทำงานตอนไฟดับ แต่ประตูส่วนกลางแบบคีย์การ์ดและแม่เหล็กอาจล็อกค้างหรือปลดเอง ถามนิติฯ ว่าเป็นแบบไหน","ctx":"condo","src":[]},{"text":"บ้านใช้น้ำบาดาลหรือปั๊มน้ำ ให้มีถังเก็บน้ำสูงหรือโอ่งสำรองไว้","detail":"ปั๊มไฟฟ้าหยุดทันทีที่ไฟดับ ถังสูงที่ปล่อยน้ำด้วยแรงโน้มถ่วงหรือคันโยกมือทำให้ยังมีน้ำใช้ เติมให้เต็มเป็นประจำ","ctx":"house","src":[]},{"text":"ติดเครื่องเตือนคาร์บอนมอนอกไซด์แบบใส่ถ่าน ถ้ามีเครื่องปั่นไฟ","detail":"ก๊าซนี้ไม่มีสี ไม่มีกลิ่น ติดใกล้ห้องนอน เปลี่ยนถ่านปีละ 2 ครั้ง และเตรียมสายพ่วงยาวพอให้วางเครื่องห่างบ้านเกิน 6 เมตร","ctx":"house","src":["cdc-co","ready-power"]},{"text":"บันทึกเบอร์ MEA 1130, PEA 1129, 1669, 199, 191, 1784 ลงกระดาษ","detail":"MEA ดูแลกรุงเทพฯ นนทบุรี สมุทรปราการ ที่เหลือเป็น PEA จดหมายเลขผู้ใช้ไฟจากบิลไว้ด้วยเพื่อแจ้งเหตุได้เร็ว","ctx":"all","src":[]}],"during":[{"text":"ห้ามเดินเครื่องปั่นไฟในบ้าน โรงรถ ระเบียง หรือใกล้หน้าต่างเด็ดขาด","detail":"ต้องอยู่กลางแจ้ง ห่างประตู หน้าต่าง ช่องลมเกิน 6 เมตร แม้เปิดประตูโรงรถก็ไม่ปลอดภัย สเปน 2568 ครอบครัว 3 คนเสียชีวิตจากเครื่องปั่นไฟในบ้าน","ctx":"all","src":["cdc-co","ready-power","wiki-iberia-2025"]},{"text":"ปวดหัว เวียนหัว คลื่นไส้ ขณะใช้เครื่องยนต์หรือเตาถ่าน ให้ออกไปที่โล่งทันที","detail":"เป็นอาการพิษคาร์บอนมอนอกไซด์ คล้ายไข้หวัด คนที่หลับอยู่ตายได้โดยไม่รู้ตัว พาทุกคนออกไปรับอากาศแล้วโทร 1669","ctx":"all","src":["cdc-co"]},{"text":"อุปกรณ์แพทย์ใกล้หมดไฟ ให้ย้ายไปโรงพยาบาลก่อนแบตหมด โทร 1669","detail":"อย่ารอจนเครื่องดับ โรงพยาบาลมีเครื่องปั่นไฟและส่วนใหญ่ยังทำงานได้ ปี 2568 มีผู้ป่วยใช้เครื่องช่วยหายใจที่บ้านเสียชีวิตเมื่อแบตหมด","ctx":"all","src":["wiki-iberia-2025","wiki-chile-2025","ready-power"]},{"text":"ใช้ไฟฉายหรือโคม LED อย่าใช้เทียน ถ้าจำเป็นห้ามทิ้งไว้ลับตา","detail":"เทียนล้มทำให้ไฟไหม้ และตอนไฟดับปั๊มน้ำดับเพลิงกับสัญญาณเตือนอาจไม่ทำงาน มาดริด 2568 มีผู้เสียชีวิตจากไฟไหม้ที่เกิดจากเทียน","ctx":"all","src":["wiki-iberia-2025"]},{"text":"ติดลิฟต์: กดปุ่มกระดิ่งหรืออินเตอร์คอม รอคนช่วย ห้ามงัดประตูหรือปีนออก","detail":"ในลิฟต์มีอากาศถ่ายเทพอ อันตรายจริงคือการตกช่องลิฟต์ตอนปีนออกเอง นั่งลง ประหยัดแบตมือถือ โทรนิติฯ หรือ 199","ctx":"condo","src":["sanook-lift"]},{"text":"ห้ามใช้ลิฟต์แม้ยังวิ่งด้วยไฟสำรอง ใช้บันไดพร้อมไฟฉาย","detail":"ไฟสำรองอาจหมดหรือสลับระบบกลางทางได้ทุกเมื่อ ลงบันไดโดยจับราว พักเป็นระยะ อย่าขนของหนักจนมองไม่เห็นขั้นบันได","ctx":"condo","src":[]},{"text":"รองน้ำใส่ถัง อ่าง และขวดทันทีที่ไฟดับ ก่อนน้ำในถังบนดาดฟ้าจะหมด","detail":"ตึกสูงใช้ปั๊มส่งน้ำขึ้น ไฟดับแล้วน้ำมักหยุดไหลภายในไม่กี่ชั่วโมง ชั้นบนสุดที่ใช้ปั๊มเพิ่มแรงดันอาจหยุดทันที ใช้น้ำอย่างประหยัด","ctx":"condo","src":["wiki-iberia-2025"]},{"text":"ปิดประตูตู้เย็นและช่องแข็งไว้ เปิดให้น้อยครั้งที่สุด","detail":"ตู้เย็นที่ไม่เปิดเก็บความเย็นได้ราว 4 ชั่วโมง ช่องแข็งเต็มตู้ราว 48 ชั่วโมง ครึ่งตู้ราว 24 ชั่วโมง จดเวลาที่ไฟดับไว้","ctx":"all","src":["cdc-food","ready-power","fda-food"]},{"text":"ย้ายยาแช่เย็นใส่กระติกพร้อมเจลเย็น ห่อผ้ากันยาสัมผัสน้ำแข็งโดยตรง","detail":"อินซูลินและวัคซีนห้ามแข็งตัว ถ้าแข็งแล้วต้องทิ้ง จดเวลาที่ยาออกจากตู้เย็น แล้วถามเภสัชกรก่อนใช้ต่อหากไฟดับเกิน 1 วัน","ctx":"all","src":["vumc-meds","ready-power"]},{"text":"ถอดปลั๊กแอร์ ตู้เย็น ทีวี คอมพิวเตอร์ เหลือหลอดไฟไว้ 1 ดวงเป็นสัญญาณ","detail":"ไฟที่กลับมาอาจกระชากหรือตกๆ ดับๆ ทำให้เครื่องใช้เสียหาย รอให้ไฟนิ่งสัก 5-10 นาทีแล้วค่อยเสียบทีละเครื่อง","ctx":"all","src":["ready-power"]},{"text":"กันร้อน: ดื่มน้ำบ่อย เช็ดตัวด้วยผ้าเปียก อยู่ชั้นล่างหรือฝั่งร่ม เปิดให้ลมผ่าน","detail":"เฝ้าดูผู้สูงอายุ เด็กเล็ก ผู้ป่วย ถ้าตัวร้อนจัด สับสน ผิวแห้งไม่มีเหงื่อ คือฮีตสโตรก รีบทำให้ตัวเย็นและโทร 1669 ไปที่ที่มีไฟถ้าร้อนเกินทน","ctx":"all","src":["ready-power"]},{"text":"ประหยัดแบตมือถือ: เปิดโหมดประหยัดพลังงาน ลดแสงจอ ใช้ข้อความแทนโทร","detail":"เสาสัญญาณมีแบตสำรองเพียงไม่กี่ชั่วโมง ปี 2568 การใช้งานเครือข่ายในสเปนเหลือราว 17% ของปกติ ส่งข่าวครอบครัวแต่เนิ่นๆ แล้วเปิดวิทยุฟังข่าว","ctx":"all","src":["wiki-iberia-2025"]},{"text":"สัญญาณไฟจราจรดับ ให้ถือเป็นทางแยกหยุดทุกด้าน งดเดินทางถ้าไม่จำเป็น","detail":"รถไฟฟ้าหยุด ปั๊มน้ำมันเติมไม่ได้ ไม้กั้นที่จอดรถอาจไม่ยก ถนนมืดและไม่มีกล้อง เก็บน้ำมันในรถไว้สำหรับเหตุจำเป็นจริง","ctx":"all","src":["wiki-iberia-2025","wiki-chile-2025"]},{"text":"กลางคืนล็อกบ้าน กางมุ้งหรือทายากันยุง เก็บไฟฉายไว้ข้างตัว","detail":"ไม่มีพัดลมและแอร์ต้องเปิดหน้าต่าง ยุงเข้ามากขึ้น เสี่ยงไข้เลือดออก ไฟถนน กล้อง และสัญญาณกันขโมยดับ ให้เพื่อนบ้านช่วยดูกัน","ctx":"house","src":[]}],"after":[{"text":"ทิ้งอาหารสดในตู้เย็นถ้าไฟดับเกิน 4 ชั่วโมง ห้ามชิมเพื่อทดสอบ","detail":"เนื้อ ปลา ไข่ นม ผลไม้หั่น อาหารเหลือ ต้องทิ้ง กลิ่นและรสบอกไม่ได้ว่าปลอดภัย อากาศร้อนเกิน 32°C อาหารที่วางข้างนอกเสียได้ใน 1 ชั่วโมง","ctx":"all","src":["cdc-food","fda-food"]},{"text":"ของแช่แข็งที่ยังมีเกล็ดน้ำแข็งหรือเย็นไม่เกิน 4°C แช่ต่อหรือปรุงได้","detail":"ถ้าละลายหมดและอุ่นเกิน 4°C นานกว่า 4 ชั่วโมงให้ทิ้ง ใช้เทอร์โมมิเตอร์ตู้เย็นวัด สงสัยเมื่อไรให้ทิ้ง","ctx":"all","src":["cdc-food","fda-food"]},{"text":"ยาแช่เย็นที่อยู่นอกตู้เกิน 1 วัน ให้ถามแพทย์หรือเภสัชกรก่อนใช้","detail":"ถ้าเป็นยาที่ขาดไม่ได้ เช่น อินซูลิน และไม่มียาใหม่ ให้ใช้ต่อไปก่อนจนกว่าจะได้ยาชุดใหม่ แล้วรีบติดต่อแพทย์ อย่าหยุดยาเอง","ctx":"all","src":["ready-power","vumc-meds"]},{"text":"ไฟมาแล้วรอให้นิ่งก่อน ค่อยเสียบปลั๊กทีละเครื่อง เริ่มจากตู้เย็น","detail":"เปิดพร้อมกันทั้งบ้านทำให้ไฟกระชากและเบรกเกอร์ตัด ไฟอาจดับซ้ำในชั่วโมงแรก อย่าเพิ่งเก็บไฟฉาย","ctx":"all","src":["ready-power"]},{"text":"น้ำประปากลับมาแล้วขุ่นหรือมีกลิ่น ให้ต้มเดือดอย่างน้อย 1 นาทีก่อนดื่ม","detail":"แรงดันในท่อที่ตกทำให้สิ่งปนเปื้อนเข้าระบบได้ เท็กซัส 2564 ประชาชนเกือบ 12 ล้านคนถูกแจ้งให้ต้มน้ำ เปิดน้ำทิ้งจนใสก่อน","ctx":"all","src":["fda-food","wiki-texas-2021"]},{"text":"ยังห้ามใช้ลิฟต์จนกว่านิติฯ แจ้งว่าช่างตรวจและรีเซ็ตระบบแล้ว","detail":"ลิฟต์อาจค้างซ้ำหากไฟตกอีกรอบ ถามด้วยว่าปั๊มดับเพลิง สัญญาณเตือนไฟ และปั๊มน้ำกลับมาทำงานครบหรือยัง","ctx":"condo","src":[]},{"text":"ไฟยังไม่มาเฉพาะบ้านเรา ให้ตรวจเบรกเกอร์ แล้วแจ้ง MEA 1130 หรือ PEA 1129","detail":"ห้ามแตะสายไฟที่ขาดหรือห้อยลงมา อยู่ห่างอย่างน้อย 10 เมตรแล้วแจ้งการไฟฟ้าทันที","ctx":"house","src":[]},{"text":"เติมของที่ใช้ไป: น้ำ ถ่าน อาหาร เงินสด น้ำมัน และชาร์จทุกอย่างให้เต็ม","detail":"ระบบไฟอาจยังไม่เสถียรและดับซ้ำได้ในวันถัดไป จดว่าครั้งนี้ขาดอะไร อะไรหมดเร็ว แล้วปรับชุดสำรอง","ctx":"all","src":[]},{"text":"ปั๊มน้ำบาดาลกลับมาทำงาน ให้เปิดน้ำทิ้งจนใส และตรวจว่าปั๊มไม่เดินแห้ง","detail":"ถ้าปั๊มเดินแต่น้ำไม่ขึ้นให้ปิดทันที อาจต้องล่อน้ำใหม่ ปล่อยไว้มอเตอร์จะไหม้","ctx":"house","src":[]},{"text":"ไปเยี่ยมผู้สูงอายุ ผู้ป่วยติดเตียง และเพื่อนบ้านที่อยู่คนเดียว","detail":"กลุ่มนี้เสี่ยงที่สุดจากความร้อน ยาขาด และอุปกรณ์แพทย์หยุด ผู้เสียชีวิตในเหตุไฟดับใหญ่ส่วนมากเป็นผู้ป่วยและผู้สูงอายุที่อยู่ลำพัง","ctx":"all","src":["wiki-texas-2021","wiki-iberia-2025"]}]},"decide":{"question":"อพยพหรืออยู่ต่อ?","go":["มีคนในบ้านใช้อุปกรณ์แพทย์ไฟฟ้าและแบตสำรองเหลือไม่ถึงครึ่ง","มีอาการจากความร้อน: ตัวร้อนจัด สับสน หน้ามืด โดยเฉพาะเด็กเล็กและผู้สูงอายุ","น้ำดื่มเหลือไม่ถึง 1 วัน และไม่มีแหล่งเติม","อยู่คอนโดชั้นสูงกับผู้ที่เดินบันไดไม่ไหว และคาดว่าไฟดับเกิน 1 วัน","ได้กลิ่นควัน มีไฟไหม้ หรือสงสัยก๊าซคาร์บอนมอนอกไซด์ในอาคาร","ทางการประกาศให้อพยพ หรือเปิดศูนย์พักพิงที่มีไฟและน้ำ"],"stay":["ทุกคนแข็งแรง มีน้ำ อาหาร และแสงสว่างพอหลายวัน","ข้างนอกอันตรายกว่า: ถนนมืด ไฟจราจรดับ รถติด น้ำมันเติมไม่ได้","ที่พักระบายอากาศได้และไม่ร้อนจนเป็นอันตราย","ยังรับข่าวสารได้ทางวิทยุหรือมือถือ และการไฟฟ้าแจ้งว่ากำลังกู้ระบบ","ไม่มีที่หมายที่แน่ใจว่ามีไฟและน้ำ อย่าออกเดินทางแบบเดาสุ่ม"]},"dont":[{"text":"ห้ามใช้เครื่องปั่นไฟ เตาถ่าน เตาแก๊สปิกนิก ในบ้านหรือที่อับอากาศ","detail":"ปล่อยก๊าซคาร์บอนมอนอกไซด์ที่ไม่มีสีไม่มีกลิ่น เท็กซัส 2564 มีผู้ป่วยอย่างน้อย 300 รายและเสียชีวิตอย่างน้อย 19 ราย","src":["cdc-co","wiki-texas-2021"]},{"text":"ห้ามติดเครื่องรถในโรงรถปิดเพื่อชาร์จมือถือหรือเปิดแอร์","detail":"ไอเสียสะสมถึงระดับอันตรายได้ในไม่กี่นาที ต้องนำรถออกมาจอดกลางแจ้งก่อน","src":["cdc-co"]},{"text":"ห้ามทิ้งเทียนหรือตะเกียงไว้โดยไม่มีคนเฝ้า หรือจุดใกล้ผ้าม่านและที่นอน","detail":"ไฟไหม้ช่วงไฟดับอันตรายกว่าปกติ เพราะระบบเตือนภัยและปั๊มน้ำอาจไม่ทำงาน และรถดับเพลิงมาช้า","src":["wiki-iberia-2025"]},{"text":"ห้ามเสียบเครื่องปั่นไฟเข้ากับเต้ารับของบ้านโดยตรง","detail":"ไฟจะย้อนเข้าสายส่ง ทำให้ช่างการไฟฟ้าและเพื่อนบ้านถูกไฟดูดได้ ใช้สายพ่วงเสียบเครื่องใช้เข้ากับเครื่องปั่นไฟโดยตรงเท่านั้น","src":["ready-power"]},{"text":"ห้ามเติมน้ำมันขณะเครื่องปั่นไฟยังร้อนหรือยังเดินอยู่","detail":"ไอน้ำมันโดนชิ้นส่วนร้อนแล้วลุกติดไฟ ดับเครื่อง รอให้เย็น แล้วค่อยเติม และกันเครื่องไม่ให้เปียกฝน","src":["ready-power"]},{"text":"ห้ามชิมอาหารเพื่อดูว่าเสียหรือยัง","detail":"เชื้อที่ทำให้อาหารเป็นพิษไม่เปลี่ยนกลิ่นหรือรส สงสัยให้ทิ้ง","src":["cdc-food"]},{"text":"ห้ามเปิดตู้เย็นบ่อยๆ เพื่อดูของ","detail":"ทุกครั้งที่เปิด ความเย็นหายไป เวลา 4 ชั่วโมงจะสั้นลงมาก วางแผนหยิบของครั้งเดียว","src":["cdc-food","ready-power"]},{"text":"ห้ามงัดประตูลิฟต์หรือปีนออกทางเพดานลิฟต์","detail":"ลิฟต์อาจขยับเมื่อไฟกลับมา และช่องลิฟต์ลึกหลายสิบเมตร รอช่างหรือเจ้าหน้าที่กู้ภัยเท่านั้น","src":["sanook-lift"]},{"text":"ห้ามแตะหรือเข้าใกล้สายไฟที่ขาด แม้ไฟจะดับอยู่ทั้งเมือง","detail":"ไฟอาจกลับมาโดยไม่มีสัญญาณเตือน หรือมีไฟย้อนจากเครื่องปั่นไฟของบ้านอื่น","src":[]},{"text":"ห้ามใช้เตาแก๊สหรือเตาอบเป็นแหล่งความร้อนหรือแสงสว่าง","detail":"เพิ่มคว ","org":"Wikipedia","title":"Grenfell Tower fire","url":"https://en.wikipedia.org/wiki/Grenfell_Tower_fire","country":"INT"},{"id":"wiki-wangfuk","org":"Wikipedia","title":"Wang Fuk Court fire","url":"https://en.wikipedia.org/wiki/Wang_Fuk_Court_fire","country":"INT"}],"phases":{"before":[{"text":"วางแผนทางหนี 2 ทางจากทุกห้อง นัดจุดรวมพลนอกอาคาร ซ้อมปีละ 2 ครั้ง","detail":"ไฟเล็ก ๆ ลามเป็นไฟใหญ่ได้ในเวลาไม่ถึง 30 วินาที และบ้านลุกทั้งหลังได้ในราว 5 นาที จึงไม่มีเวลาคิดตอนเกิดเหตุ ต้องซ้อมจนทุกคนทำได้เอง","ctx":"all","src":["ready-home-fires"]},{"text":"ติดเครื่องตรวจจับควันในห้องนอนและทางเดิน ทดสอบสม่ำเสมอ","detail":"เครื่องที่ทำงานได้เพิ่มโอกาสรอดอย่างมาก โดยเฉพาะไฟไหม้ตอนหลับ เปลี่ยนถ่านตามกำหนด และเปลี่ยนทั้งตัวเมื่อครบ 10 ปี","ctx":"all","src":["ready-home-fires","ddpm-prevent"]},{"text":"เดินสำรวจบันไดหนีไฟทุกตัวในชั้นของคุณ นับจำนวนประตูจากห้องถึงบันได","detail":"ในควันจะมองไม่เห็นป้าย ต้องคลำผนังนับประตูไปได้ ตรวจด้วยว่าประตูหนีไฟไม่ล็อก ไม่มีของวางขวาง และปิดสนิทเองได้ ถ้าพบปัญหาให้แจ้งนิติบุคคลเป็นลายลักษณ์อักษร","ctx":"condo","src":["nida-highrise","wiki-wangfuk"]},{"text":"เหล็กดัดต้องมีช่องเปิดฉุกเฉินอย่างน้อย 1 ช่อง และทุกคนรู้ที่เก็บกุญแจ","detail":"เก็บกุญแจใกล้ช่องเปิด หยิบได้ในความมืด แต่พ้นมือคนนอก ลองไขเป็นระยะกันสนิมติด ห้องนอนทุกห้องควรออกได้โดยไม่ต้องผ่านห้องที่ไฟไหม้","ctx":"house","src":["thairath-bars","ready-home-fires"]},{"text":"มีถังดับเพลิงในจุดหยิบง่ายใกล้ทางออก และฝึกใช้ให้เป็นทุกคน","detail":"บ้านทั่วไปใช้ชนิดอเนกประสงค์ A-B-C (เชื้อเพลิงทั่วไป ของเหลวไวไฟ ไฟฟ้า) ดูเข็มมาตรวัดให้อยู่ในช่องเขียว จำ ดึง-เล็ง-บีบ-ส่าย","ctx":"all","src":["usfa-extinguisher","ddpm-prevent"]},{"text":"ตรวจสายไฟ ปลั๊ก เครื่องใช้ไฟฟ้า ถ้าเก่าหรือชำรุดให้ซ่อมหรือเปลี่ยน","detail":"ไฟฟ้าลัดวงจรเป็นสาเหตุที่พบซ้ำในเหตุไฟไหม้ใหญ่ของไทย ถอดปลั๊กหลังใช้ ไม่เสียบปลั๊กพ่วงเกินกำลัง บ้านเก่าควรให้ช่างไฟตรวจระบบ","ctx":"all","src":["ddpm-prevent","thairath-pubs"]},{"text":"ห้ามชาร์จแบตฯ จักรยาน/สกูตเตอร์ไฟฟ้าขวางทางออก และห้ามชาร์จตอนหลับ","detail":"ไฟจากแบตลิเธียมลามเร็วและควันเป็นพิษ ใช้ที่ชาร์จตรงรุ่น หยุดใช้ทันทีถ้าแบตบวม ร้อนผิดปกติ มีกลิ่นหรือเสียงแปลก ไม่ชาร์จมือถือหรือพาวเวอร์แบงก์บนที่นอนหรือโซฟา","ctx":"all","src":["lfb-ebike","lfb-chargers","ddpm-prevent"]},{"text":"ถังแก๊สต้องมีตรารับรอง ไม่บุบไม่เป็นสนิม ใช้สายสำหรับแก๊สโดยเฉพาะ","detail":"ปิดวาล์วที่หัวถังทุกครั้งหลังใช้ ไม่ทิ้งเตาที่ติดไฟไว้ เปลี่ยนเข็มขัดรัดสายทุก 2 ปี ตรวจรอยรั่วด้วยน้ำสบู่ ถ้ามีฟองแสดงว่ารั่ว","ctx":"house","src":["ddpm-lpg"]},{"text":"ไม่เผาขยะหรือเศษวัชพืชในที่โล่ง โดยเฉพาะช่วงแล้งและลมแรง","detail":"เก็บกวาดใบไม้แห้งและของติดไฟง่ายรอบบ้าน ดับธูปเทียนก่อนนอน ดับก้นบุหรี่ให้สนิทก่อนทิ้ง","ctx":"house","src":["ddpm-prevent"]},{"text":"ดูว่าตึกมีสัญญาณเตือน สปริงเกลอร์ และสายฉีดน้ำที่ใช้งานได้จริง","detail":"ถามนิติบุคคลถึงรอบการตรวจและการซ้อมหนีไฟประจำปี ที่ฮ่องกงปี 2025 สัญญาณเตือนทั้ง 8 ตึกไม่ดัง คนรู้ตัวจากเพื่อนบ้านเคาะประตู","ctx":"condo","src":["wiki-wangfuk"]},{"text":"ปิดประตูห้องนอนตอนนอน และไม่วางของขวางทางเดินกับประตู","detail":"ประตูที่ปิดช่วยชะลอควันและความร้อน ทำให้มีเวลาหนีมากขึ้น ทางออกต้องโล่งพอให้เดินได้ในความมืด","ctx":"all","src":[]},{"text":"บันทึกเบอร์ 199 ดับเพลิง 1669 แพทย์ฉุกเฉิน 191 ตำรวจ 1784 ปภ.","detail":"สอนเด็กให้บอกที่อยู่ ชั้น และเลขห้องได้เอง ติดเบอร์และที่อยู่ไว้ข้างประตู","ctx":"all","src":["ddpm-1784"]},{"text":"ตกลงล่วงหน้าว่าใครพาเด็ก ผู้สูงอายุ และผู้ป่วยติดเตียงออก","detail":"คนที่ลงบันไดเองไม่ได้ต้องมีคนช่วยที่ระบุชื่อไว้ และควรแจ้งนิติบุคคลหรือเพื่อนบ้านให้รู้ว่าห้องนี้มีผู้ต้องการความช่วยเหลือ","ctx":"all","src":["nida-highrise"]}],"during":[{"text":"ตะโกน \"ไฟไหม้\" ปลุกทุกคน แล้วออกทันที ไม่เก็บของ","detail":"เวลาที่เหลือมักมีไม่กี่นาที กดสัญญาณแจ้งเหตุถ้าอยู่ระหว่างทาง แต่อย่ารอให้สัญญาณดังก่อนจึงออก เพราะระบบอาจเสีย","ctx":"all","src":["ready-home-fires","wiki-wangfuk"]},{"text":"ก้มต่ำหรือคลานใต้ควันไปยังทางออก","detail":"ควันและความร้อนลอยขึ้นสูง อากาศใกล้พื้นหายใจได้มากกว่า ควันทำให้หมดสติได้ก่อนไฟจะมาถึง","ctx":"all","src":["ready-home-fires"]},{"text":"แตะประตูและลูกบิดก่อนเปิด ถ้าร้อน ห้ามเปิด ใช้ทางอื่น","detail":"ใช้หลังมือแตะ ถ้าไม่ร้อนให้แง้มช้า ๆ ดูควันก่อน ถ้ามีควันหรือความร้อนพุ่งเข้ามาให้ปิดทันที","ctx":"all","src":["ready-home-fires"]},{"text":"ปิดประตูทุกบานตามหลังขณะหนี","detail":"ประตูที่ปิดช่วยกั้นไฟและควันไม่ให้ลามเข้าทางเดินและบันได ซึ่งเป็นทางรอดของคนอื่นด้วย","ctx":"all","src":["lfb-tower"]},{"text":"ใช้บันไดหนีไฟเท่านั้น ห้ามใช้ลิฟต์","detail":"ปล่องลิฟต์มีควันสะสมได้ และลิฟต์อาจค้างหรือเปิดประตูที่ชั้นไฟไหม้ ลงบันไดชิดด้านหนึ่งเพื่อเว้นทางให้นักดับเพลิง","ctx":"condo","src":["nida-highrise"]},{"text":"หนีลงล่าง ห้ามขึ้นดาดฟ้า และห้ามกระโดด","detail":"ไฟและควันลามขึ้นด้านบน ไม่มีหลักประกันว่าจะมีเฮลิคอปเตอร์มารับบนดาดฟ้า การกระโดดจากชั้นที่สูงกว่าชั้น 2 อันตรายถึงชีวิต","ctx":"condo","src":["nida-highrise"]},{"text":"ถ้าทางเดินหรือบันไดเต็มไปด้วยควัน ให้กลับเข้าห้องแล้วปิดประตู","detail":"อย่าฝ่าควันหนาลงบันได ลองบันไดหนีไฟอีกตัวก่อนถ้าไปถึงได้ ถ้าไม่ได้ ห้องที่ปิดประตูสนิทปลอดภัยกว่าทางเดินที่มีควัน","ctx":"condo","src":["lfb-tower","nida-highrise"]},{"text":"ติดอยู่ในห้อง: อุดช่องใต้ประตูและช่องลมด้วยผ้าเปียกหรือเทป","detail":"เลือกห้องที่มีหน้าต่างหรือระเบียงและอยู่ไกลไฟที่สุด ปิดประตูทุกบานระหว่างคุณกับไฟ อุดทุกช่องที่ควันเข้าได้","ctx":"all","src":["ready-home-fires","lfb-tower","nida-highrise"]},{"text":"โทร 199 บอกชื่อตึก ชั้น เลขห้อง และจำนวนคนที่ติดอยู่","detail":"โทรเมื่อพ้นอันตรายแล้ว หรือทันทีถ้าติดอยู่ข้างใน อย่าคิดว่ามีคนโทรแล้ว ถ้าโทรไม่ติดลอง 191 หรือ 1784","ctx":"all","src":["ddpm-1784","nida-highrise"]},{"text":"ส่งสัญญาณที่หน้าต่างหรือระเบียง: โบกผ้าสีสด ส่องไฟฉาย เป่านกหวีด","detail":"ให้เจ้าหน้าที่เห็นตำแหน่งของคุณ ไม่ทุบกระจกถ้าไม่จำเป็น เพราะเศษกระจกตกใส่คนข้างล่าง และจะปิดกั้นควันจากข้างนอกไม่ได้อีก","ctx":"condo","src":["nida-highrise","lfb-tower"]},{"text":"ไฟเล็กเท่านั้นจึงดับเอง: ดึงสลัก เล็งที่ฐานไฟ บีบ ส่ายซ้ายขวา","detail":"ดับเองเฉพาะเมื่อมีคนแจ้งดับเพลิงแล้ว ไฟยังอยู่ที่วัตถุชิ้นเดียว ไม่มีควันพิษ และทางออกอยู่ข้างหลังคุณ ถ้าไม่แน่ใจให้ออกทันที เด็กและผู้สูงอายุไม่ควรเป็นคนดับ","ctx":"all","src":["usfa-extinguisher"]},{"text":"แบตฯ ลิเธียมลุกไหม้: อย่าพยายามดับเอง ออกจากห้อง ปิดประตู โทร 199","detail":"ไฟจากแบตจักรยานหรือสกูตเตอร์ไฟฟ้าลามเร็วมากและปล่อยควันพิษ อาจปะทุซ้ำได้","ctx":"all","src":["lfb-ebike"]},{"text":"ไฟลุกที่ถังแก๊ส: ปิดวาล์วถ้าเข้าถึงได้อย่างปลอดภัย ถ้าไม่ได้ให้หนี","detail":"ปภ. แนะให้รีบปิดวาล์วถัง ถ้าปิดไม่ได้ให้ใช้ถังดับเพลิงเคมีแห้งฉีดจนดับสนิท หากไฟลามหรือเข้าใกล้ไม่ได้ ให้ทุกคนออกห่างและโทร 199","ctx":"house","src":["ddpm-lpg"]},{"text":"ไฟติดเสื้อผ้า: หยุด ล้มตัวลง กลิ้งไปมา หรือใช้ผ้าหนาคลุมดับ","detail":"ห้ามวิ่งเพราะไฟจะลุกแรงขึ้น จากนั้นให้น้ำสะอาดไหลผ่านแผลไหม้10–20 นาที แล้วไปพบแพทย์","ctx":"all","src":["ready-home-fires"]}],"after":[{"text":"ไปจุดรวมพล นับคนให้ครบ แจ้งเจ้าหน้าที่ทันทีถ้ามีคนยังอยู่ข้างใน","detail":"บอกตำแหน่งสุดท้ายที่เห็นคนนั้น ให้นักดับเพลิงเป็นคนเข้าไป อย่าเข้าไปเอง","ctx":"all","src":[]},{"text":"ห้ามกลับเข้าอาคารจนกว่าเจ้าหน้าที่ดับเพลิงจะอนุญาต","detail":"ไฟอาจปะทุซ้ำ โครงสร้างอาจถล่ม และยังมีก๊าซพิษค้างอยู่แม้มองไม่เห็นควัน","ctx":"all","src":["ready-home-fires"]},{"text":"สูดควันมา ไอ เสียงแหบ หายใจลำบาก เวียนหัว ให้โทร 1669","detail":"อาการจากการสูดควันอาจทรุดลงภายหลังได้ แม้ตอนแรกดูปกติ เด็ก ผู้สูงอายุ และผู้มีโรคปอดหรือหัวใจควรให้แพทย์ตรวจเสมอ","ctx":"all","src":[]},{"text":"แผลไหม้: ให้น้ำสะอาดไหลผ่าน ห้ามทายาสีฟัน น้ำปลา หรือน้ำแข็ง","detail":"ถอดแหวนและของรัดก่อนบวม คลุมด้วยผ้าสะอาดหลวม ๆ แผลกว้าง แผลลึก หรือแผลที่หน้า มือ และทางเดินหายใจ ต้องไปโรงพยาบาล","ctx":"all","src":["ready-home-fires"]},{"text":"ห้ามเปิดไฟฟ้าหรือแก๊สเองจนกว่าช่างจะตรวจแล้ว","detail":"สายไฟและท่อแก๊สที่โดนความร้อนหรือน้ำดับเพลิงอาจลัดวงจรหรือรั่วได้","ctx":"all","src":["ready-home-fires"]},{"text":"ถ่ายรูปความเสียหายทุกจุดก่อนเก็บกวาด เก็บใบเสร็จค่าใช้จ่ายไว้","detail":"ใช้เคลมประกันและขอความช่วยเหลือ แจ้งบริษัทประกันและธนาคารที่ผ่อนบ้านโดยเร็ว","ctx":"all","src":["ready-home-fires"]},{"text":"แจ้งความลงบันทึกประจำวัน และติดต่อเขต/อบต./เทศบาล หรือ ปภ. 1784","detail":"ใช้เป็นหลักฐานขอเอกสารราชการใหม่และขอรับความช่วยเหลือผู้ประส ี่ยงงดออกกลางแจ้ง คนทั่วไปลดเวลากลางแจ้ง","detail":"ตั้งแต่ 37.6 มคก./ลบ.ม. ให้ลดกิจกรรมนอกบ้าน เด็ก ผู้สูงอายุ หญิงตั้งครรภ์ และผู้มีโรคประจำตัวควรอยู่ในอาคาร","ctx":"all","src":["th-aqi","anamai-cleanroom","anamai-5"]},{"text":"สีแดง (75.1 ขึ้นไป): ทุกคนอยู่ในห้องปลอดฝุ่น ออกเท่าที่จำเป็นจริง ๆ","detail":"ถ้าต้องออกให้ใส่ N95 ตลอดเวลา และใช้เวลาข้างนอกให้สั้นที่สุด","ctx":"all","src":["anamai-cleanroom","th-aqi"]},{"text":"ปิดประตูหน้าต่างให้สนิท เปิดเครื่องฟอกแรงสุดตลอดเวลาในห้องปลอดฝุ่น","detail":"เครื่องฟอกได้ผลเฉพาะในห้องที่ปิด วางให้ลมเข้าออกไม่ถูกบัง เปิดไว้ทั้งกลางวันและตอนนอน","ctx":"all","src":["epa-cleanroom","anamai-5"]},{"text":"ออกนอกบ้านใส่ N95 ให้แนบหน้า: คลุมจมูกถึงใต้คาง บีบลวดจมูกให้สนิท","detail":"ลมรั่วตามขอบคืออากาศที่ไม่ผ่านการกรอง หนวดเคราทำให้แนบไม่สนิท หน้ากากแบบคล้องหูเช่น KF94 ใช้ได้เมื่อแนบจริงไม่มีช่อง ส่วนหน้ากากอนามัยธรรมดารั่วตามขอบมาก","ctx":"all","src":["epa-respirator","anamai-5"]},{"text":"งดออกกำลังกายกลางแจ้ง และเลี่ยงออกแรงหนักแม้อยู่ในบ้าน","detail":"ยิ่งหายใจเร็วและลึก ยิ่งสูดฝุ่นเข้าปอดมาก ย้ายไปออกกำลังเบา ๆ ในห้องที่ฟอกอากาศแล้ว","ctx":"all","src":["epa-cleanroom","moph-symptoms","cmu-doctors"]},{"text":"แน่นหน้าอก หายใจลำบาก หายใจมีเสียงวี้ด เหนื่อยง่าย: พบแพทย์ทันที","detail":"อาการรุนแรงหรือเป็นในผู้ป่วยโรคหัวใจและปอด โทร 1669 อาการอื่นที่ควรพบแพทย์: ไอไม่หยุด เวียนศีรษะ คลื่นไส้ ใจสั่น ตาพร่า","ctx":"all","src":["moph-symptoms","cmu-doctors","cdc-smoke"]},{"text":"ในห้องห้ามสูบบุหรี่ จุดธูปเทียน ยากันยุงแบบจุด ทอดหรือปิ้งย่าง","detail":"ล้วนสร้างฝุ่นละเอียดในห้องปิด รวมถึงเตาแก๊ส สเปรย์ และการดูดฝุ่นด้วยเครื่องที่ไม่มีแผ่นกรอง HEPA","ctx":"all","src":["epa-cleanroom","anamai-5"]},{"text":"เช็ดถูด้วยผ้าชุบน้ำหมาด ๆ ไม่กวาดและไม่ปัดฝุ่น","detail":"การกวาดทำให้ฝุ่นที่ตกแล้วฟุ้งกลับขึ้นมาในอากาศ","ctx":"all","src":["anamai-cleanroom","epa-cleanroom"]},{"text":"ไม่มีเครื่องฟอก: ทำเองจากพัดลมกับแผ่นกรอง HEPA หรือ MERV 13","detail":"ยึดแผ่นกรองแนบด้านหลังพัดลมให้ลมถูกดูดผ่านแผ่นตามลูกศรบนขอบ EPA ทดสอบกับพัดลมกล่อง 20 นิ้วได ator"]},{"text":"อย่าออกกำลังกายกลางแจ้งเมื่อค่าฝุ่นสีส้มหรือแดง","detail":"การหายใจแรงและลึกทำให้ได้รับฝุ่นมากขึ้นหลายเท่า","src":["moph-symptoms","cmu-doctors"]},{"text":"อย่าใช้เครื่องฟอกที่ปล่อยโอโซน","detail":"โอโซนระคายเคืองปอด EPA แนะให้เลี่ยงเครื่องที่ตั้งใจผลิตโอโซน","src":["epa-aircleaner"]},{"text":"อย่าเปิดเครื่องฟอกโดยเปิดหน้าต่างทิ้งไว้","detail":"เครื่องจะฟอกไม่ทันอากาศสกปรกที่ไหลเข้ามาตลอด","src":["epa-cleanroom","anamai-cleanroom"]},{"text":"อย่าจุดธูป เทียน ยากันยุง หรือปิ้งย่างในห้องที่ปิดอยู่","detail":"สร้างฝุ่นละเอียดในห้องได้สูงกว่าข้างนอก","src":["epa-cleanroom","anamai-5"]},{"text":"อย่าใช้เตาถ่าน เตาแก๊ส หรือเครื่องยนต์ในห้องที่ปิดสนิท","detail":"เสี่ยงก๊าซคาร์บอนมอนอกไซด์ซึ่งไม่มีสีไม่มีกลิ่นและทำให้เสียชีวิตได้","src":[]},{"text":"อย่ากวาดหรือปัดฝุ่นแห้ง","detail":"ฝุ่นจะฟุ้งกลับขึ้นมา ให้เช็ดด้วยผ้าชุบน้ำแทน","src":["anamai-cleanroom","epa-cleanroom"]},{"text":"อย่าเผาขยะ ใบไม้ หรือตอซัง","detail":"เป็นต้นเหตุฝุ่นโดยตรง และเสี่ยงไฟลามในหน้าแล้ง","src":["anamai-5","thaipbs-chiangmai"]},{"text":"อย่าเชื่อว่าฉีดน้ำหรือพ่นละอองน้ำรอบบ้านจะลด PM2.5 ได้","detail":"ละอองน้ำใหญ่กว่าฝุ่นมากจึงจับฝุ่นขนาดนี้ได้น้อย ใช้เงินกับการปิดห้องและแผ่นกรองจะได้ผลกว่า","src":[]},{"text":"อย่ารอให้อาการหนักก่อนไปพบแพทย์","detail":"แน่นหน้าอก หายใจลำบาก หายใจมีเสียงวี้ด คืออาการระดับรุนแรงที่ต้องพบแพทย์ทันที","src":["moph-symptoms"]},{"text":"อย่าอุดห้องจนเปิดประตูหน้าต่างออกไม่ได้เมื่อเกิดเหตุฉุกเฉิน","detail":"ห้องปลอดฝุ่นต้องยังหนีไฟได้ ใช้เทปที่ดึงออกได้ด้วยมือ","src":["epa-cleanroom"]},{"text":"อย่าดูแค่ท้องฟ้าแล้วตัดสินว่าอากาศดี","detail":"PM2.5 มองไม่เห็นด้วยตาเปล่า วันที่ฟ้าดูใสก็อาจเกินมาตรฐานได้ ให้ดูค่าจากแอป","src":[]}],"kit":[{"name":"หน้ากาก N95 (หรือ KF94/KN95 ที่แนบหน้าจริง)","qty":"5–10 ชิ้น/คน","ctx":"all","why":"กรองฝุ่นละเอียดได้เมื่อแนบสนิท เปลี่ยนเมื่อสกปรกหรือหายใจยากขึ้น"},{"name":"หน้ากากขนาดเล็กสำหรับเด็กอายุ 2 ปีขึ้นไป","qty":"5–10 ชิ้น/เด็ก","ctx":"all","why":"หน้ากากผู้ใหญ่ไม่แนบหน้าเด็ก ต้องลองให้พอดีก่อนถึงฤดูฝุ่น"},{"name":"เคร /* ---------- state ----------
   เก็บเป็น "บ้าน" หลายหลัง ข้อมูลของบ้านเป็น field แบบ key -> [ค่า, เวลาแก้] เพื่อรวมข้อมูลจากหลายเครื่อง
   แบบข้อไหนแก้ทีหลังชนะ ข้อมูลจาก localStorage ไฟล์นำเข้า และเซิร์ฟเวอร์ถือว่าไม่น่าเชื่อถือ ต้องผ่าน cleanFields() เสมอ */
const KEY = "survival.v2", OLD_KEY = "survival.v1";
const PLAN = ["meet1","meet2","hub","refuge","people","health","notes"];
const PDEF = {adults:2,children:0,elders:0,pets:0,days:7,home:"both"};
const IDK = /^[a-z]+:[A-Za-z0-9-]{1,60}$/, SECRET = /^[A-Za-z0-9_-]{43}$/;
const obj = v => v && typeof v==="object" && !Array.isArray(v) ? v : {};
const rid = p => p + Date.now().toString(36) + Math.floor(Math.random()*1e6).toString(36);

// ตรวจค่าตามชนิดของ key คืน undefined ถ้าไม่ผ่าน (field ใหม่ต้องเพิ่มที่นี่ ไม่งั้นจะถูกทิ้ง)
function fieldValue(k, v){
  if(k==="name") return typeof v==="string" && v.trim() ? v.slice(0,40) : undefined;
  const m = /^([a-z])\.(.+)$/.exec(k); if(!m) return undefined;
  const t = m[1], r = m[2];
  if(t==="p"){ if(r==="home") return ["both","condo","house"].includes(v) ? v : undefined;
    if(!(r in PDEF) || !Number.isFinite(Number(v))) return undefined;
    return Math.max(r==="adults"||r==="days" ? 1 : 0, Math.min(r==="days" ? 365 : 20, Math.round(Number(v)))); }
  if(t==="c") return IDK.test(r) ? (v ? 1 : 0) : undefined;
  if(t==="e") return IDK.test(r) && (v==="" || /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : undefined;
  if(t==="u"){ if(!/^u[a-z0-9]{1,24}$/.test(r)) return undefined; if(v===null) return null; const c = obj(v);
    return /^[a-z]{1,10}$/.test(c.kit) && /^[a-z-]{1,30}$/.test(c.cat) && typeof c.n==="string" && c.n.trim() ? {kit:c.kit, cat:c.cat, n:c.n.slice(0,80)} : undefined; }
  if(t==="n") return PLAN.includes(r) && typeof v==="string" ? v.slice(0,4000) : undefined;
  return undefined;
}
function cleanFields(f){
  const out = {}, max = Date.now() + 3e5;   // ไม่ยอมรับเวลาในอนาคต กันเครื่องที่ตั้งนาฬิกาผิดชนะตลอด
  for(const k of Object.keys(obj(f)).slice(0,5000)){ const e = f[k]; if(!Array.isArray(e) || e.length!==2) continue;
    const v = fieldValue(k, e[0]), ts = Number(e[1]); if(v===undefined || !Number.isFinite(ts) || ts<0) continue;
    out[k] = [v, Math.min(Math.round(ts), max)]; }
  return out;
}
function mergeFields(a, b){
  let changed = false;
  for(const k in b){ const x = a[k], y = b[k];
    if(!x || y[1]>x[1] || (y[1]===x[1] && JSON.stringify(y[0])>JSON.stringify(x[0]))){ a[k] = y; changed = true; } }
  return changed;
}
function v1Fields(o, ts){
  const f = {}; o = obj(o);
  for(const k in PDEF) if(k in obj(o.profile)) f["p."+k] = [o.profile[k], ts];
  for(const k of Object.keys(obj(o.checks))) if(o.checks[k]) f["c."+k] = [1, ts];
  for(const k of Object.keys(obj(o.exp))) f["e."+k] = [o.exp[k], ts];
  for(const c of (Array.isArray(o.custom) ? o.custom : [])) f["u."+obj(c).id] = [c, ts];
  for(const k of PLAN) if(obj(o.plan)[k]) f["n."+k] = [o.plan[k], ts];
  return cleanFields(f);
}
function newHome(name, f){ return {id:rid("h"), f:Object.assign({name:[name, Date.now()]}, f||{}), sync:null}; }
function cleanDB(o){
  o = obj(o); const db = {cur:"", homes:{}, ui:{open:{}, showAll:obj(o.ui).showAll===true}};
  for(const id of Object.keys(obj(o.homes)).slice(0,30)){ const h = obj(o.homes[id]); if(!/^h[a-z0-9]{1,24}$/.test(id)) continue;
    const s = obj(h.sync), f = cleanFields(h.f); if(!f.name) f.name = ["บ้านของเรา", 0];
    db.homes[id] = {id, f, sync: SECRET.test(s.k) ? {k:s.k, ver:Math.max(0, Math.round(Number(s.ver))||0), dirty:!!s.dirty, at:Number(s.at)||0, gone:!!s.gone} : null}; }
  for(const k of Object.keys(obj(obj(o.ui).open)).slice(0,500)) if(IDK.test(k)) db.ui.open[k] = !!o.ui.open[k];
  db.cur = db.homes[o.cur] ? o.cur : Object.keys(db.homes)[0] || "";
  return db;
}
function loadDB(){
  let db = cleanDB(null);
  try{ db = cleanDB(JSON.parse(localStorage.getItem(KEY)||"null")); }catch(e){}
  if(!db.cur){ let f = {};
    try{ f = v1Fields(JSON.parse(localStorage.getItem(OLD_KEY)||"null"), Date.now()); }catch(e){}   // ย้ายข้อมูลจากเวอร์ชันบ้านเดียว
    const h = newHome("บ้านของเรา", f); db.homes[h.id] = h; db.cur = h.id; }
  return db;
}
let DB = loadDB();
const H = () => DB.homes[DB.cur];
function view(){
  const s = {profile:Object.assign({}, PDEF), checks:{}, exp:{}, custom:[], plan:{}, open:DB.ui.open, showAll:DB.ui.showAll, name:"บ้านของเรา"}, f = H().f;
  for(const k in f){ const v = f[k][0], t = k[0], r = k.slice(2);
    if(k==="name") s.name = v; else if(t==="p") s.profile[r] = v; else if(t==="c"){ if(v) s.checks[r] = true; }
    else if(t==="e"){ if(v) s.exp[r] = v; } else if(t==="u"){ if(v) s.custom.push({id:r, kit:v.kit, cat:v.cat, n:v.n}); } else if(t==="n") s.plan[r] = v; }
  s.custom.sort((a,b)=>a.id<b.id?-1:1);
  return s;
}
let S = view();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
// แก้ข้อมูลของบ้านปัจจุบัน: เวลาแก้ต้องมากกว่าค่าเดิมเสมอ เพื่อให้การแก้ล่าสุดในเครื่องนี้ชนะแม้นาฬิกาเครื่องช้า
function put(k, v){
  v = fieldValue(k, v); if(v===undefined) return;
  const h = H(), old = h.f[k];
  h.f[k] = [v, Math.max(Date.now(), old ? old[1]+1 : 0)];
  if(h.sync){ h.sync.dirty = true; h.sync.rev = (h.sync.rev||0)+1; queueSync(); }
  S = view(); save();
}
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const guides = () => DATA.guides.slice().sort((a,b)=>(ORDER.indexOf(a.id)+99)%99-(ORDER.indexOf(b.id)+99)%99);
const ctxOK = c => !c || c==="all" || S.profile.home==="both" || S.showAll || c===S.profile.home;
const persons = () => S.profile.adults + S.profile.children + S.profile.elders;
const whenOK = w => !w || (w==="child"&&S.profile.children>0) || (w==="elder"&&S.profile.elders>0) || (w==="pet"&&S.profile.pets>0);

function kitDays(kit){ const k = DATA.checklist.kits.find(k=>k.id===kit); return k && k.days ? k.days : S.profile.days; }
function qty(item, kit){
  const c = item.c && item.c[kit];
  if(!c) return item.q || "";
  const n = {person:persons(), child:S.profile.children, elder:S.profile.elders, pet:S.profile.pets}[c.per] ?? 1;
  const v = c.a * n * (c.day ? kitDays(kit) : 1);
  const r = v < 10 ? Math.ceil(v*10)/10 : Math.ceil(v);
  return r.toLocaleString("th-TH") + " " + c.u;
}
function hazardItems(){
  const out = [];
  for(const g of guides()) (g.kit||[]).forEach((k,i)=>{ if(k && k.name) out.push({id:"hz-"+g.id+"-"+i, cat:"hz-"+g.id, n:k.name, d:k.why, q:k.qty, ctx:k.ctx, k:["home"]}); });
  return out;
}
function kitItems(kit){
  const base = DATA.checklist.items.filter(i => i.k.includes(kit) && ctxOK(i.ctx) && whenOK(i.when));
  const custom = S.custom.filter(i => i.kit===kit).map(i => ({id:i.id, cat:i.cat, n:i.n, custom:true, k:[kit]}));
  return base.concat(kit==="home" ? hazardItems().filter(i=>ctxOK(i.ctx)) : [], custom);
}
function progress(kit){ const it = kitItems(kit); const done = it.filter(i=>S.checks[kit+":"+i.id]).length; return {done, total:it.length, pct: it.length?Math.round(done*100/it.length):0}; }
function expiring(){
  const out = [], now = Date.now();
  for(const k in S.exp){ const d = S.exp[k]; if(!d) continue;
    const days = Math.floor((new Date(d).getTime()-now)/864e5); if(days>60) continue;
    const [kit,id] = [k.slice(0,k.indexOf(":")), k.slice(k.indexOf(":")+1)];
    const item = kitItems(kit).find(i=>i.id===id); if(item) out.push({kit, item, days, date:d});
  }
  return out.sort((a,b)=>a.days-b.days);
}
const kitName = id => (DATA.checklist.kits.find(k=>k.id===id)||{}).name || id;

/* ---------- sync ----------
   บ้านที่แชร์มีรหัสลับ 32 ไบต์ (อยู่ในลิงก์เชิญและในเครื่องสมาชิกเท่านั้น) จากรหัสนี้แตกเป็น id ของบ้าน โทเคน และกุญแจเข้ารหัส
   เซิร์ฟเวอร์ได้รับแค่ id โทเคน และข้อมูลที่เข้ารหัสแล้ว จึงอ่านเนื้อหาไม่ได้ */
const SYNC = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://127.0.0.1:8787" : "https://survival-sync.thundererz.com";
const SYNC_ON = /*__SYNC_ON__*/true;   // build.py --no-sync ปิดการแชร์บ้านทั้งหมด
const canSync = SYNC_ON && !!(window.crypto && crypto.subtle) && /^https?:$/.test(location.protocol);
const enc = new TextEncoder();
function b64(u8){ let s = ""; for(let i=0; i<u8.length; i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64(s){ const b = atob(s.replace(/-/g,"+").replace(/_/g,"/")); const u = new Uint8Array(b.length); for(let i=0; i<b.length; i++) u[i] = b.charCodeAt(i); return u; }
const KC = {};
async function keysOf(secret){
  if(KC[secret]) return KC[secret];
  const raw = await crypto.subtle.importKey("raw", unb64(secret), "HKDF", false, ["deriveBits","deriveKey"]);
  const hk = info => ({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(0), info:enc.encode("survival/"+info)});
  const bits = async (info, n) => b64(new Uint8Array(await crypto.subtle.deriveBits(hk(info), raw, n)));
  const aes = await crypto.subtle.deriveKey(hk("enc"), raw, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  return KC[secret] = {id:await bits("id",128), token:await bits("token",256), aes};
}
async function seal(aes, f){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, aes, enc.encode(JSON.stringify({f}))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64(out);
}
async function unseal(aes, data){
  const u = unb64(data);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:u.subarray(0,12)}, aes, u.subarray(12));
  return cleanFields(JSON.parse(new TextDecoder().decode(pt)).f);
}
const api = (K, path, opt) => fetch(SYNC+"/v1/h/"+K.id+(path||""), Object.assign({}, opt, {headers:Object.assign({Authorization:"Bearer "+K.token}, opt && opt.body ? {"Content-Type":"application/json"} : {})}));
async function syncHome(h){
  const s = h.sync; if(!s || s.gone || s.busy || !canSync || !navigator.onLine) return;
  s.busy = true; let changed = false;
  try{
    const K = await keysOf(s.k);
    let r = await api(K, "?since="+s.ver);
    if(r.status===404){ if(s.ver>0){ s.gone = true; return; } }   // เคยมีแล้วหาย = ถูกลบหรือเปลี่ยนรหัสจากเครื่องอื่น
    else if(r.status===200){ const j = await r.json(); let remote = {};
      try{ remote = await unseal(K.aes, j.data); }catch(_){}   // ของบนเซิร์ฟเวอร์เสียหรือถอดรหัสไม่ได้: ใช้ข้อมูลในเครื่องเขียนทับ
      changed = mergeFields(h.f, remote); s.ver = j.ver; if(mergeFields(remote, h.f)) s.dirty = true; }
    else if(r.status!==304) throw new Error("เซิร์ฟเวอร์ตอบ "+r.status);
    for(let i=0; s.dirty && i<4; i++){
      const rev = s.rev||0;
      r = await api(K, "", {method:"PUT", body:JSON.stringify({base:s.ver, data:await seal(K.aes, h.f)})});
      if(r.status===200){ s.ver = (await r.json()).ver; s.dirty = (s.rev||0)!==rev; }
      else if(r.status===409){ const j = await r.json(); let remote = {}; try{ remote = await unseal(K.aes, j.data); }catch(_){}
        if(mergeFields(h.f, remote)) changed = true; s.ver = j.ver; }
      else if(r.status===429){ queueSync(); break; }
      else throw new Error("เซิร์ฟเวอร์ตอบ "+r.status);
    }
    s.at = Date.now(); s.err = "";
  }catch(e){ s.err = String(e && e.message || e).slice(0,80); }
  finally{
    s.busy = false; save();
    if(h.id===DB.cur){ S = view(); const a = document.activeElement;
      if((changed || location.hash==="#set") && !(a && /^(INPUT|TEXTAREA)$/.test(a.tagName) && a.type!=="checkbox")) render(true); }
  }
}
const syncAll = () => Promise.all(Object.values(DB.homes).map(syncHome));
let syncTimer = 0;
function queueSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(syncAll, 2500); }
const inviteLink = h => location.origin + location.pathname + "#join=" + h.sync.k;
let JOIN = null, NOTE = "";   // JOIN = บ้านจากลิงก์เชิญที่รอผู้ใช้ยืนยัน, NOTE = ข้อความแจ้งผลครั้งเดียว
async function startJoin(text){
  const m = /([A-Za-z0-9_-]{43})\s*$/.exec(String(text).trim());
  if(!m){ NOTE = "ลิงก์เชิญไม่ถูกต้อง"; return; }
  const mine = Object.values(DB.homes).find(h=>h.sync && h.sync.k===m[1]);
  if(mine){ DB.cur = mine.id; S = view(); save(); NOTE = "เครื่องนี้อยู่ในบ้านนี้อยู่แล้ว"; return; }
  if(!canSync){ NOTE = "เบราว์เซอร์นี้ใช้การแชร์บ้านไม่ได้ ต้องเปิดผ่าน https"; return; }
  try{
    const K = await keysOf(m[1]), r = await api(K, "");
    if(r.status===404){ NOTE = "ไม่พบบ้านนี้ ลิงก์อาจถูกเปลี่ยนหรือลบแล้ว ขอลิงก์ใหม่จากคนในบ้าน"; return; }
    if(r.status!==200) throw 0;
    const j = await r.json(), f = await unseal(K.aes, j.data);
    JOIN = {k:m[1], ver:j.ver, f, name:f.name ? f.name[0] : "บ้านที่แชร์"};
  }catch(e){ NOTE = "เข้าร่วมไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่"; }
}

/* ---------- QR ของลิงก์เชิญ ----------
   ตัวสร้าง QR แบบย่อ: โหมดไบต์ ระดับแก้ผิดพลาด L รุ่น 1-6 (ยาวสุด 134 ไบต์ พอสำหรับลิงก์เชิญ) คืน null ถ้ายาวเกิน */
function qrMatrix(text, forceMask){
  const data = [...enc.encode(text)], CAP = [0,19,34,55,80,108,136], ECL = [0,7,10,15,20,26,18], NB = [0,1,1,1,1,1,2];
  let ver = 1; while(ver<=6 && data.length+2 > CAP[ver]) ver++;
  if(ver>6) return null;
  const size = ver*4+17, cap = CAP[ver], ecl = ECL[ver], nb = NB[ver], bl = cap/nb, bits = [];
  const push = (v,n) => { for(let i=n-1; i>=0; i--) bits.push((v>>>i)&1); };
  push(4,4); push(data.length,8); data.forEach(b=>push(b,8)); push(0, Math.min(4, cap*8-bits.length)); while(bits.length%8) bits.push(0);
  const cw = []; for(let i=0; i<bits.length; i+=8) cw.push(parseInt(bits.slice(i,i+8).join(""),2));
  for(let p=0xEC; cw.length<cap; p^=0xFD) cw.push(p);
  // Reed-Solomon บน GF(256)
  const ex = [], lg = []; for(let i=0,x=1; i<255; i++){ ex[i] = x; lg[x] = i; x <<= 1; if(x&256) x ^= 0x11d; }
  const mul = (a,b) => a && b ? ex[(lg[a]+lg[b])%255] : 0;
  let gen = [1]; for(let i=0; i<ecl; i++){ const g = gen.concat(0); for(let j=0; j<gen.length; j++) g[j+1] ^= mul(gen[j], ex[i]); gen = g; }
  const rs = d => { const r = new Array(ecl).fill(0); for(const b of d){ const f = b ^ r.shift(); r.push(0); for(let j=0; j<ecl; j++) r[j] ^= mul(gen[j+1], f); } return r; };
  const blocks = [], ecs = [], all = [];
  for(let i=0; i<nb; i++){ const d = cw.slice(i*bl, (i+1)*bl); blocks.push(d); ecs.push(rs(d)); }
  for(let i=0; i<bl; i++) for(const b of blocks) all.push(b[i]);
  for(let i=0; i<ecl; i++) for(const e of ecs) all.push(e[i]);
  // ลวดลายคงที่
  const M = Array.from({length:size}, ()=>new Array(size).fill(0)), F = Array.from({length:size}, ()=>new Array(size).fill(false));
  const set = (x,y,v) => { M[y][x] = v ? 1 : 0; F[y][x] = true; };
  const finder = (cx,cy) => { for(let dy=-4; dy<=4; dy++) for(let dx=-4; dx<=4; dx++){ const x = cx+dx, y = cy+dy; if(x<0 || y<0 || x>=size || y>=size) continue;
    const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d!==2 && d!==4); } };
  finder(3,3); finder(size-4,3); finder(3,size-4);
  for(let i=0; i<size; i++){ if(!F[6][i]) set(i,6,i%2===0); if(!F[i][6]) set(6,i,i%2===0); }
  if(ver>1){ const c = size-7; for(let dy=-2; dy<=2; dy++) for(let dx=-2; dx<=2; dx++) set(c+dx, c+dy, Math.max(Math.abs(dx),Math.abs(dy))!==1); }
  const fmt = mask => { const d = 8|mask; let r = d; for(let i=0; i<10; i++) r = (r<<1) ^ ((r>>>9)*0x537);
    const b = ((d<<10)|r) ^ 0x5412, g = i => (b>>>i)&1;
    for(let i=0; i<=5; i++) set(8,i,g(i)); set(8,7,g(6)); set(8,8,g(7)); set(7,8,g(8)); for(let i=9; i<15; i++) set(14-i,8,g(i));
    for(let i=0; i<8; i++) set(size-1-i,8,g(i)); for(let i=8; i<15; i++) set(8,size-15+i,g(i)); set(8,size-8,1); };
  fmt(0);   // จองพื้นที่ก่อนวางข้อมูล
  let n = 0;
  for(let right=size-1; right>=1; right-=2){ if(right===6) right = 5;
    for(let v=0; v<size; v++) for(let j=0; j<2; j++){ const x = right-j, y = ((right+1)&2)===0 ? size-1-v : v;
      if(!F[y][x] && n<all.length*8){ M[y][x] = (all[n>>>3]>>>(7-(n&7)))&1; n++; } } }
  const MASKS = [(x,y)=>(x+y)%2===0, (x,y)=>y%2===0, (x,y)=>x%3===0, (x,y)=>(x+y)%3===0, (x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,
    (x,y)=>x*y%2+x*y%3===0, (x,y)=>(x*y%2+x*y%3)%2===0, (x,y)=>((x+y)%2+x*y%3)%2===0];
  const apply = m => { for(let y=0; y<size; y++) for(let x=0; x<size; x++) if(!F[y][x] && MASKS[m](x,y)) M[y][x] ^= 1; };
  const penalty = () => { let p = 0; for(let a=0; a<size; a++) for(const row of [true,false]){ let run = 1;
      for(let b=1; b<size; b++){ const cur = row ? M[a][b] : M[b][a], prev = row ? M[a][b-1] : M[b-1][a];
        if(cur===prev){ run++; if(run===5) p += 3; else if(run>5) p++; } else run = 1; } }
    for(let y=0; y<size-1; y++) for(let x=0; x<size-1; x++) if(M[y][x]===M[y][x+1] && M[y][x]===M[y+1][x] && M[y][x]===M[y+1][x+1]) p += 3;
    return p; };
  let best = forceMask;
  if(best===undefined){ let low = Infinity; for(let m=0; m<8; m++){ apply(m); fmt(m); const p = penalty(); if(p<low){ low = p; best = m; } apply(m); } }
  apply(best); fmt(best);
  return M;
}
function qrSvg(text){
  const M = qrMatrix(text); if(!M) return "";
  const q = 4, n = M.length + q*2; let d = "";
  for(let y=0; y<M.length; y++) for(let x=0; x<M.length; x++) if(M[y][x]) d += "M"+(x+q)+" "+(y+q)+"h1v1h-1z";
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR ลิงก์เชิญ" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

  <h2>ข้อจำกัดของเนื้อหา</h2><div class="card">คู่มือนี้เป็นข้อมูลทั่วไปเพื่อการเตรียมตัว รวบรวมจากแหล่งที่ระบุไว้ในแต่ละคู่มือ ไม่ใช่คำแนะนำทางการแพทย์ กฎหมาย หรือวิศวกรรมเฉพาะกรณี ในเหตุจริงให้ทำตามคำสั่งของเจ้าหน้าที่ในพื้นที่ก่อนเสมอ ขนาดยาให้ยึดฉลากและคำแนะนำของแพทย์หรือเภสัชกร ผู้จัดทำไม่รับผิดชอบต่อความเสียหายจากการนำไปใช้</div>
  <h2>ข้อมูลที่แอปเก็บ</h2><div class="card"><ul class="plain">
  <li><b>ถ้าไม่ได้แชร์บ้าน:</b> เช็กลิสต์ วันหมดอายุ และแผนครอบครัวอยู่ในเครื่องของคุณเท่านั้น ไม่มีอะไรถูกส่งออก</li>
  <li><b>ถ้าแชร์บ้าน:</b> ข้อมูลของบ้านนั้นถูกเข้ารหัสในเครื่องด้วยกุญแจที่อยู่ในลิงก์เชิญ แล้วฝากไว้ที่เซิร์ฟเวอร์ซิงก์ ผู้ดูแลระบบไม่มีกุญแจและอ่านเนื้อหาไม่ได้</li>
  <li><b>สิ่งที่เซิร์ฟเวอร์เห็น:</b> รหัสอ้างอิงของบ้านแบบสุ่ม ขนาดข้อมูล เวลาที่ซิงก์ และค่าแฮชของที่อยู่ IP ที่ใช้จำกัดการสร้างบ้านต่อวัน (ลบภายในไม่กี่วัน)</li>
  <li><b>ไม่มี:</b> บัญชีผู้ใช้ อีเมล เบอร์โทร คุกกี้ติดตาม หรือโฆษณา</li></ul></div>
  <h2>การลบข้อมูล</h2><div class="card"><ul class="plain">
  <li>ลบจากเซิร์ฟเวอร์ได้เองที่ ตั้งค่า → หยุดแชร์ หรือเปลี่ยนรหัสบ้าน → ลบจากเซิร์ฟเวอร์</li>
  <li>บ้านที่ไม่มีเครื่องไหนเปิดเกิน 12 เดือนจะถูกลบจากเซิร์ฟเวอร์อัตโนมัติ</li>
  <li>ผู้ดูแลกู้ข้อมูลหรือรหัสบ้านให้ไม่ได้ ถ้าลิงก์เชิญหายจากทุกเครื่อง ข้อมูลที่ฝากไว้จะเปิดไม่ได้อีก</li></ul></div>
  <h2>ความรับผิดชอบของสมาชิกบ้าน</h2><div class="card">ทุกคนที่มีลิงก์เชิญเห็นและแก้ข้อมูลของบ้านได้ทั้งหมด รวมถึงข้อมูลสุขภาพที่บันทึกไว้ ส่งลิงก์ให้เฉพาะคนที่ไว้ใจ และเปลี่ยนรหัสบ้านเมื่อมีคนที่ไม่ควรเข้าถึงได้ลิงก์ไป</div>`;
}
function banner(){
  const note = NOTE ? `<div class="alert">${esc(NOTE)}</div>` : ""; NOTE = "";
  return note + (JOIN ? `<div class="card"><b>เข้าร่วมบ้าน "${esc(JOIN.name)}"?</b>
    <p class="mute">บ้านนี้มีคนแชร์ลิงก์มาให้ ทุกคนที่มีลิงก์เดียวกันจะเห็นและแก้ข้อมูลที่บันทึกในบ้านนี้ได้ รวมถึงแผนครอบครัวและข้อมูลสุขภาพ เข้าร่วมเฉพาะบ้านของคนที่คุณรู้จัก</p>
    <div class="btns"><button class="btn pri" data-act="joinok">เข้าร่วม</button><button class="btn" data-act="joinno">ยกเลิก</button></div></div>` : "");
}

/* ---------- router & events ---------- */
const TABS = [["home","🏠","หน้าแรก"],["list","☑️","เช็กลิสต์"],["sos","📞","ฉุกเฉิน"],["set","⚙️","ตั้งค่า"]];
function render(keepScroll){
  const [v,a,b] = (location.hash.slice(1)||"home").split("/");
  const y = window.scrollY;
  $("app").innerHTML = banner() + (v==="g" ? vGuide(a,b) : v==="list" ? vList(a||"go") : v==="sos" ? vSos() : v==="set" ? vSet() : v==="terms" ? vTerms() : vHome());
  const cur = v==="g" ? "home" : v==="terms" ? "set" : v;
  $("tabs").innerHTML = TABS.map(t=>`<a href="#${t[0]}" class="${t[0]===cur?"on":""}"><b>${t[1]}</b>${t[2]}</a>`).join("");
  window.scrollTo(0, keepScroll ? y : 0);
  const off = $("off"); if(off) off.textContent = (navigator.serviceWorker && navigator.serviceWorker.controller) ? "พร้อมใช้ออฟไลน์" : "เปิดจากไฟล์หรือยังไม่ได้ติดตั้ง";
  const qr = $("qr"); if(qr && typeof qrSvg==="function" && H().sync) qr.innerHTML = qrSvg(inviteLink(H()));
}
// ลิงก์เชิญมาในรูป #join=<รหัสลับ>: เก็บรหัสแล้วลบออกจากแถบที่อยู่และประวัติทันที
async function checkJoinHash(){
  const m = /^#join=(.+)$/.exec(location.hash); if(!m) return false;
  history.replaceState(null, "", location.pathname + "#home");
  await startJoin(m[1]); render(false); return true;
}
addEventListener("hashchange", async ()=>{ if(!(await checkJoinHash())) render(false); });

const kitNow = () => location.hash.split("/")[1] || "go";
// ปุ่มที่ย้อนกลับไม่ได้ต้องแตะสองครั้ง
function sure(t){ if(t.dataset.sure) return true; t.dataset.sure = 1; t.textContent = "แตะอีกครั้งเพื่อยืนยัน"; return false; }

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.chk){ put("c."+t.dataset.chk, t.checked ? 1 : 0); render(true); }
  else if(t.dataset.exp){ put("e."+t.dataset.exp, t.value || ""); render(true); }
  else if(t.dataset.name){ put("name", t.value.trim() || S.name); render(true); }
  else if(t.id==="imp" && t.files[0]){ const r = new FileReader(); r.onload = ()=>{
    try{ const o = JSON.parse(r.result); const f = o && o.v===2 ? cleanFields(o.f) : o && typeof o.profile==="object" ? v1Fields(o, Date.now()) : null;
      if(!f) throw 0; delete f.name;
      const h = H(); if(mergeFields(h.f, f) && h.sync){ h.sync.dirty = true; h.sync.rev = (h.sync.rev||0)+1; queueSync(); }
      S = view(); save(); NOTE = "นำเข้าข้อมูลแล้ว"; }
    catch(_){ NOTE = "ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอป"; }
    render(false); }; r.readAsText(t.files[0]); }
});
document.addEventListener("input", e=>{ const k = e.target.dataset.plan; if(k) put("n."+k, e.target.value); });
let printing = false;
addEventListener("beforeprint", ()=>{ printing = true; document.querySelectorAll("details.cat").forEach(d=>d.open = true); });
addEventListener("afterprint", ()=>{ printing = false; render(true); });
document.addEventListener("toggle", e=>{ const d = e.target; if(!printing && d.dataset && d.dataset.cat){ DB.ui.open[kitNow()+":"+d.dataset.cat] = d.open; save(); } }, true);
document.addEventListener("submit", async e=>{
  const d = e.target.dataset; if(!d.add && !d.newhome && !d.join) return; e.preventDefault();
  const n = e.target.n.value.trim(); if(!n) return;
  if(d.add) put("u."+rid("u"), {kit:kitNow(), cat:d.add, n});
  else if(d.newhome){ const h = newHome(n.slice(0,40)); DB.homes[h.id] = h; DB.cur = h.id; S = view(); save(); }
  else if(d.join){ await startJoin(n); render(false); return; }
  render(true);
});
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-act],[data-step],[data-days],[data-home],[data-del],[data-use]"); if(!t) return;
  const d = t.dataset, h = H();
  if(d.step){ const [k,n] = d.step.split(":"); put("p."+k, S.profile[k]+Number(n)); }
  else if(d.days){ e.preventDefault(); put("p.days", Number(d.days)); }
  else if(d.home){ e.preventDefault(); put("p.home", d.home); DB.ui.showAll = false; }
  else if(d.del){ put("u."+d.del, null); }
  else if(d.use){ if(DB.homes[d.use]) DB.cur = d.use; }
  else if(d.act==="showall"){ e.preventDefault(); DB.ui.showAll = !DB.ui.showAll; }
  else if(d.act==="print"){ window.print(); return; }
  else if(d.act==="export"){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({app:"survival", v:2, name:S.name, f:h.f},null,1)],{type:"application/json"}));
    a.download = "survival-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); return; }
  else if(d.act==="reset"){ if(!sure(t)) return;
    for(const k of Object.keys(h.f)){ const c = k[0]; if(k==="name") continue; put(k, c==="c" ? 0 : c==="u" ? null : c==="p" ? PDEF[k.slice(2)] : ""); } }
  else if(d.act==="delhome"){ if(Object.keys(DB.homes).length<2 || !sure(t)) return; delete DB.homes[h.id]; DB.cur = Object.keys(DB.homes)[0]; }
  else if(d.act==="share"){ h.sync = {k:b64(crypto.getRandomValues(new Uint8Array(32))), ver:0, dirty:true, at:0, gone:false}; save(); render(true); await syncHome(h); }
  else if(d.act==="syncnow"){ t.textContent = "กำลังซิงก์"; await syncHome(h); }
  else if(d.act==="copy"){ try{ await navigator.clipboard.writeText(inviteLink(h)); t.textContent = "คัดลอกแล้ว"; }catch(_){ const i = $("inv"); i.focus(); i.select(); t.textContent = "เลือกลิงก์ไว้แล้ว กดคัดลอกเอง"; } return; }
  else if(d.act==="send"){ try{ await navigator.share({title:"คู่มือเอาตัวรอด: "+S.name, text:"ลิงก์เข้าร่วมบ้าน "+S.name, url:inviteLink(h)}); }catch(_){} return; }
  else if(d.act==="unsync"){ if(!sure(t)) return; h.sync = null; }
  else if(d.act==="wipe" || d.act==="rotate"){ if(!sure(t)) return;
    try{ const old = await keysOf(h.sync.k);
      if(d.act==="rotate"){ h.sync = {k:b64(crypto.getRandomValues(new Uint8Array(32))), ver:0, dirty:true, at:0, gone:false}; save(); await syncHome(h);
        if(h.sync.dirty) throw 0; }   // ลบของเก่าเมื่อของใหม่ขึ้นเซิร์ฟเวอร์แล้วเท่านั้น
      const r = await api(old, "", {method:"DELETE"}); if(r.status!==200 && r.status!==404) throw 0;
      if(d.act==="wipe") h.sync = null;
      NOTE = d.act==="wipe" ? "ลบข้อมูลของบ้านนี้จากเซิร์ฟเวอร์แล้ว" : "เปลี่ยนรหัสบ้านแล้ว ส่งลิงก์เชิญใหม่ให้คนในบ้าน";
    }catch(_){ NOTE = "ทำไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่"; } }
  else if(d.act==="joinok" && JOIN){ const nh = newHome(JOIN.name, JOIN.f); nh.sync = {k:JOIN.k, ver:JOIN.ver, dirty:false, at:Date.now(), gone:false};
    DB.homes[nh.id] = nh; DB.cur = nh.id; JOIN = null; NOTE = "เข้าร่วมบ้านแล้ว"; }
  else if(d.act==="joinno"){ JOIN = null; }
  S = view(); save(); render(true);
});

(async ()=>{ if(!(await checkJoinHash())) render(false); syncAll(); })();
addEventListener("online", syncAll);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) syncAll(); });
setInterval(()=>{ if(!document.hidden) syncAll(); }, 60000);
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  // เมื่อมีเวอร์ชันใหม่เข้ามาแทน ให้โหลดหน้าใหม่หนึ่งครั้งเพื่อไม่ค้างเนื้อหาเก่า
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(had && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{ const off = $("off"); if(off) off.textContent = "พร้อมใช้ออฟไลน์"; }).catch(()=>{});
}
