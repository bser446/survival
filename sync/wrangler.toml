name = "survival-sync"
main = "src/index.js"
compatibility_date = "2025-09-01"

# โดเมนของบริการซิงก์ (ชั้นเดียวใต้ thundererz.com เพื่อให้ใบรับรองของ Cloudflare ครอบคลุม)
routes = [{ pattern = "survival-sync.thundererz.com", custom_domain = true }]
workers_dev = false          # ให้บริการทางโดเมนของเราทางเดียว ไม่เปิดที่ *.workers.dev
preview_urls = false

[vars]
ORIGINS = "https://survival.thundererz.com"

[[d1_databases]]
binding = "DB"
database_name = "survival-sync"
database_id = "323612a1-e4fa-4c07-8ba5-8cc23e595bd7"

[triggers]
crons = ["17 19 * * *"]   # ลบบ้านที่ถูกทิ้งและโควตาเก่า วันละครั้ง
